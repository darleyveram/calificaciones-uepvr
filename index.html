<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Calificaciones - UEPVR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-light py-4">

  <!-- ================= VISTA DE LOGIN ================= -->
  <div class="container" id="seccionLogin" style="max-width: 450px; margin-top: 50px;">
    <div class="card shadow-sm border-0">
      <div class="card-header bg-primary text-white text-center py-3">
        <h5 class="mb-0 fw-bold">UEP Vicente Rocafuerte</h5>
        <small>Portal Docente</small>
      </div>
      <div class="card-body p-4">
        <form id="formLogin" onsubmit="iniciarSesion(event)">
          <div class="mb-3">
            <label class="form-label">Correo institucional</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="docente@uepvr.edu.ec" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required>
          </div>
          <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>
          <button type="submit" class="btn btn-primary w-100 fw-semibold" id="btnLogin">
            Ingresar al Sistema
          </button>
        </form>
      </div>
    </div>
  </div>

  <!-- ================= VISTA PRINCIPAL (CALIFICACIONES) ================= -->
  <div class="container d-none" id="seccionApp" style="max-width: 900px;">
    
    <!-- Barra Superior -->
    <div class="d-flex justify-content-between align-items-center mb-4 pb-2 border-bottom">
      <div>
        <h4 class="fw-bold text-primary mb-0">UEP Vicente Rocafuerte</h4>
        <small class="text-muted" id="usuarioConectado"></small>
      </div>
      <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <!-- Formulario de Registro -->
    <div class="card shadow-sm mb-4">
      <div class="card-header bg-primary text-white">
        <h5 class="mb-0">Registrar Calificación</h5>
      </div>
      <div class="card-body">
        <form id="formNotas" onsubmit="guardarCalificacion(event)">
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label">Nombre del Estudiante</label>
              <input type="text" id="estudiante" class="form-control" placeholder="Ej. Juan Pérez" required>
            </div>
            <div class="col-md-6">
              <label class="form-label">Materia / Asignatura</label>
              <input type="text" id="materia" class="form-control" placeholder="Ej. Matemáticas" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Parcial 1 (0-10)</label>
              <input type="number" id="parcial1" class="form-control" step="0.01" min="0" max="10" placeholder="0.00" required>
            </div>
            <div class="col-md-3">
              <label class="form-label">Parcial 2 (0-10)</label>
              <input type="number" id="parcial2" class="form-control" step="0.01" min="0" max="10" placeholder="0.00" required>
            </div>
            <div class="col-md-6 d-flex align-items-end">
              <button type="submit" class="btn btn-success w-100 fw-semibold" id="btnGuardar">
                Guardar Registro
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <!-- Tabla de Calificaciones -->
    <div class="card shadow-sm">
      <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h6 class="mb-0">Listado de Notas</h6>
        <button class="btn btn-sm btn-outline-light" onclick="cargarNotas()">Actualizar</button>
      </div>
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-striped table-hover mb-0">
            <thead class="table-light">
              <tr>
                <th>Estudiante</th>
                <th>Materia</th>
                <th class="text-center">P1</th>
                <th class="text-center">P2</th>
                <th class="text-center">Promedio</th>
              </tr>
            </thead>
            <tbody id="tablaCuerpo">
              <tr><td colspan="5" class="text-center py-3">Cargando datos...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://sbomuqwntosvdsojlfyr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNib211cXdudG9zdmRzb2psZnlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5Mjk5NzcsImV4cCI6MjEwMjUwNTk3N30.WLgWyVOWVieC-4XjnkZFAKEqARKszvLpVqiAoGHdUU8';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // --- Control de Sesión y Vistas ---
    async function verificarSesion() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      
      const seccionLogin = document.getElementById('seccionLogin');
      const seccionApp = document.getElementById('seccionApp');

      if (session) {
        seccionLogin.classList.add('d-none');
        seccionApp.classList.remove('d-none');
        document.getElementById('usuarioConectado').innerText = `Docente: ${session.user.email}`;
        cargarNotas();
      } else {
        seccionLogin.classList.remove('d-none');
        seccionApp.classList.add('d-none');
      }
    }

    // --- Iniciar Sesión ---
    async function iniciarSesion(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errorDiv = document.getElementById('loginError');
      btn.disabled = true;
      btn.innerText = 'Verificando...';
      errorDiv.classList.add('d-none');

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorDiv.innerText = 'Credenciales incorrectas: ' + error.message;
        errorDiv.classList.remove('d-none');
        btn.disabled = false;
        btn.innerText = 'Ingresar al Sistema';
      } else {
        btn.disabled = false;
        btn.innerText = 'Ingresar al Sistema';
        verificarSesion();
      }
    }

    // --- Cerrar Sesión ---
    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      verificarSesion();
    }

    // --- Cargar Notas ---
    async function cargarNotas() {
      const tbody = document.getElementById('tablaCuerpo');
      tbody.innerHTML = '<tr><td colspan="5" class="text-center py-3">Cargando...</td></tr>';

      const { data, error } = await supabaseClient
        .from('calificaciones')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        tbody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-3">Error: ${error.message}</td></tr>`;
        return;
      }

      if (data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-3">No hay registros ingresados.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(item => `
        <tr>
          <td>${item.estudiante}</td>
          <td>${item.materia}</td>
          <td class="text-center">${parseFloat(item.parcial_1).toFixed(2)}</td>
          <td class="text-center">${parseFloat(item.parcial_2).toFixed(2)}</td>
          <td class="text-center fw-bold ${item.promedio >= 7 ? 'text-success' : 'text-danger'}">
            ${parseFloat(item.promedio).toFixed(2)}
          </td>
        </tr>
      `).join('');
    }

    // --- Guardar Registro ---
    async function guardarCalificacion(e) {
      e.preventDefault();
      const btn = document.getElementById('btnGuardar');
      btn.disabled = true;
      btn.innerText = 'Guardando...';

      const estudiante = document.getElementById('estudiante').value.trim();
      const materia = document.getElementById('materia').value.trim();
      const p1 = parseFloat(document.getElementById('parcial1').value);
      const p2 = parseFloat(document.getElementById('parcial2').value);

      const { error } = await supabaseClient
        .from('calificaciones')
        .insert([{ estudiante, materia, parcial_1: p1, parcial_2: p2 }]);

      if (error) {
        alert('Error al guardar: ' + error.message);
      } else {
        document.getElementById('formNotas').reset();
        await cargarNotas();
      }

      btn.disabled = false;
      btn.innerText = 'Guardar Registro';
    }

    // Escuchar cambios de autenticación
    supabaseClient.auth.onAuthStateChange((_event, _session) => {
      verificarSesion();
    });

    document.addEventListener('DOMContentLoaded', verificarSesion);
  </script>
</body>
</html>DOMContentLoaded', cargarNotas);
  </script>
</body>
</html>
