<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Calificaciones - UEPVR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .input-nota { width: 75px; text-align: center; }
    .col-prom { background-color: #f8f9fa; font-weight: bold; text-align: center; }
    th { vertical-align: middle; text-align: center; font-size: 0.85rem; }
    td { vertical-align: middle; }
  </style>
</head>
<body class="bg-light py-3">

  <!-- VISTA LOGIN -->
  <div class="container" id="seccionLogin" style="max-width: 420px; margin-top: 60px;">
    <div class="card shadow border-0">
      <div class="card-header bg-primary text-white text-center py-3">
        <h5 class="mb-0 fw-bold">UEP Vicente Rocafuerte</h5>
        <small>Portal Docente</small>
      </div>
      <div class="card-body p-4">
        <form onsubmit="iniciarSesion(event)">
          <div class="mb-3">
            <label class="form-label">Correo institucional</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="docente@uepvr.edu.ec" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="loginPassword" class="form-control" required>
          </div>
          <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>
          <button type="submit" class="btn btn-primary w-100 fw-bold" id="btnLogin">Ingresar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- VISTA PRINCIPAL (SÁBANA DE CALIFICACIONES) -->
  <div class="container-fluid px-4 d-none" id="seccionApp">
    
    <!-- Barra Superior -->
    <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom">
      <div>
        <h4 class="fw-bold text-primary mb-0">Unidad Educativa Particular "VICENTE ROCAFUERTE"</h4>
        <small class="text-muted" id="usuarioConectado"></small>
      </div>
      <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <!-- Barra de Filtros y Asignación -->
    <div class="card shadow-sm mb-3">
      <div class="card-body py-2">
        <div class="row g-3 align-items-center">
          <div class="col-md-4">
            <label class="form-label mb-1 fw-semibold">Asignatura / Curso asignado:</label>
            <select id="selectAsignacion" class="form-select form-select-sm" onchange="cargarPlanilla()">
              <option value="">Seleccione...</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label mb-1 fw-semibold">Trimestre:</label>
            <select id="selectTrimestre" class="form-select form-select-sm" onchange="cargarPlanilla()">
              <option value="1">Trimestre 1</option>
              <option value="2">Trimestre 2</option>
              <option value="3">Trimestre 3</option>
            </select>
          </div>
          <div class="col-md-6 text-end pt-3">
            <button class="btn btn-success btn-sm px-4 fw-bold" id="btnGuardarTodo" onclick="guardarPlanilla()">
              💾 Guardar Calificaciones
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tabla / Sábana de Notas -->
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-bordered table-sm mb-0">
            <thead class="table-dark">
              <tr>
                <th rowspan="2" style="width: 40px;">N°</th>
                <th rowspan="2">Nómina del Estudiante</th>
                <th colspan="3" class="bg-primary">PARCIAL 1 (35%)</th>
                <th colspan="3" class="bg-info text-dark">PARCIAL 2 (35%)</th>
                <th rowspan="2" style="width: 80px;">Examen (30%)</th>
                <th rowspan="2" class="bg-warning text-dark" style="width: 85px;">Prom. Trimestre</th>
                <th rowspan="2" style="width: 70px;">Comp.</th>
              </tr>
              <tr>
                <!-- Parcial 1 -->
                <th style="font-size: 0.75rem;">Ins. 1</th>
                <th style="font-size: 0.75rem;">Ins. 2</th>
                <th style="font-size: 0.75rem;">Total P1</th>
                <!-- Parcial 2 -->
                <th style="font-size: 0.75rem;">Ins. 1</th>
                <th style="font-size: 0.75rem;">Ins. 2</th>
                <th style="font-size: 0.75rem;">Total P2</th>
              </tr>
            </thead>
            <tbody id="tablaCuerpo">
              <tr><td colspan="10" class="text-center py-4 text-muted">Seleccione una asignatura para cargar la nómina.</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://sbomuqwntosvdsojlfyr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNib211cXdudG9zdmRzb2psZnlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5Mjk5NzcsImV4cCI6MjEwMjUwNTk3N30.WLgWyVOWVieC-4XjnkZFAKEqARKszvLpVqiAoGHdUU8';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let asignacionesDocente = [];
    let listaEstudiantes = [];

    // --- Autenticación ---
    async function verificarSesion() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const loginView = document.getElementById('seccionLogin');
      const appView = document.getElementById('seccionApp');

      if (session) {
        loginView.classList.add('d-none');
        appView.classList.remove('d-none');
        document.getElementById('usuarioConectado').innerText = `Docente: ${session.user.email}`;
        await cargarAsignaciones();
      } else {
        loginView.classList.remove('d-none');
        appView.classList.add('d-none');
      }
    }

    async function iniciarSesion(e) {
      e.preventDefault();
      const btn = document.getElementById('btnLogin');
      const errorDiv = document.getElementById('loginError');
      btn.disabled = true;
      btn.innerText = 'Verificando...';
      errorDiv.classList.add('d-none');

      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        errorDiv.innerText = error.message;
        errorDiv.classList.remove('d-none');
        btn.disabled = false;
        btn.innerText = 'Ingresar';
      } else {
        verificarSesion();
      }
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      verificarSesion();
    }

    // --- Cargar Cursos y Materias del Docente ---
    async function cargarAsignaciones() {
      const { data, error } = await supabaseClient
        .from('curso_materia_docente')
        .select(`
          id,
          curso_id,
          cursos (id, nombre),
          materias (id, nombre)
        `);

      if (!error && data) {
        asignacionesDocente = data;
        const select = document.getElementById('selectAsignacion');
        select.innerHTML = '<option value="">Seleccione...</option>' + 
          data.map(a => `<option value="${a.id}" data-curso="${a.curso_id}">${a.cursos.nombre} - ${a.materias.nombre}</option>`).join('');
      }
    }

    // --- Cargar Nómina y Notas ---
    async function cargarPlanilla() {
      const asignacionId = document.getElementById('selectAsignacion').value;
      const trimestre = parseInt(document.getElementById('selectTrimestre').value);
      const tbody = document.getElementById('tablaCuerpo');

      if (!asignacionId) {
        tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4 text-muted">Seleccione una asignatura.</td></tr>';
        return;
      }

      tbody.innerHTML = '<tr><td colspan="10" class="text-center py-4">Cargando nómina de estudiantes...</td></tr>';
      
      const asignacion = asignacionesDocente.find(a => a.id == asignacionId);
      
      // Obtener estudiantes del curso
      const { data: estData } = await supabaseClient
        .from('estudiantes')
        .select('*')
        .eq('curso_id', asignacion.curso_id)
        .order('numero_lista', { ascending: true });

      listaEstudiantes = estData || [];

      // Obtener notas existentes
      const { data: notasData } = await supabaseClient
        .from('notas_trimestre')
        .select('*')
        .eq('asignacion_id', asignacionId)
        .eq('trimestre', trimestre);

      const notasMap = {};
      (notasData || []).forEach(n => { notasMap[n.estudiante_id] = n; });

      // Renderizar tabla
      tbody.innerHTML = listaEstudiantes.map((est, idx) => {
        const n = notasMap[est.id] || {};
        const p1_i1 = n.p1_insumo1 ?? '';
        const p1_i2 = n.p1_insumo2 ?? '';
        const p2_i1 = n.p2_insumo1 ?? '';
        const p2_i2 = n.p2_insumo2 ?? '';
        const examen = n.examen ?? '';
        const comp = n.comportamiento || 'A';

        return `
          <tr data-estudiante-id="${est.id}">
            <td class="text-center fw-semibold">${idx + 1}</td>
            <td>${est.nombres}</td>
            <!-- Parcial 1 -->
            <td><input type="number" step="0.01" min="0" max="10" class="form-control form-control-sm input-nota p1-i1" value="${p1_i1}" oninput="calcularFila(this)"></td>
            <td><input type="number" step="0.01" min="0" max="10" class="form-control form-control-sm input-nota p1-i2" value="${p1_i2}" oninput="calcularFila(this)"></td>
            <td class="col-prom p1-total">0.00</td>
            <!-- Parcial 2 -->
            <td><input type="number" step="0.01" min="0" max="10" class="form-control form-control-sm input-nota p2-i1" value="${p2_i1}" oninput="calcularFila(this)"></td>
            <td><input type="number" step="0.01" min="0" max="10" class="form-control form-control-sm input-nota p2-i2" value="${p2_i2}" oninput="calcularFila(this)"></td>
            <td class="col-prom p2-total">0.00</td>
            <!-- Examen -->
            <td><input type="number" step="0.01" min="0" max="10" class="form-control form-control-sm input-nota examen" value="${examen}" oninput="calcularFila(this)"></td>
            <!-- Promedio Final Trimestre -->
            <td class="col-prom prom-trimestre text-primary">0.00</td>
            <!-- Comportamiento -->
            <td>
              <select class="form-select form-select-sm text-center comp" style="width: 60px;">
                <option value="A" ${comp==='A'?'selected':''}>A</option>
                <option value="B" ${comp==='B'?'selected':''}>B</option>
                <option value="C" ${comp==='C'?'selected':''}>C</option>
                <option value="D" ${comp==='D'?'selected':''}>D</option>
                <option value="E" ${comp==='E'?'selected':''}>E</option>
              </select>
            </td>
          </tr>
        `;
      }).join('');

      // Recalcular todos los valores iniciales
      document.querySelectorAll('#tablaCuerpo tr').forEach(fila => calcularFila(fila));
    }

    // --- Cálculos Matemáticos según Rúbrica Ministerial ---
    function calcularFila(elem) {
      const tr = elem.closest('tr');
      const p1_i1 = parseFloat(tr.querySelector('.p1-i1').value) || 0;
      const p1_i2 = parseFloat(tr.querySelector('.p1-i2').value) || 0;
      const p2_i1 = parseFloat(tr.querySelector('.p2-i1').value) || 0;
      const p2_i2 = parseFloat(tr.querySelector('.p2-i2').value) || 0;
      const ex = parseFloat(tr.querySelector('.examen').value) || 0;

      const p1_tot = (p1_i1 + p1_i2) / 2;
      const p2_tot = (p2_i1 + p2_i2) / 2;
      const prom_trim = (p1_tot * 0.35) + (p2_tot * 0.35) + (ex * 0.30);

      tr.querySelector('.p1-total').innerText = p1_tot.toFixed(2);
      tr.querySelector('.p2-total').innerText = p2_tot.toFixed(2);
      tr.querySelector('.prom-trimestre').innerText = prom_trim.toFixed(2);
    }

    // --- Guardado Masivo en Supabase (Upsert) ---
    async function guardarPlanilla() {
      const asignacionId = document.getElementById('selectAsignacion').value;
      const trimestre = parseInt(document.getElementById('selectTrimestre').value);
      const btn = document.getElementById('btnGuardarTodo');

      if (!asignacionId) {
        alert('Seleccione una asignatura.');
        return;
      }

      btn.disabled = true;
      btn.innerText = 'Guardando...';

      const filas = document.querySelectorAll('#tablaCuerpo tr');
      const payload = [];

      filas.forEach(tr => {
        const estId = tr.getAttribute('data-estudiante-id');
        if (estId) {
          payload.push({
            asignacion_id: parseInt(asignacionId),
            estudiante_id: parseInt(estId),
            trimestre: trimestre,
            p1_insumo1: parseFloat(tr.querySelector('.p1-i1').value) || 0,
            p1_insumo2: parseFloat(tr.querySelector('.p1-i2').value) || 0,
            p2_insumo1: parseFloat(tr.querySelector('.p2-i1').value) || 0,
            p2_insumo2: parseFloat(tr.querySelector('.p2-i2').value) || 0,
            examen: parseFloat(tr.querySelector('.examen').value) || 0,
            comportamiento: tr.querySelector('.comp').value
          });
        }
      });

      const { error } = await supabaseClient
        .from('notas_trimestre')
        .upsert(payload, { onConflict: 'asignacion_id,estudiante_id,trimestre' });

      if (error) {
        alert('Error al guardar: ' + error.message);
      } else {
        alert('¡Calificaciones guardadas exitosamente!');
      }

      btn.disabled = false;
      btn.innerText = '💾 Guardar Calificaciones';
    }

    document.addEventListener('DOMContentLoaded', verificarSesion);
  </script>
</body>
</html>
