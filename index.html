    function generarDiasHabilesRango(fInicioStr, fFinStr) {
      const dias = [];
      const nombresDias = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      const nombresMeses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      let cur = new Date(fInicioStr + 'T00:00:00');
      const fin = new Date(fFinStr + 'T00:00:00');
      while (cur <= fin) {
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          const yyyy = cur.getFullYear();
          const mm = String(cur.getMonth() + 1).padStart(2, '0');
          const dd = String(cur.getDate()).padStart(2, '0');
          dias.push({ iso: `${yyyy}-${mm}-${dd}`, diaNum: dd, nombreDia: nombresDias[day], nombreMes: nombresMeses[cur.getMonth()] });
        }
        cur.setDate(cur.getDate() + 1);
      }
      return dias;
    }

    function formatearNombreVisual(nombreCompleto) {
      if (!nombreCompleto) return '';
      const esMovil = window.innerWidth <= 768;
      if (!esMovil) return nombreCompleto;
      const partes = nombreCompleto.trim().split(/\s+/);
      if (partes.length >= 3) return `${partes[0]} ${partes[2]}`;
      if (partes.length === 2) return `${partes[0]} ${partes[1]}`;
      return partes[0];
    }

    function obtenerEscalaCualitativa(nota) {
      if (nota === null || nota === '' || isNaN(nota)) return '-';
      const n = parseFloat(nota);
      if (n >= 10.00) return 'A+';
      if (n >= 9.00) return 'A-';
      if (n >= 8.00) return 'B+';
      if (n >= 7.00) return 'B-';
      if (n >= 6.00) return 'C+';
      if (n >= 5.00) return 'C-';
      if (n >= 4.00) return 'D+';
      if (n >= 3.00) return 'D-';
      if (n >= 2.00) return 'E+';
      if (n >= 1.00) return 'E-';
      return 'F';
    }

    function obtenerEscalaComportamiento(nota) {
      if (nota === null || nota === '' || isNaN(nota)) return { letra: 'A', desc: 'Lidera el cumplimiento de los compromisos establecidos para la sana convivencia social.' };
      const n = parseFloat(nota);
      if (n >= 9.00) return { letra: 'A', desc: 'Lidera el cumplimiento de los compromisos establecidos para la sana convivencia social.' };
      if (n >= 7.00) return { letra: 'B', desc: 'Cumple con los compromisos establecidos para la sana convivencia social.' };
      if (n >= 5.00) return { letra: 'C', desc: 'Falla ocasionalmente en el cumplimiento de los compromisos establecidos.' };
      if (n >= 4.00) return { letra: 'D', desc: 'Presenta dificultades en el cumplimiento de los compromisos establecidos.' };
      return { letra: 'E', desc: 'No cumple con los compromisos establecidos para la sana convivencia social.' };
    }

    async function obtenerBase64DesdeUrl(url) {
      if (!url) return null;
      if (url.startsWith('data:image')) return url;
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = function () {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          } catch (err) { resolve(null); }
        };
        img.onerror = () => resolve(null);
        let urlFinal = url;
        if (url.includes('drive.google.com')) {
          const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
          if (match && match[1]) urlFinal = `https://lh3.googleusercontent.com/d/${match[1]}`;
        }
        img.src = urlFinal;
      });
    }

    function obtenerClaseColor(valor, esPromedio = false) {
      if (isNaN(valor) || valor === null || valor === '') return '';
      const n = parseFloat(valor);
      if (n < 4.00) return 'nota-baja-roja';
      if (n < 7.00) return 'nota-media-amarilla';
      if (esPromedio && n === 10.00) return 'nota-perfecta-10';
      if (esPromedio && n >= 7.00) return 'nota-aprobada-verde';
      return '';
    }

    function convertirCualitativo(nota) {
      const n = parseFloat(nota) || 0;
      if (n >= 9.00) return 'A';
      if (n >= 7.00) return 'B';
      if (n >= 5.00) return 'C';
      if (n >= 4.00) return 'D';
      return 'E';
    }

    async function verificarSesion() {
      await cargarInformacionInstitucionalDinamica();
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        const { data: perfil } = await supabaseClient.from('perfiles').select('*').eq('id', session.user.id).maybeSingle();
        usuarioActualPerfil = perfil;
        const nombreDocente = perfil ? `${perfil.titulo ? perfil.titulo + ' ' : ''}${perfil.nombres} ${perfil.apellidos || ''}`.trim() : session.user.email;
        document.getElementById('seccionLogin').classList.add('d-none');
        document.getElementById('seccionApp').classList.remove('d-none');
        document.getElementById('usuarioConectado').innerText = `Docente: ${nombreDocente}`;
        const { data: cursosT } = await supabaseClient.from('cursos').select('*').eq('tutor_id', session.user.id);
        cursosTutor = cursosT || [];
        const esAdmin = perfil?.rol === 'admin';
        const esTutor = cursosTutor.length > 0;
        const puedeVerAsistencia = (esAdmin || perfil?.puede_gestionar_asistencia === true);

        if (esTutor) document.getElementById('badgeTutorInfo').classList.remove('d-none');
        if (puedeVerAsistencia) document.getElementById('optModoAsistencia').classList.remove('d-none');
        if (esAdmin || esTutor) document.getElementById('optModoTutoria').classList.remove('d-none');
        
        // --- NUEVA RESTRICCIÓN PARA EL REPORTE TOTAL ---
        if (esAdmin) {
          const optRepEst = document.getElementById('optModoReporteEstudiante');
          if (optRepEst) optRepEst.classList.remove('d-none');
          
          const optCert = document.getElementById('optModoCertificados');
          if (optCert) optCert.classList.remove('d-none');
        }
        // -----------------------------------------------

        await cargarCatalogo();
        await cargarPeriodosAsistenciaDB();
        await cargarCursosYMaterias(session.user.id, perfil?.rol, perfil?.puede_gestionar_asistencia);
      } else {
        document.getElementById('seccionLogin').classList.remove('d-none');
        document.getElementById('seccionApp').classList.add('d-none');
      }
    }

    async function iniciarSesion(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        const errDiv = document.getElementById('loginError');
        errDiv.innerText = error.message;
        errDiv.classList.remove('d-none');
      } else {
        verificarSesion();
      }
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function cargarPeriodosAsistenciaDB() {
      const { data } = await supabaseClient.from('asistencia_periodos').select('*').order('trimestre').order('parcial');

    }

    async function cargarCursosYMaterias(userId, userRol, puedeAsistencia) {
      // Se agregó tutor_id en la consulta
      const { data: cData } = await supabaseClient.from('cursos').select('id, nombre, nombre_largo_mayuscula, tutor_id').order('id');
      todosCursos = cData || [];

      let query = supabaseClient.from('curso_materia_docente').select(`
        id, curso_id, materia_id, docente_id, docente_id_2, docente_id_3, es_optativa,
        cursos(id, nombre, nombre_largo_mayuscula),
        materias(id, nombre)
      `);

      if (userRol !== 'admin') {
        query = query.or(`docente_id.eq.${userId},docente_id_2.eq.${userId},docente_id_3.eq.${userId}`);
      }

      const { data } = await query;
      todasAsignaciones = data || [];

      alCambiarModo();
    }

    function alCambiarModo() {
      const modo = document.getElementById('selectModo').value;
      const boxMateria = document.getElementById('boxMateria');
      const boxVista = document.getElementById('boxVista');
      const boxParcialAsist = document.getElementById('boxParcialAsistencia');
      const boxParcialTut = document.getElementById('boxParcialTutoria');
      const optAnual = document.getElementById('optTrimAnual');
      const selectCurso = document.getElementById('selectCurso');

      const esAdmin = usuarioActualPerfil?.rol === 'admin';
      const puedeVerAsistencia = (esAdmin || usuarioActualPerfil?.puede_gestionar_asistencia === true);
      const cursoSeleccionadoPrevio = selectCurso.value;

      if (modo === 'tutoria') {
        boxMateria.classList.add('d-none'); boxVista.classList.add('d-none'); boxParcialAsist.classList.add('d-none'); boxParcialTut.classList.remove('d-none'); optAnual.classList.add('d-none');
        if (document.getElementById('selectTrimestre').value === 'anual') document.getElementById('selectTrimestre').value = '1';
        const cursosDisponibles = esAdmin ? todosCursos : cursosTutor;
        selectCurso.innerHTML = '<option value="">Seleccione curso...</option>' + cursosDisponibles.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
      } 
      else if (modo === 'asistencia') {
        boxMateria.classList.add('d-none'); boxVista.classList.add('d-none'); boxParcialAsist.classList.remove('d-none'); boxParcialTut.classList.add('d-none'); optAnual.classList.add('d-none');
        if (document.getElementById('selectTrimestre').value === 'anual') document.getElementById('selectTrimestre').value = '1';
        const cursosDisponibles = puedeVerAsistencia ? todosCursos : Array.from(new Map(todasAsignaciones.map(a => [a.cursos.id, a.cursos])).values());
        selectCurso.innerHTML = '<option value="">Seleccione curso...</option>' + cursosDisponibles.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
      } 
      else if (modo === 'reporte_estudiante') {
        boxMateria.classList.add('d-none'); boxVista.classList.add('d-none'); boxParcialAsist.classList.add('d-none'); boxParcialTut.classList.add('d-none'); optAnual.classList.add('d-none');
        let cursosDisponibles = [];
        if (esAdmin) {
            cursosDisponibles = todosCursos;
        } else {
            const mapCursos = new Map();
            cursosTutor.forEach(c => mapCursos.set(c.id, c));
            todasAsignaciones.forEach(a => { if (a.cursos) mapCursos.set(a.cursos.id, a.cursos); });
            cursosDisponibles = Array.from(mapCursos.values());
        }
        selectCurso.innerHTML = '<option value="">Seleccione curso...</option>' + cursosDisponibles.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
      }
      else if (modo === 'certificados') {
        boxMateria.classList.add('d-none'); boxVista.classList.add('d-none'); boxParcialAsist.classList.add('d-none'); boxParcialTut.classList.add('d-none'); optAnual.classList.add('d-none');
        // Solo admins ven esto, cargamos todos los cursos
        selectCurso.innerHTML = '<option value="">Seleccione curso...</option>' + todosCursos.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
      }
      else {
        boxMateria.classList.remove('d-none'); boxVista.classList.remove('d-none'); boxParcialAsist.classList.add('d-none'); boxParcialTut.classList.add('d-none'); optAnual.classList.remove('d-none');
        const cursosMap = new Map();
        todasAsignaciones.forEach(a => { if (a.cursos) cursosMap.set(String(a.cursos.id), a.cursos.nombre); });
        selectCurso.innerHTML = '<option value="">Seleccione curso...</option>' + Array.from(cursosMap).map(([id, nombre]) => `<option value="${id}">${nombre}</option>`).join('');
      }

      const opcionesActuales = Array.from(selectCurso.options).map(opt => opt.value);
      if (cursoSeleccionadoPrevio && opcionesActuales.includes(cursoSeleccionadoPrevio)) {
        selectCurso.value = cursoSeleccionadoPrevio;
      } else if (selectCurso.options.length > 1) {
        selectCurso.value = selectCurso.options[1].value;
      }

      alCambiarCurso();
    }

    function alCambiarCurso() {
      const modo = document.getElementById('selectModo').value;
      const cursoId = document.getElementById('selectCurso').value;
      const selectMateria = document.getElementById('selectMateria');
      if (modo === 'calificaciones') {
        if (!cursoId) { selectMateria.innerHTML = '<option value="">Seleccione materia...</option>'; selectMateria.disabled = true; cambiarFiltro(); return; }
        const materiasDelCurso = todasAsignaciones.filter(a => String(a.curso_id) === String(cursoId));
        selectMateria.innerHTML = '<option value="">Seleccione materia...</option>' + materiasDelCurso.map(a => `<option value="${a.id}">${a.materias.nombre} ${a.es_optativa ? '(Optativa)' : ''}</option>`).join('');
        selectMateria.disabled = false;
        if (materiasDelCurso.length > 0) { selectMateria.value = String(materiasDelCurso[0].id); } else { selectMateria.value = ""; }
      }
      cambiarFiltro();
    }

    function cambiarFiltro() {
      const modo = document.getElementById('selectModo').value;
      const cursoId = document.getElementById('selectCurso').value;
      const asigId = document.getElementById('selectMateria').value.trim();
      const trimestreVal = document.getElementById('selectTrimestre').value;
      const vistaVal = document.getElementById('selectVista').value;
      const controles = document.querySelectorAll('.btn-control');
      
      const accParcial = document.getElementById('accionesParcial');
      const accComp = document.getElementById('accionesComportamiento');
      const accResumen = document.getElementById('accionesResumen');
      const accAnual = document.getElementById('accionesAnual');
      const accAsist = document.getElementById('accionesAsistencia');
      const accTutoria = document.getElementById('accionesTutoria');
      const accCertificados = document.getElementById('accionesCertificados');

      accParcial.classList.add('d-none');
      accComp.classList.add('d-none');
      accResumen.classList.add('d-none');
      accAnual.classList.add('d-none');
      accAsist.classList.add('d-none');
      accTutoria.classList.add('d-none');
      if (accCertificados) accCertificados.classList.add('d-none');

      if (modo === 'tutoria') {
        accTutoria.classList.remove('d-none');
        if (!cursoId) {
          document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso de Tutoría para consultar el consolidado y emitir libretas.</div>';
          return;
        }
        const esAdmin = usuarioActualPerfil?.rol === 'admin';
        if (esAdmin) {
          document.getElementById('btnDescargarTodasLibretas').classList.remove('d-none');
          document.getElementById('btnDescargarZipIndividuales').classList.remove('d-none');
          document.getElementById('btnDescargarSabanaTutoria').classList.add('d-none');
        } else {
          document.getElementById('btnDescargarTodasLibretas').classList.add('d-none');
          document.getElementById('btnDescargarZipIndividuales').classList.add('d-none');
          document.getElementById('btnDescargarSabanaTutoria').classList.remove('d-none');
        }
        cargarVistaConsolidadoTutoria();
        return;
      }

      if (modo === 'asistencia') {
        accAsist.classList.remove('d-none');
        if (!cursoId) {
          controles.forEach(b => b.disabled = true);
          document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso para gestionar la Asistencia.</div>';
          return;
        }
        controles.forEach(b => b.disabled = false);
        cargarVistaAsistencia();
        return;
      }

      if (modo === 'reporte_estudiante') {
        if (!cursoId) {
          document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso para ver la lista de estudiantes.</div>';
          return;
        }
        cargarVistaListaEstudiantesReporte();
        return;
      }

      if (modo === 'certificados') {
        if (accCertificados) accCertificados.classList.remove('d-none');
        if (!cursoId) {
          document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso para generar certificados de matrícula.</div>';
          return;
        }
        cargarVistaCertificados();
        return;
      }

      if (trimestreVal === 'anual') {
        document.getElementById('boxVista').classList.add('d-none');
        accAnual.classList.remove('d-none');
      } else {
        document.getElementById('boxVista').classList.remove('d-none');
        if (vistaVal === 'comp1' || vistaVal === 'comp2') accComp.classList.remove('d-none');
        else if (vistaVal === 'resumen_trimestre') accResumen.classList.remove('d-none');
        else accParcial.classList.remove('d-none');
      }

      if (!asigId) {
        controles.forEach(b => b.disabled = true);
        document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso y una Materia para visualizar las calificaciones.</div>';
        return;
      }
      
      controles.forEach(b => b.disabled = false);

      if (trimestreVal === 'anual') cargarVistaResumenAnual();
      else if (vistaVal === 'comp1' || vistaVal === 'comp2') cargarVistaComportamiento(vistaVal === 'comp1' ? 1 : 2);
      else if (vistaVal === 'resumen_trimestre') cargarVistaResumenTrimestre();
      else cargarVistaParcial(vistaVal === 'p1' ? 1 : 2);
    }

    async function cargarVistaAsistencia() {
      const reqId = ++currentViewRequestId;
      const cursoId = document.getElementById('selectCurso').value.trim();
      const trimestre = parseInt(document.getElementById('selectTrimestre').value) || 1;
      const parcial = parseInt(document.getElementById('selectParcialAsistencia').value) || 1;
      const contenedor = document.getElementById('contenedorTabla');

      if (!cursoId) {
        if (reqId === currentViewRequestId) {
          contenedor.innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso para gestionar la Asistencia.</div>';
        }
        return;
      }

      // Limpia la tabla inmediatamente para mostrar el spinner
      contenedor.innerHTML = '<div class="py-4 text-center"><div class="spinner-border text-primary me-2"></div>Cargando sábana de control diario de asistencia...</div>';

      try {
        let per = periodosAsistencia.find(p => p.trimestre === trimestre && p.parcial === parcial);
        if (!per || !per.fecha_inicio || !per.fecha_fin) {
          const fallbacks = {
            '1-1': { fecha_inicio: '2026-05-04', fecha_fin: '2026-06-19', total_dias_laborados: 34, dias_no_laborados: 1 },
            '1-2': { fecha_inicio: '2026-06-22', fecha_fin: '2026-08-07', total_dias_laborados: 35, dias_no_laborados: 0 },
            '2-1': { fecha_inicio: '2026-08-10', fecha_fin: '2026-09-18', total_dias_laborados: 29, dias_no_laborados: 1 },
            '2-2': { fecha_inicio: '2026-09-21', fecha_fin: '2026-11-13', total_dias_laborados: 37, dias_no_laborados: 3 },
            '3-1': { fecha_inicio: '2026-11-16', fecha_fin: '2026-12-18', total_dias_laborados: 25, dias_no_laborados: 0 },
            '3-2': { fecha_inicio: '2026-12-21', fecha_fin: '2027-02-19', total_dias_laborados: 40, dias_no_laborados: 5 }
          };
          per = fallbacks[`${trimestre}-${parcial}`] || { fecha_inicio: '2026-05-04', fecha_fin: '2026-06-19', total_dias_laborados: 34, dias_no_laborados: 1 };
        }

        diasHabilesParcialActual = generarDiasHabilesRango(per.fecha_inicio, per.fecha_fin);

        const { data: estData, error: estErr } = await supabaseClient
          .from('estudiantes')
          .select('*')
          .eq('curso_id', parseInt(cursoId))
          .order('nombres');

        if (reqId !== currentViewRequestId) return;
        if (estErr) throw estErr;
        estudiantes = estData || [];

        if (estudiantes.length === 0) {
          contenedor.innerHTML = '<div class="py-4 text-warning text-center fw-bold">Este curso aún no tiene estudiantes registrados.</div>';
          return;
        }

        const { data: asistData } = await supabaseClient
          .from('asistencia_estudiantes')
          .select('*')
          .eq('curso_id', parseInt(cursoId))
          .eq('trimestre', trimestre)
          .eq('parcial', parcial);

        if (reqId !== currentViewRequestId) return;

        const asistMap = {};
        (asistData || []).forEach(a => { asistMap[a.estudiante_id] = a.registro_diario || {}; });

        const mesesColspan = {};
        diasHabilesParcialActual.forEach(d => { mesesColspan[d.nombreMes] = (mesesColspan[d.nombreMes] || 0) + 1; });

        let thMeses = '';
        for (const [mes, span] of Object.entries(mesesColspan)) { 
          thMeses += `<th colspan="${span}" class="bg-light text-uppercase fw-bold border-bottom">${mes}</th>`; 
        }

        let thDiasNum = diasHabilesParcialActual.map(d => `
          <th class="th-dia-asig bg-white p-1">
            <span class="d-block fw-bold">${d.diaNum}</span>
            <div class="d-flex justify-content-center gap-1 mt-1">
              <button type="button" class="btn btn-xs btn-outline-success btn-dia-auto" title="Llenar 'A'" onclick="llenarDiaColumna('${d.iso}', 'A')">A</button>
              <button type="button" class="btn btn-xs btn-outline-danger btn-dia-auto" title="Llenar 'F'" onclick="llenarDiaColumna('${d.iso}', 'F')">F</button>
              <button type="button" class="btn btn-xs btn-outline-secondary btn-dia-auto" title="Limpiar" onclick="llenarDiaColumna('${d.iso}', '')"><i class="bi bi-eraser-fill"></i></button>
            </div>
          </th>`).join('');

        let thDiasNom = diasHabilesParcialActual.map(d => `<th class="th-dia-asig bg-light text-muted" style="font-size:0.58rem;">${d.nombreDia.substring(0,2)}</th>`).join('');

        let html = `
          <div class="p-2 bg-light border-bottom d-flex justify-content-between align-items-center">
            <div>
              <span class="badge bg-primary me-2">Trimestre ${trimestre} - Parcial ${parcial}</span>
              <small class="fw-bold text-dark">Inicio: ${per.fecha_inicio} | Término: ${per.fecha_fin} | Días Hábiles: ${diasHabilesParcialActual.length} | Festivos/No Lab: ${per.dias_no_laborados || 0} | <b>Total Días: ${per.total_dias_laborados}</b></small>
            </div>
            <small class="text-muted"><i class="bi bi-hand-index-thumb me-1"></i>Haga clic en una casilla para alternar: <b>(Vacío) → A → F → J → (Vacío)</b></small>
          </div>

          <table class="table table-bordered table-sm mb-0 align-middle">
            <thead>
              <tr>
                <th rowspan="3" class="sticky-col-num">N°</th>
                <th rowspan="3" class="sticky-col-nombre text-center">NÓMINA DE ESTUDIANTES</th>
                ${thMeses}
                <th colspan="3" class="bg-primary text-white">SUMAN</th>
                <th rowspan="3" class="bg-success text-white" style="width: 50px;">TOTAL</th>
                <th rowspan="3" class="bg-secondary text-white" style="width: 60px;">DÍAS FALTANTES</th>
              </tr>
              <tr>
                ${thDiasNum}
                <th rowspan="2" class="bg-light text-success fw-bold" style="width: 35px;">A</th>
                <th rowspan="2" class="bg-light text-danger fw-bold" style="width: 35px;">F</th>
                <th rowspan="2" class="bg-light text-primary fw-bold" style="width: 35px;">J</th>
              </tr>
              <tr>${thDiasNom}</tr>
            </thead>
            <tbody id="tablaCuerpoAsistencia">
              ${estudiantes.map((est, idx) => {
                const regEst = asistMap[est.id] || {};
                const celdasDias = diasHabilesParcialActual.map(d => {
                  const val = (regEst[d.iso] || '').toUpperCase();
                  let claseColor = val === 'A' ? 'asig-a' : (val === 'F' ? 'asig-f' : (val === 'J' ? 'asig-j' : ''));
                  return `<td class="p-0"><input type="text" readonly class="cell-asig-input ${claseColor}" data-iso="${d.iso}" value="${val}" onclick="alternarEstadoAsistencia(this)"></td>`;
                }).join('');

                return `
                  <tr data-est-id="${est.id}">
                    <td class="sticky-col-num fw-bold text-muted">${idx + 1}</td>
                    <td class="sticky-col-nombre" title="${est.nombres}">${formatearNombreVisual(est.nombres)}</td>
                    ${celdasDias}
                    <td class="sum-a fw-bold text-success">0</td>
                    <td class="sum-f fw-bold text-danger">0</td>
                    <td class="sum-j fw-bold text-primary">0</td>
                    <td class="total-asist fw-bold bg-light">0</td>
                    <td class="dias-faltantes fw-bold text-muted">${per.total_dias_laborados}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;

        if (reqId === currentViewRequestId) {
          contenedor.innerHTML = html;
          document.querySelectorAll('#tablaCuerpoAsistencia tr').forEach(fila => calcularFilaAsistencia(fila));
        }

    function alternarEstadoAsistencia(input) {
      const actual = input.value.toUpperCase();
      let siguiente = actual === '' ? 'A' : (actual === 'A' ? 'F' : (actual === 'F' ? 'J' : ''));
      input.value = siguiente;
      input.className = 'cell-asig-input';
      if (siguiente === 'A') input.classList.add('asig-a');
      else if (siguiente === 'F') input.classList.add('asig-f');
      else if (siguiente === 'J') input.classList.add('asig-j');
      calcularFilaAsistencia(input.closest('tr'));
    }

    function calcularFilaAsistencia(tr) {
      const inputs = Array.from(tr.querySelectorAll('.cell-asig-input'));
      let a = 0, f = 0, j = 0;
      inputs.forEach(inp => {
        const v = inp.value.toUpperCase();
        if (v === 'A') a++; else if (v === 'F') f++; else if (v === 'J') j++;
      });

      const trimestre = parseInt(document.getElementById('selectTrimestre').value);
      const parcial = parseInt(document.getElementById('selectParcialAsistencia').value);
      const per = periodosAsistencia.find(p => p.trimestre === trimestre && p.parcial === parcial);
      const metaDias = per ? per.total_dias_laborados : diasHabilesParcialActual.length;
      
      const faltasRealesF = Math.max(metaDias - a - j, 0);

      tr.querySelector('.sum-a').innerText = a;
      tr.querySelector('.sum-f').innerText = faltasRealesF;
      tr.querySelector('.sum-j').innerText = j;
      tr.querySelector('.total-asist').innerText = a;
      tr.querySelector('.dias-faltantes').innerText = faltasRealesF;
    }

    function llenarDiaColumna(fechaIso, tipo) {
      document.querySelectorAll(`#tablaCuerpoAsistencia .cell-asig-input[data-iso="${fechaIso}"]`).forEach(inp => {
        inp.value = tipo;
        inp.className = 'cell-asig-input';
        if (tipo === 'A') inp.classList.add('asig-a');
        else if (tipo === 'F') inp.classList.add('asig-f');
        else if (tipo === 'J') inp.classList.add('asig-j');
      });
      document.querySelectorAll('#tablaCuerpoAsistencia tr').forEach(fila => calcularFilaAsistencia(fila));
    }

    async function verDetalleEstudiante(estId, nombresEst, cursoId) {
      const reqId = ++currentViewRequestId;
      const contenedor = document.getElementById('contenedorTabla');
      contenedor.innerHTML = '<div class="py-5 text-center"><div class="spinner-border text-primary" style="width: 3rem; height: 3rem;"></div><div class="mt-3 fw-bold text-muted">Recopilando el historial completo...</div></div>';

      try {
        // 1. Obtener materias del curso
        const { data: asigCurso } = await supabaseClient.from('curso_materia_docente').select(`id, materia_id, es_optativa, materias(nombre)`).eq('curso_id', cursoId);
        if (reqId !== currentViewRequestId) return;
        let asignaciones = asigCurso || [];
        asignaciones.sort((a, b) => a.es_optativa === b.es_optativa ? (a.materias?.nombre || '').localeCompare(b.materias?.nombre || '') : (a.es_optativa ? 1 : -1));
        const asigIds = asignaciones.map(a => a.id);

        // 2. Obtener TODAS las notas parciales, trimestrales, comportamiento y asistencia del estudiante
        const [resNotas, resTrim, resComp, resAsist] = await Promise.all([
          supabaseClient.from('notas_parcial_actividades').select('*').eq('estudiante_id', estId),
          supabaseClient.from('notas_trimestre').select('*').eq('estudiante_id', estId),
          supabaseClient.from('comportamiento_parcial').select('*').eq('estudiante_id', estId),
          supabaseClient.from('asistencia_estudiantes').select('*').eq('estudiante_id', estId)
        ]);
        if (reqId !== currentViewRequestId) return;

        // 3. Procesar Asistencia (Contar SOLO las 'F' leyendo el registro diario y agrupar por trimestre)
        const faltasDetalle = { 1: [], 2: [], 3: [] };
        let totalFaltasInjustificadas = 0;
        let totalDiasAsistidos = 0;

        (resAsist.data || []).forEach(a => {
            const trim = a.trimestre || 1;
            totalDiasAsistidos += (a.total_asistencias || 0);

            // Leer directamente de la base de datos el calendario diario
            if (a.registro_diario && typeof a.registro_diario === 'object') {
                for (const [fecha, estado] of Object.entries(a.registro_diario)) {
                    if (String(estado).toUpperCase() === 'F') {
                        if (!faltasDetalle[trim]) faltasDetalle[trim] = [];
                        faltasDetalle[trim].push(fecha);
                        totalFaltasInjustificadas++;
                    }
                }
            }
        });

        // Ordenar las fechas de las faltas
        [1, 2, 3].forEach(t => { if (faltasDetalle[t]) faltasDetalle[t].sort(); });

        // 4. Estructurar Datos Académicos por Materia
        const matrizNotas = {};
        asignaciones.forEach(a => {
          matrizNotas[a.id] = { nombre: a.materias?.nombre, es_optativa: a.es_optativa, t1: {p1:0, p2:0, ex:0}, t2: {p1:0, p2:0, ex:0}, t3: {p1:0, p2:0, ex:0} };
        });

        (resNotas.data || []).forEach(n => {
          if (matrizNotas[n.asignacion_id] && matrizNotas[n.asignacion_id][`t${n.trimestre}`]) {
             if (n.parcial === 1) matrizNotas[n.asignacion_id][`t${n.trimestre}`].p1 = n.nota_parcial || 0;
             if (n.parcial === 2) matrizNotas[n.asignacion_id][`t${n.trimestre}`].p2 = n.nota_parcial || 0;
          }
        });

        (resTrim.data || []).forEach(t => {
          if (matrizNotas[t.asignacion_id] && matrizNotas[t.asignacion_id][`t${t.trimestre}`]) {
             matrizNotas[t.asignacion_id][`t${t.trimestre}`].ex = t.examen || 0;
          }
        });

        // 5. Procesar Comportamiento Global
        let sumaComp = 0, cantComp = 0;
        (resComp.data || []).forEach(c => {
           sumaComp += (parseFloat(c.total_cuantitativo) || 10);
           cantComp++;
        });
        const compGeneralNum = cantComp > 0 ? (sumaComp / cantComp) : 10;
        const compGeneralLetra = convertirCualitativo(compGeneralNum);

        // 6. Calcular Promedios y preparar HTML Acordeón
        let sumaPromediosGlobales = 0;
        let materiasObligatorias = 0;
        let materiasProcesadasParaPDF = [];

        let htmlAcordeon = asignaciones.map((a, idx) => {
          const m = matrizNotas[a.id];
          const t1_prom = (m.t1.p1 * 0.35) + (m.t1.p2 * 0.35) + (m.t1.ex * 0.30);
          const t2_prom = (m.t2.p1 * 0.35) + (m.t2.p2 * 0.35) + (m.t2.ex * 0.30);
          const t3_prom = (m.t3.p1 * 0.35) + (m.t3.p2 * 0.35) + (m.t3.ex * 0.30);
          const promAnual = (t1_prom + t2_prom + t3_prom) / 3;
          
          if (!m.es_optativa) { sumaPromediosGlobales += promAnual; materiasObligatorias++; }

          materiasProcesadasParaPDF.push({
             nombre: m.nombre, optativa: m.es_optativa,
             t1_p1: m.t1.p1, t1_p2: m.t1.p2, t1_ex: m.t1.ex, t1_prom,
             t2_p1: m.t2.p1, t2_p2: m.t2.p2, t2_ex: m.t2.ex, t2_prom,
             t3_p1: m.t3.p1, t3_p2: m.t3.p2, t3_ex: m.t3.ex, t3_prom,
             promAnual
          });

          return `
            <div class="accordion-item border-0 border-bottom mb-1 shadow-sm">
              <h2 class="accordion-header" id="heading${idx}">
                <button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#collapse${idx}" style="font-size:0.8rem; font-weight:600;">
                  <div class="d-flex justify-content-between w-100 pe-3 align-items-center">
                    <span class="text-truncate" style="max-width: 65%;">${m.nombre}</span>
                    <span class="badge ${m.es_optativa ? 'bg-secondary' : obtenerClaseColor(promAnual, true)} fs-6">${m.es_optativa ? obtenerEscalaCualitativa(promAnual) : promAnual.toFixed(2)}</span>
                  </div>
                </button>
              </h2>
              <div id="collapse${idx}" class="accordion-collapse collapse" data-bs-parent="#acordeonMaterias">
                <div class="accordion-body p-2 bg-light">
                  <table class="table table-bordered table-sm text-center mb-0" style="font-size:0.7rem;">
                    <thead class="table-dark"><tr><th>Trimestre</th><th>P1 (35%)</th><th>P2 (35%)</th><th>Ex. (30%)</th><th>Promedio</th></tr></thead>
                    <tbody>
                      <tr><td class="fw-bold">1er Trim.</td><td>${m.t1.p1.toFixed(2)}</td><td>${m.t1.p2.toFixed(2)}</td><td>${m.t1.ex.toFixed(2)}</td><td class="fw-bold">${t1_prom.toFixed(2)}</td></tr>
                      <tr><td class="fw-bold">2do Trim.</td><td>${m.t2.p1.toFixed(2)}</td><td>${m.t2.p2.toFixed(2)}</td><td>${m.t2.ex.toFixed(2)}</td><td class="fw-bold">${t2_prom.toFixed(2)}</td></tr>
                      <tr><td class="fw-bold">3er Trim.</td><td>${m.t3.p1.toFixed(2)}</td><td>${m.t3.p2.toFixed(2)}</td><td>${m.t3.ex.toFixed(2)}</td><td class="fw-bold">${t3_prom.toFixed(2)}</td></tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          `;
        }).join('');

        const promGlobal = materiasObligatorias > 0 ? (sumaPromediosGlobales / materiasObligatorias) : 0;

        // 7. Guardar en memoria global para el PDF
        datosEstudianteActualReporte = {
           estId, nombresEst, cursoId, promGlobal, compGeneralNum, compGeneralLetra, totalFaltasInjustificadas, totalDiasAsistidos,
           materias: materiasProcesadasParaPDF
        };

        // Función para renderizar el detalle de fechas
        const renderFechas = (fechas) => fechas.length > 0 ? fechas.map(f => `<li class="list-group-item py-1 text-danger" style="font-size: 0.75rem;"><i class="bi bi-x-circle-fill me-2"></i>${f}</li>`).join('') : '<li class="list-group-item py-1 text-success" style="font-size: 0.75rem;"><i class="bi bi-check-circle-fill me-2"></i>Sin faltas</li>';

        // 8. DIBUJAR INTERFAZ (Dashboard y Modal integrados)
        contenedor.innerHTML = `
          <div class="p-2 mb-2 d-flex justify-content-between align-items-center border-bottom bg-white sticky-top" style="z-index: 5;">
             <button class="btn btn-sm btn-outline-secondary" onclick="cargarVistaListaEstudiantesReporte()"><i class="bi bi-arrow-left"></i> Volver</button>
             <button class="btn btn-sm btn-danger fw-bold shadow-sm" onclick="exportarReporteEstudiantePDF()"><i class="bi bi-file-pdf-fill me-1"></i> Descargar PDF</button>
          </div>
          <div class="px-2 pb-3">
             <div class="text-center mb-3">
               <h5 class="fw-bold text-primary mb-0">${nombresEst}</h5>
               <small class="text-muted">Historial de Rendimiento General</small>
             </div>
             
             <div class="row g-2 mb-3 text-center">
               <div class="col-4">
                 <div class="p-2 border rounded bg-white shadow-sm h-100">
                   <div style="font-size:0.65rem;" class="text-muted fw-bold text-uppercase mb-1">Prom. General</div>
                   <h4 class="mb-0 fw-bold ${obtenerClaseColor(promGlobal, true)} p-1 rounded">${promGlobal.toFixed(2)}</h4>
                 </div>
               </div>
               <div class="col-4">
                 <div class="p-2 border rounded bg-white shadow-sm h-100">
                   <div style="font-size:0.65rem;" class="text-muted fw-bold text-uppercase mb-1">Comportamiento</div>
                   <h4 class="mb-0 fw-bold text-success p-1">${compGeneralLetra}</h4>
                 </div>
               </div>
               <div class="col-4">
                 <div class="p-2 border rounded bg-white shadow-sm h-100" style="cursor: pointer;" data-bs-toggle="modal" data-bs-target="#modalFaltasEstudiante">
                   <div style="font-size:0.65rem;" class="text-muted fw-bold text-uppercase mb-1">Faltas (F)</div>
                   <div class="d-flex justify-content-around mt-1 border-bottom pb-1">
                     <div><small class="text-muted d-block" style="font-size:0.55rem;">T1</small><span class="fw-bold ${faltasDetalle[1].length > 0 ? 'text-danger' : 'text-success'}">${faltasDetalle[1].length}</span></div>
                     <div><small class="text-muted d-block" style="font-size:0.55rem;">T2</small><span class="fw-bold ${faltasDetalle[2].length > 0 ? 'text-danger' : 'text-success'}">${faltasDetalle[2].length}</span></div>
                     <div><small class="text-muted d-block" style="font-size:0.55rem;">T3</small><span class="fw-bold ${faltasDetalle[3].length > 0 ? 'text-danger' : 'text-success'}">${faltasDetalle[3].length}</span></div>
                   </div>
                   <div class="mt-1 text-primary fw-bold" style="font-size: 0.60rem;"><i class="bi bi-hand-index-thumb"></i> Ver Fechas</div>
                 </div>
               </div>
             </div>

             <h6 class="fw-bold border-bottom pb-1 text-secondary"><i class="bi bi-journal-text me-1"></i>Detalle de Asignaturas</h6>
             <div class="accordion" id="acordeonMaterias">
                ${htmlAcordeon}
             </div>
          </div>

          <!-- Modal Faltas Detalladas -->
          <div class="modal fade" id="modalFaltasEstudiante" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
              <div class="modal-content border-0 shadow">
                <div class="modal-header bg-danger text-white py-2">
                  <h6 class="modal-title fw-bold mb-0"><i class="bi bi-calendar-x"></i> Detalle de Faltas (F)</h6>

                    ${renderFechas(faltasDetalle[1])}
                    
                    <li class="list-group-item bg-light fw-bold text-dark py-1" style="font-size: 0.75rem;">2do Trimestre <span class="badge bg-danger float-end">${faltasDetalle[2].length}</span></li>
                    ${renderFechas(faltasDetalle[2])}
                    
                    <li class="list-group-item bg-light fw-bold text-dark py-1" style="font-size: 0.75rem;">3er Trimestre <span class="badge bg-danger float-end">${faltasDetalle[3].length}</span></li>
                    ${renderFechas(faltasDetalle[3])}

                </div>
              </div>
            </div>
          </div>
        `;

      } catch (err) {
        if (reqId === currentViewRequestId) contenedor.innerHTML = `<div class="py-4 text-danger text-center fw-bold">Error: ${err.message}</div>`;
      }

    async function exportarReporteEstudiantePDF() {
      if (!datosEstudianteActualReporte) return;
      const { jsPDF } = window.jspdf; 
      const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });
      
      const btn = document.querySelector('button[onclick="exportarReporteEstudiantePDF()"]');
      const originalHtml = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm"></span>';

      try {
        const d = datosEstudianteActualReporte;
        const cursoInfo = todosCursos.find(c => String(c.id) === String(d.cursoId));
        const nombreCursoLargo = (cursoInfo?.nombre_largo_mayuscula || cursoInfo?.nombre || '').toUpperCase();
        
        let nombreDocenteTutor = 'DOCENTE TUTOR';
        if (cursoInfo && cursoInfo.tutor_id) {
          try {
            const { data: prof } = await supabaseClient.from('perfiles').select('titulo, nombres, apellidos').eq('id', cursoInfo.tutor_id).maybeSingle();
            if (prof) nombreDocenteTutor = `${prof.titulo ? prof.titulo + ' ' : ''}${prof.nombres} ${prof.apellidos || ''}`.trim().toUpperCase();
          } catch(e) {}
        }

        const imgLogoIzq = await obtenerBase64DesdeUrl(infoInstitucion?.logo_izquierdo || infoInstitucion?.logo_institucion);
        const imgLogoDer = await obtenerBase64DesdeUrl(infoInstitucion?.logo_derecho || infoInstitucion?.escudo_nacional);
        const usuarioDescarga = usuarioActualPerfil ? `${usuarioActualPerfil.nombres} ${usuarioActualPerfil.apellidos || ''}`.trim().toUpperCase() : 'USUARIO';
        const fechaActual = new Date().toLocaleString('es-EC');

        // ARMADO DE TABLA PARA PDF
        const bodyData = d.materias.map((m, i) => [
            i + 1, 
            m.nombre + (m.optativa ? ' (Opt)' : ''),
            m.t1_p1.toFixed(2), m.t1_p2.toFixed(2), m.t1_ex.toFixed(2), m.t1_prom.toFixed(2),
            m.t2_p1.toFixed(2), m.t2_p2.toFixed(2), m.t2_ex.toFixed(2), m.t2_prom.toFixed(2),
            m.t3_p1.toFixed(2), m.t3_p2.toFixed(2), m.t3_ex.toFixed(2), m.t3_prom.toFixed(2),
            m.optativa ? obtenerEscalaCualitativa(m.promAnual) : m.promAnual.toFixed(2)
        ]);

        const headers = [
          [
            { content: 'N°', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: 'ASIGNATURAS', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: '1ER TRIMESTRE', colSpan: 4, styles: { halign: 'center', fillColor: [30, 41, 59] } },
            { content: '2DO TRIMESTRE', colSpan: 4, styles: { halign: 'center', fillColor: [15, 23, 42] } },
            { content: '3ER TRIMESTRE', colSpan: 4, styles: { halign: 'center', fillColor: [30, 41, 59] } },
            { content: 'PROM.\nANUAL', rowSpan: 2, styles: { valign: 'middle', halign: 'center', fillColor: [13, 110, 253] } }
          ],
          [
            {content:'P1'},{content:'P2'},{content:'EX'},{content:'PROM', styles:{fillColor:[241,245,249], textColor:[0,0,0]}},
            {content:'P1'},{content:'P2'},{content:'EX'},{content:'PROM', styles:{fillColor:[241,245,249], textColor:[0,0,0]}},
            {content:'P1'},{content:'P2'},{content:'EX'},{content:'PROM', styles:{fillColor:[241,245,249], textColor:[0,0,0]}}
          ]
        ];

        doc.autoTable({
          head: headers, body: bodyData,
          margin: { top: 48, bottom: 32, left: 10, right: 10 },
          theme: 'grid',
          styles: { fontSize: 7, cellPadding: 1.5, lineColor: [200, 200, 200], lineWidth: 0.1, valign: 'middle', halign: 'center' },
          headStyles: { textColor: [255, 255, 255], fontStyle: 'bold', fontSize: 6.5, halign: 'center' },
          columnStyles: { 0: { cellWidth: 8 }, 1: { cellWidth: 55, halign: 'left' } },
          didDrawPage: function (data) {
            const pageWidth = doc.internal.pageSize.getWidth();
            const pageHeight = doc.internal.pageSize.getHeight();

    function formatearFechaTexto(fechaIso) {
      if (!fechaIso) return '';
      const meses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      const partes = fechaIso.split('-');
      if (partes.length !== 3) return fechaIso;
      return `${meses[parseInt(partes[1]) - 1]} ${parseInt(partes[2])} del ${partes[0]}`;
    }

    // =========================================================================
    // FUNCIÓN AUXILIAR: Dibuja texto justificado con soporte para **negritas**
    // =========================================================================
    function dibujarTextoEnriquecidoJustificado(doc, text, startX, startY, maxWidth, lineHeight) {
        const tokens = text.split(/(\*\*.*?\*\*)/g);
        let words = [];
        tokens.forEach(token => {
            if (token.startsWith('**') && token.endsWith('**')) {
                const boldText = token.slice(2, -2);
                boldText.split(/(\s+)/).forEach(w => { if (w.length > 0) words.push({ text: w, font: 'bold' }); });
            } else if (token.length > 0) {
                token.split(/(\s+)/).forEach(w => { if (w.length > 0) words.push({ text: w, font: 'normal' }); });
            }
        });

        let currentY = startY;
        let lineWords = [];
        let currentLineWidth = 0;

        const flushLine = (line, y, isLast) => {
            while(line.length > 0 && line[line.length-1].text.trim() === '') line.pop();
            while(line.length > 0 && line[0].text.trim() === '') line.shift();
            if (line.length === 0) return;

            let textWidth = 0;
            let spaceTokens = [];
            line.forEach(w => {
                if (w.text.trim() === '') spaceTokens.push(w);
                else textWidth += w.w;
            });

            let extraSpacePerGap = 0;
            if (!isLast && spaceTokens.length > 0) {
                let totalMissing = maxWidth - textWidth;
                if (totalMissing < maxWidth * 0.4) {
                    extraSpacePerGap = totalMissing / spaceTokens.length;
                } else {
                    extraSpacePerGap = doc.setFont('helvetica', 'normal').getTextWidth(' ');
                }
            } else {
                extraSpacePerGap = doc.setFont('helvetica', 'normal').getTextWidth(' ');
            }

            let lx = startX;
            line.forEach(w => {
                if (w.text.trim() === '') {
                    lx += extraSpacePerGap;
                } else {
                    doc.setFont('helvetica', w.font);
                    doc.text(w.text, lx, y);
                    lx += w.w;
                }
            });
        };

        words.forEach(w => {
            doc.setFont('helvetica', w.font);
            w.w = doc.getTextWidth(w.text);
        });

        words.forEach(w => {
            if (w.text.trim() === '') {
                if (lineWords.length > 0) {
                    lineWords.push(w);
                    currentLineWidth += doc.setFont('helvetica', w.font).getTextWidth(' ');
                }
            } else {
                if (currentLineWidth + w.w > maxWidth && lineWords.length > 0) {
                    flushLine(lineWords, currentY, false);
                    currentY += lineHeight;
                    lineWords = [w];
                    currentLineWidth = w.w;
                } else {
                    lineWords.push(w);
                    currentLineWidth += w.w;
                }
            }
        });
        if (lineWords.length > 0) flushLine(lineWords, currentY, true);
    }

        doc.setFontSize(18);

        doc.text(`“VICENTE ROCAFUERTE”`, 105, 26, { align: 'center' });

        doc.setFontSize(9);
        doc.setTextColor(0, 0, 0);
        doc.setFont('helvetica', 'normal');
        doc.text(cantonProvincia, 105, 32, { align: 'center' });
        
        // --- FUNCIÓN INTERNA PARA CENTRAR TEXTOS COMBINADOS (Negrita + Normal) ---
        function centrarTextoMixto(textoNegrita, textoNormal, yPos) {
            doc.setFont('helvetica', 'bold');
            const w1 = doc.getTextWidth(textoNegrita);
            doc.setFont('helvetica', 'normal');
            const w2 = doc.getTextWidth(textoNormal);
            const totalWidth = w1 + w2;
            const startX = 105 - (totalWidth / 2); // 105 es el centro exacto de la hoja A4 (210mm / 2)

            doc.setFont('helvetica', 'bold');
            doc.text(textoNegrita, startX, yPos);
            doc.setFont('helvetica', 'normal');
            doc.text(textoNormal, startX + w1, yPos);
        }

        // Aplicando la función de centrado mixto con los datos de la base de datos
        centrarTextoMixto('Correo: ', correoIns, 37);
        centrarTextoMixto('Código AMIE: ', amie, 42);
        centrarTextoMixto('Teléfono: ', telefonoIns, 47);

        // TÍTULO DEL DOCUMENTO
        doc.setFont('helvetica', 'bold');
        doc.setFontSize(16);
        doc.text('CERTIFICADO DE MATRÍCULA', 105, 70, { align: 'center' });

        // CUERPO DEL CERTIFICADO (TEXTO ENRIQUECIDO Y JUSTIFICADO)
        const nombreEstudiante = est.nombres.toUpperCase();
        const cedulaEstudiante = est.cedula || 'S/N';
        const nombreCurso = cursoNombreLargo.toUpperCase();
        const textoFecha = formatearFechaTexto(fechaIso);

        // Se usa **texto** para indicar a la función que esa parte va en NEGRITA
        const parrafo1 = `Quien suscribe, **${nombreRector}**, Rector de la Unidad Educativa Particular “Vicente Rocafuerte” portador de cédula de identidad, N° **${cedulaRector}**, certifico que el/la estudiante **${nombreEstudiante}**, con cédula de identidad, N° **${cedulaEstudiante}**, previo el cumplimiento de los requisitos legales establecidos en el Reglamento General de la Ley Orgánica de Educación Intercultural vigente estuvo matriculado/a en **${nombreCurso}**, sección vespertina en el año lectivo ${periodo}.`;

        doc.setFontSize(11);
        dibujarTextoEnriquecidoJustificado(doc, parrafo1, 20, 90, 170, 7);

        doc.setFont('helvetica', 'normal');
        const parrafo2 = `Así consta en los registros de matrícula que reposan en esta institución.`;
        
        // AUMENTAMOS ESTA MEDIDA A 150 PARA DARLE EL ESPACIO NECESARIO
        doc.text(parrafo2, 20, 150);

        const parrafo3 = `Dado y firmado en Pichincha, ${textoFecha}`;
        
        // AUMENTAMOS ESTA MEDIDA A 170 PARA BAJARLA TAMBIÉN
        doc.text(parrafo3, 20, 170);

        // FIRMA DEL RECTOR (Centrada y adaptativa)
        const footerY = 220;
        
        // Convertir nombre a formato "Tipo Título" (Mayúscula inicial en cada palabra)
        const nombreRectorFormat = nombreRector.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1).toLowerCase()).join(' ');

        doc.setFont('helvetica', 'normal');
        doc.setFontSize(11);
        doc.text(nombreRectorFormat, 105, footerY, { align: 'center' });
        
        doc.setFont('helvetica', 'bold');
        doc.text('RECTOR U.E.P. VICENTE ROCAFUERTE', 105, footerY + 6, { align: 'center' });
        doc.text(`C.I. ${cedulaRector}`, 105, footerY + 12, { align: 'center' });
    }

    async function generarCertificadoIndividualPDF(idx) {
        const est = estudiantes[idx];
        if (!est) return;
        const fechaIso = document.getElementById('fechaCertificado').value;
        const cursoId = document.getElementById('selectCurso').value;
        const cursoInfo = todosCursos.find(c => String(c.id) === String(cursoId));
        const nombreCursoLargo = (cursoInfo?.nombre_largo_mayuscula || cursoInfo?.nombre || '').toUpperCase();

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const imgLogoIzq = await obtenerBase64DesdeUrl(infoInstitucion?.logo_izquierdo || infoInstitucion?.logo_institucion);
        const imgLogoDer = await obtenerBase64DesdeUrl(infoInstitucion?.logo_derecho || infoInstitucion?.escudo_nacional);

        construirPaginaCertificado(doc, est, nombreCursoLargo, fechaIso, imgLogoIzq, imgLogoDer);
        doc.save(`Certificado_Matricula_${est.nombres.replace(/\s+/g, '_')}.pdf`);
    }

    async function generarCertificadosLotePDF() {
        if (!estudiantes || estudiantes.length === 0) return alert('No hay estudiantes.');
        const fechaIso = document.getElementById('fechaCertificado').value;
        const cursoId = document.getElementById('selectCurso').value;
        const cursoInfo = todosCursos.find(c => String(c.id) === String(cursoId));
        const nombreCursoLargo = (cursoInfo?.nombre_largo_mayuscula || cursoInfo?.nombre || '').toUpperCase();

        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
        const imgLogoIzq = await obtenerBase64DesdeUrl(infoInstitucion?.logo_izquierdo || infoInstitucion?.logo_institucion);
        const imgLogoDer = await obtenerBase64DesdeUrl(infoInstitucion?.logo_derecho || infoInstitucion?.escudo_nacional);

        estudiantes.forEach((est, idx) => {
            if (idx > 0) doc.addPage();
            construirPaginaCertificado(doc, est, nombreCursoLargo, fechaIso, imgLogoIzq, imgLogoDer);
        });
        
        doc.save(`Certificados_${nombreCursoLargo.replace(/\s+/g, '_')}.pdf`);
    }

    async function descargarCertificadosZip() {
        if (!estudiantes || estudiantes.length === 0) return alert('No hay estudiantes.');
        const fechaIso = document.getElementById('fechaCertificado').value;
        const cursoId = document.getElementById('selectCurso').value;
        const cursoInfo = todosCursos.find(c => String(c.id) === String(cursoId));
        const nombreCursoLargo = (cursoInfo?.nombre_largo_mayuscula || cursoInfo?.nombre || '').toUpperCase();

        const imgLogoIzq = await obtenerBase64DesdeUrl(infoInstitucion?.logo_izquierdo || infoInstitucion?.logo_institucion);
        const imgLogoDer = await obtenerBase64DesdeUrl(infoInstitucion?.logo_derecho || infoInstitucion?.escudo_nacional);

        const { jsPDF } = window.jspdf;
        const zip = new JSZip();

        for (let i = 0; i < estudiantes.length; i++) {
            const est = estudiantes[i];
            const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
            construirPaginaCertificado(doc, est, nombreCursoLargo, fechaIso, imgLogoIzq, imgLogoDer);
            zip.file(`Certificado_${est.nombres.replace(/\s+/g, '_')}.pdf`, doc.output('blob'));
        }

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        saveAs(zipBlob, `Certificados_Matricula_${nombreCursoLargo.replace(/\s+/g, '_')}.zip`);
    }
