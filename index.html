<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Calificaciones - UEPVR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    th, td { font-size: 0.78rem; vertical-align: middle; text-align: center; }
    .col-nombre { text-align: left !important; min-width: 240px; font-weight: 600; }
    
    .th-actividad { width: 85px; min-width: 85px; padding: 4px 2px !important; background-color: #f8fafc; }
    .th-comp-ind { width: 62px; min-width: 62px; font-size: 0.68rem; padding: 4px 1px !important; line-height: 1.1; }
    
    .select-act-custom { font-size: 0.70rem; width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px; background-color: #fff; font-weight: 500; cursor: pointer; }
    .btn-del-col { font-size: 0.75rem; padding: 0 4px; line-height: 1; color: #dc3545; border: none; background: transparent; cursor: pointer; }
    .btn-del-col:hover { color: #a71d2a; font-weight: bold; }

    .input-nota-app { width: 58px; margin: 0 auto; text-align: center; font-weight: 500; padding: 2px 2px; }

    /* Semáforo de Calificaciones */
    .nota-baja-roja { background-color: #f8d7da !important; color: #842029 !important; font-weight: bold; }
    .nota-media-amarilla { background-color: #fff3cd !important; color: #664d03 !important; font-weight: bold; }
    .nota-aprobada-verde { background-color: #d1e7dd !important; color: #0f5132 !important; font-weight: bold; }
    .nota-perfecta-10 { background-color: #198754 !important; color: #ffffff !important; font-weight: bold; }

    /* Bloques de Comportamiento */
    .bg-comp-puntual { background-color: #3b5998 !important; color: #fff; }
    .bg-comp-limp { background-color: #b9770e !important; color: #fff; }
    .bg-comp-resp { background-color: #58d68d !important; color: #000; }
    .bg-comp-div { background-color: #e59866 !important; color: #000; }
    .bg-comp-patr { background-color: #f5b041 !important; color: #000; }
    .bg-comp-prop { background-color: #2e86c1 !important; color: #fff; }

    .bg-insumo1 { background-color: #0d6efd !important; color: #fff; }
    .bg-insumo2 { background-color: #0dcaf0 !important; color: #000; }
    .bg-prom-ins { background-color: #ffeb3b !important; font-weight: bold; color: #000; }
    .bg-nota-final { background-color: #198754 !important; color: #fff; font-weight: bold; }
    .bg-examen { background-color: #fd7e14 !important; color: #fff; font-weight: bold; }
    .bg-resumen-header { background-color: #343a40 !important; color: #fff; }
  </style>
</head>
<body class="bg-light py-3">

  <!-- LOGIN -->
  <div class="container" id="seccionLogin" style="max-width: 420px; margin-top: 60px;">
    <div class="card shadow border-0">
      <div class="card-header bg-primary text-white text-center py-3">
        <h5 class="mb-0 fw-bold">UEP Vicente Rocafuerte</h5>
        <small>Portal Docente</small>
      </div>
      <div class="card-body p-4">
        <form onsubmit="iniciarSesion(event)">
          <div class="mb-3">
            <label class="form-label">Correo institucional</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="docente@uepvr.edu.ec" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" id="loginPassword" class="form-control" required>
          </div>
          <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>
          <button type="submit" class="btn btn-primary w-100 fw-bold" id="btnLogin">Ingresar</button>
        </form>
      </div>
    </div>
  </div>

  <!-- APLICATIVO PRINCIPAL -->
  <div class="container-fluid px-3 d-none" id="seccionApp">
    
    <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
      <div>
        <h5 class="fw-bold text-primary mb-0">Unidad Educativa Particular "VICENTE ROCAFUERTE"</h5>
        <small class="text-muted" id="usuarioConectado"></small>
      </div>
      <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
    </div>

    <!-- Barra de Filtros -->
    <div class="card shadow-sm mb-3">
      <div class="card-body py-2">
        <div class="row g-2 align-items-center">
          
          <div class="col-md-2">
            <label class="form-label mb-1 fw-bold">Curso / Grado:</label>
            <select id="selectCurso" class="form-select form-select-sm" onchange="alCambiarCurso()">
              <option value="">Seleccione curso...</option>
            </select>
          </div>

          <div class="col-md-3">
            <label class="form-label mb-1 fw-bold">Materia / Asignatura:</label>
            <select id="selectMateria" class="form-select form-select-sm" onchange="cambiarFiltro()" disabled>
              <option value="">Seleccione materia...</option>
            </select>
          </div>
          
          <div class="col-md-2">
            <label class="form-label mb-1 fw-bold">Trimestre / Ciclo:</label>
            <select id="selectTrimestre" class="form-select form-select-sm" onchange="cambiarFiltro()">
              <option value="1">Trimestre 1</option>
              <option value="2">Trimestre 2</option>
              <option value="3">Trimestre 3</option>
              <option value="anual">📊 Resumen General Anual</option>
            </select>
          </div>

          <div class="col-md-2" id="boxVista">
            <label class="form-label mb-1 fw-bold">Evaluación / Parcial:</label>
            <select id="selectVista" class="form-select form-select-sm" onchange="cambiarFiltro()">
              <option value="p1">Parcial 1 (Insumos 1 y 2)</option>
              <option value="comp1">Comportamiento Parcial 1</option>
              <option value="p2">Parcial 2 (Insumos 1 y 2)</option>
              <option value="comp2">Comportamiento Parcial 2</option>
              <option value="resumen_trimestre">Examen y Resumen Trimestral</option>
            </select>
          </div>

          <!-- Botones Parciales Académicos -->
          <div class="col-md-3 text-end pt-3" id="accionesParcial">
            <button class="btn btn-outline-primary btn-sm me-1 btn-control" onclick="agregarActividad(1)" disabled>+ Ins. 1</button>
            <button class="btn btn-outline-info btn-sm me-1 text-dark btn-control" onclick="agregarActividad(2)" disabled>+ Ins. 2</button>
            <button class="btn btn-success btn-sm px-3 fw-bold btn-control" id="btnGuardarParcial" onclick="guardarDatos()" disabled>💾 Guardar Parcial</button>
          </div>

          <!-- Botones Comportamiento -->
          <div class="col-md-3 text-end pt-3 d-none" id="accionesComportamiento">
            <button class="btn btn-outline-secondary btn-sm me-1 btn-control" onclick="llenarTodoCon10Comportamiento()" disabled>⚡ Auto 10</button>
            <button class="btn btn-success btn-sm px-3 fw-bold btn-control" id="btnGuardarComp" onclick="guardarDatos()" disabled>💾 Guardar Comp.</button>
          </div>

          <!-- Botón Resumen Trimestre -->
          <div class="col-md-3 text-end pt-3 d-none" id="accionesResumen">
            <button class="btn btn-success btn-sm px-3 fw-bold btn-control" id="btnGuardarResumen" onclick="guardarDatos()" disabled>💾 Guardar Examen</button>
          </div>

          <!-- Botón Exportar PDF Anual -->
          <div class="col-md-3 text-end pt-3 d-none" id="accionesAnual">
            <button class="btn btn-danger btn-sm px-3 fw-bold btn-control" onclick="exportarResumenAnualPDF()">📄 Descargar PDF</button>
          </div>

        </div>
      </div>
    </div>

    <!-- Contenedor Dinámico de Tablas -->
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive" id="contenedorTabla">
          <div class="py-4 text-muted text-center">Seleccione un Curso y una Materia para visualizar las calificaciones.</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://sbomuqwntosvdsojlfyr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNib211cXdudG9zdmRzb2psZnlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5Mjk5NzcsImV4cCI6MjEwMjUwNTk3N30.WLgWyVOWVieC-4XjnkZFAKEqARKszvLpVqiAoGHdUU8';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let catalogo = [];
    let todasAsignaciones = [];
    let estudiantes = [];
    let configActividades = { insumo1: [], insumo2: [] };
    let notasActualesMemoria = {};
    let datosResumenAnualActual = [];

    // Colores semafóricos
    function obtenerClaseColor(valor, esPromedio = false) {
      if (isNaN(valor) || valor === null || valor === '') return '';
      const n = parseFloat(valor);
      if (n < 4.00) return 'nota-baja-roja';
      if (n < 7.00) return 'nota-media-amarilla';
      if (esPromedio && n === 10.00) return 'nota-perfecta-10';
      if (esPromedio && n >= 7.00) return 'nota-aprobada-verde';
      return '';
    }

    function convertirCualitativo(nota) {
      const n = parseFloat(nota) || 0;
      if (n >= 9.00) return 'A';
      if (n >= 8.00) return 'B';
      if (n >= 7.00) return 'C';
      if (n >= 6.00) return 'D';
      if (n >= 4.00) return 'E';
      return 'ERROR';
    }

    function resetearEstadoAplicacion() {
      catalogo = [];
      todasAsignaciones = [];
      estudiantes = [];
      configActividades = { insumo1: [], insumo2: [] };
      notasActualesMemoria = {};
      datosResumenAnualActual = [];

      const selectCurso = document.getElementById('selectCurso');
      if (selectCurso) selectCurso.innerHTML = '<option value="">Seleccione curso...</option>';

      const selectMateria = document.getElementById('selectMateria');
      if (selectMateria) {
        selectMateria.innerHTML = '<option value="">Seleccione materia...</option>';
        selectMateria.disabled = true;
      }

      const selectTrim = document.getElementById('selectTrimestre');
      if (selectTrim) selectTrim.value = '1';

      const selectVista = document.getElementById('selectVista');
      if (selectVista) selectVista.value = 'p1';

      const loginEmail = document.getElementById('loginEmail');
      const loginPass = document.getElementById('loginPassword');
      if (loginEmail) loginEmail.value = '';
      if (loginPass) loginPass.value = '';

      const loginError = document.getElementById('loginError');
      if (loginError) {
        loginError.innerText = '';
        loginError.classList.add('d-none');
      }

      document.querySelectorAll('.btn-control').forEach(b => b.disabled = true);
      document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso y una Materia para visualizar las calificaciones.</div>';
    }

    async function verificarSesion() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        document.getElementById('seccionLogin').classList.add('d-none');
        document.getElementById('seccionApp').classList.remove('d-none');
        document.getElementById('usuarioConectado').innerText = `Docente: ${session.user.email}`;
        await cargarCatalogo();
        await cargarCursosYMaterias();
      } else {
        resetearEstadoAplicacion();
        document.getElementById('seccionLogin').classList.remove('d-none');
        document.getElementById('seccionApp').classList.add('d-none');
      }
    }

    async function iniciarSesion(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        const errDiv = document.getElementById('loginError');
        errDiv.innerText = error.message;
        errDiv.classList.remove('d-none');
      } else {
        verificarSesion();
      }
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      resetearEstadoAplicacion();
      verificarSesion();
    }

    async function cargarCatalogo() {
      const { data } = await supabaseClient.from('catalogo_actividades').select('nombre').order('nombre');
      catalogo = data && data.length > 0 ? data.map(d => d.nombre) : ['Deber', 'Lección en clases', 'Actuación en clases', 'Trabajo Grupal', 'Colaboración en el Aula'];
    }

    async function cargarCursosYMaterias() {
      const { data } = await supabaseClient.from('curso_materia_docente').select(`
        id, curso_id, materia_id,
        cursos(id, nombre),
        materias(id, nombre)
      `);

      todasAsignaciones = data || [];

      const cursosUnicosMap = new Map();
      todasAsignaciones.forEach(a => {
        if (a.cursos && !cursosUnicosMap.has(a.cursos.id)) {
          cursosUnicosMap.set(a.cursos.id, a.cursos.nombre);
        }
      });

      const selectCurso = document.getElementById('selectCurso');
      selectCurso.innerHTML = '<option value="">Seleccione curso...</option>';
      cursosUnicosMap.forEach((nombre, id) => {
        selectCurso.innerHTML += `<option value="${id}">${nombre}</option>`;
      });
    }

    function alCambiarCurso() {
      const cursoId = document.getElementById('selectCurso').value;
      const selectMateria = document.getElementById('selectMateria');

      if (!cursoId) {
        selectMateria.innerHTML = '<option value="">Seleccione materia...</option>';
        selectMateria.disabled = true;
        cambiarFiltro();
        return;
      }

      const materiasDelCurso = todasAsignaciones.filter(a => a.curso_id == cursoId);
      selectMateria.innerHTML = '<option value="">Seleccione materia...</option>' + 
        materiasDelCurso.map(a => `<option value="${a.id}">${a.materias.nombre}</option>`).join('');
      
      selectMateria.disabled = false;
      cambiarFiltro();
    }

    function cambiarFiltro() {
      const asigId = document.getElementById('selectMateria').value;
      const trimestreVal = document.getElementById('selectTrimestre').value;
      const vistaVal = document.getElementById('selectVista').value;
      const controles = document.querySelectorAll('.btn-control');
      
      const boxVista = document.getElementById('boxVista');
      const accParcial = document.getElementById('accionesParcial');
      const accComp = document.getElementById('accionesComportamiento');
      const accResumen = document.getElementById('accionesResumen');
      const accAnual = document.getElementById('accionesAnual');

      accParcial.classList.add('d-none');
      accComp.classList.add('d-none');
      accResumen.classList.add('d-none');
      accAnual.classList.add('d-none');

      if (trimestreVal === 'anual') {
        boxVista.classList.add('d-none');
        accAnual.classList.remove('d-none');
      } else {
        boxVista.classList.remove('d-none');
        if (vistaVal === 'comp1' || vistaVal === 'comp2') {
          accComp.classList.remove('d-none');
        } else if (vistaVal === 'resumen_trimestre') {
          accResumen.classList.remove('d-none');
        } else {
          accParcial.classList.remove('d-none');
        }
      }

      if (!asigId) {
        controles.forEach(b => b.disabled = true);
        document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso y una Materia para visualizar las calificaciones.</div>';
        return;
      }
      controles.forEach(b => b.disabled = false);

      if (trimestreVal === 'anual') {
        cargarVistaResumenAnual();
      } else if (vistaVal === 'comp1' || vistaVal === 'comp2') {
        cargarVistaComportamiento(vistaVal === 'comp1' ? 1 : 2);
      } else if (vistaVal === 'resumen_trimestre') {
        cargarVistaResumenTrimestre();
      } else {
        cargarVistaParcial(vistaVal === 'p1' ? 1 : 2);
      }
    }

    // ==========================================
    // VISTA: COMPORTAMIENTO (Parcial 1 o Parcial 2)
    // ==========================================
    async function cargarVistaComportamiento(parcialNum) {
      const asigId = document.getElementById('selectMateria').value;
      const trimestre = parseInt(document.getElementById('selectTrimestre').value);
      const contenedor = document.getElementById('contenedorTabla');
      contenedor.innerHTML = `<div class="py-4 text-center">Cargando informe de comportamiento (Parcial ${parcialNum})...</div>`;

      const asig = todasAsignaciones.find(a => a.id == asigId);
      const { data: estData } = await supabaseClient.from('estudiantes').select('*').eq('curso_id', asig.curso_id).order('numero_lista');
      estudiantes = estData || [];

      const { data: compData } = await supabaseClient
        .from('comportamiento_parcial')
        .select('*')
        .eq('asignacion_id', asigId)
        .eq('trimestre', trimestre)
        .eq('parcial', parcialNum);

      const compMap = {};
      (compData || []).forEach(c => { compMap[c.estudiante_id] = c; });

      let html = `
        <table class="table table-bordered table-sm mb-0 align-middle">
          <thead>
            <tr>
              <th rowspan="2" style="width: 30px;">N°</th>
              <th rowspan="2" class="col-nombre text-center">NÓMINA / INDICADORES (PARCIAL ${parcialNum})</th>
              <th class="bg-comp-puntual">Puntualidad</th>
              <th colspan="3" class="bg-comp-limp">Limpieza</th>
              <th colspan="2" class="bg-comp-resp">Respeto y Consideración</th>
              <th colspan="2" class="bg-comp-div">Valoración Diversidad</th>
              <th class="bg-comp-patr">Patrimonio</th>
              <th class="bg-comp-prop">Propiedad</th>
              <th rowspan="2" class="bg-prom-ins" style="width: 75px;">TOTAL CUANT.</th>
              <th rowspan="2" class="bg-nota-final" style="width: 75px;">TOTAL CUALIT.</th>
            </tr>
            <tr class="bg-light">
              <th class="th-comp-ind">1. Asiste puntual</th>
              <th class="th-comp-ind">2. Aseo personal</th>
              <th class="th-comp-ind">3. Aseo lugar trab.</th>
              <th class="th-comp-ind">4. Aseo del aula</th>
              <th class="th-comp-ind">5. Saludo cordial</th>
              <th class="th-comp-ind">6. Evita leng. soez</th>
              <th class="th-comp-ind">7. Leng. no agresivo</th>
              <th class="th-comp-ind">8. Tolerancia div.</th>
              <th class="th-comp-ind">9. Cuida infraest.</th>
              <th class="th-comp-ind">10. Respeta objeto</th>
            </tr>
          </thead>
          <tbody id="tablaCuerpoComp">
            ${estudiantes.map((est, idx) => {
              const c = compMap[est.id] || {};
              const v = (val) => val !== undefined && val !== null ? val : '10';

              return `
                <tr data-estudiante-id="${est.id}">
                  <td>${idx + 1}</td>
                  <td class="col-nombre">${est.nombres}</td>
                  <td><input type="number" step="0.1" min="0" max="10" class="form-control form-control-sm input-nota-app comp-ind c-ind1" value="${v(c.ind1)}" oninput="validarYCalcularComp(this)"></td>
                  <td><input type="number" step="0.1" min="0" max="10" class="form-control form-control-sm input-nota-app comp-ind c-ind2" value="${v(c.ind2)}" oninput="validarYCalcularComp(this)"></td>
                  <td><input type="number" step="0.1" min="0" max="10" class="form-control form-control-sm input-nota-app comp-ind c-ind3" value="${v(c.ind3)}" oninput="validarYCalcularComp(this)"></td>
                  <td><input type="number" step="0.1" min="0" max="10" class="form-control form-control-sm input-nota-app comp-ind c-ind4" value="${v(c.ind4)}" oninput="validarYCalcularComp(this)"></td>
                  <td><input type="number" step="0.1" min="0" max="10" class="form-control form-control-sm input-nota-app comp-ind c-ind5" value="${v(c.ind5)}" oninput="validarYCalcularComp(this)"></td>
                  <td><input type="number" step="0.1" min="0" max="10" class="form-control form-control-sm input-nota-app comp-ind c-ind6" value="${v(c.ind6)}" oninput="validarYCalcularComp(this)"></td>
                  <td><input type="number" step="0.1" min="0" max="10" class="form-control form-control-sm input-nota-app comp-ind c-ind7" value="${v(c.ind7)}" oninput="validarYCalcularComp(this)"></td>
                  <td><input type="number" step="0.1" min="0" max="10" class="form-control form-control-sm input-nota-app comp-ind c-ind8" value="${v(c.ind8)}" oninput="validarYCalcularComp(this)"></td>
                  <td><input type="number" step="0.1" min="0" max="10" class="form-control form-control-sm input-nota-app comp-ind c-ind9" value="${v(c.ind9)}" oninput="validarYCalcularComp(this)"></td>
                  <td><input type="number" step="0.1" min="0" max="10" class="form-control form-control-sm input-nota-app comp-ind c-ind10" value="${v(c.ind10)}" oninput="validarYCalcularComp(this)"></td>
                  <td class="total-cuant fw-bold">10.00</td>
                  <td class="total-cualit fw-bold">A</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;

      contenedor.innerHTML = html;
      document.querySelectorAll('#tablaCuerpoComp tr').forEach(fila => calcularFilaComp(fila));
    }

    function validarYCalcularComp(input) {
      if (parseFloat(input.value) > 10) input.value = 10;
      if (parseFloat(input.value) < 0) input.value = 0;
      
      input.className = `form-control form-control-sm input-nota-app comp-ind ${input.className.split(' ').filter(c => c.startsWith('c-ind')).join(' ')} ${obtenerClaseColor(input.value, false)}`;
      calcularFilaComp(input.closest('tr'));
    }

    function calcularFilaComp(tr) {
      const inputs = Array.from(tr.querySelectorAll('.comp-ind'));
      inputs.forEach(i => {
        i.className = `form-control form-control-sm input-nota-app comp-ind ${i.className.split(' ').filter(c => c.startsWith('c-ind')).join(' ')} ${obtenerClaseColor(i.value, false)}`;
      });

      const valores = inputs.map(i => parseFloat(i.value)).filter(n => !isNaN(n));
      const promedio = valores.length > 0 ? (valores.reduce((a, b) => a + b, 0) / valores.length) : 0;
      const cualitativo = convertirCualitativo(promedio);

      const celdaCuant = tr.querySelector('.total-cuant');
      const celdaCualit = tr.querySelector('.total-cualit');

      celdaCuant.innerText = promedio.toFixed(2);
      celdaCualit.innerText = cualitativo;

      celdaCuant.className = `total-cuant fw-bold ${obtenerClaseColor(promedio, true)}`;
      celdaCualit.className = `total-cualit fw-bold ${obtenerClaseColor(promedio, true)}`;
    }

    // ==========================================
    // VISTA: PARCIAL ACADÉMICO (Insumos 1 y 2)
    // ==========================================
    function capturarNotasDeLaTabla() {
      const filas = document.querySelectorAll('#tablaCuerpo tr');
      filas.forEach(tr => {
        const estId = tr.getAttribute('data-estudiante-id');
        if (estId) {
          const notas1 = Array.from(tr.querySelectorAll('.nota-i1')).map(i => i.value !== '' ? i.value : '');
          const notas2 = Array.from(tr.querySelectorAll('.nota-i2')).map(i => i.value !== '' ? i.value : '');
          notasActualesMemoria[estId] = { i1: notas1, i2: notas2 };
        }
      });
    }

    function agregarActividad(insumo) {
      capturarNotasDeLaTabla();
      if (insumo === 1) {
        configActividades.insumo1.push(catalogo[0] || 'Actuación en clases');
        Object.keys(notasActualesMemoria).forEach(k => {
          if (!notasActualesMemoria[k].i1) notasActualesMemoria[k].i1 = [];
          notasActualesMemoria[k].i1.push('');
        });
      } else {
        configActividades.insumo2.push(catalogo[0] || 'Trabajo Grupal');
        Object.keys(notasActualesMemoria).forEach(k => {
          if (!notasActualesMemoria[k].i2) notasActualesMemoria[k].i2 = [];
          notasActualesMemoria[k].i2.push('');
        });
      }
      renderizarTablaParcial();
    }

    function eliminarActividad(insumo, index) {
      capturarNotasDeLaTabla();
      if (insumo === 1) {
        configActividades.insumo1.splice(index, 1);
        Object.keys(notasActualesMemoria).forEach(k => {
          if (notasActualesMemoria[k].i1) notasActualesMemoria[k].i1.splice(index, 1);
        });
      } else {
        configActividades.insumo2.splice(index, 1);
        Object.keys(notasActualesMemoria).forEach(k => {
          if (notasActualesMemoria[k].i2) notasActualesMemoria[k].i2.splice(index, 1);
        });
      }
      renderizarTablaParcial();
    }

    async function cargarVistaParcial(parcialNum) {
      const asigId = document.getElementById('selectMateria').value;
      const trimestre = parseInt(document.getElementById('selectTrimestre').value);

        .from('config_parcial_cabeceras')
        .select('*')
        .eq('asignacion_id', asigId)
        .eq('trimestre', trimestre)
        .eq('parcial', parcialNum)

      configActividades.insumo1 = confData?.actividades_insumo1 || ['Actuación en clases', 'Participación en Clases', 'Actuación en clases', 'Lección en clases'];

    function validarYCalcularParcial(input) {
      if (parseFloat(input.value) > 10) input.value = 10;
      if (parseFloat(input.value) < 0) input.value = 0;
      
      input.className = `form-control form-control-sm input-nota-app ${input.classList.contains('nota-i1') ? 'nota-i1' : 'nota-i2'} ${obtenerClaseColor(input.value, false)}`;
      calcularFilaParcial(input.closest('tr'));
    }

    // Cálculo proporcional dividiendo entre el total de actividades creadas
    function calcularFilaParcial(tr) {
      const inputs1 = Array.from(tr.querySelectorAll('.nota-i1'));
      const inputs2 = Array.from(tr.querySelectorAll('.nota-i2'));

      inputs1.forEach(i => i.className = `form-control form-control-sm input-nota-app nota-i1 ${obtenerClaseColor(i.value, false)}`);
      inputs2.forEach(i => i.className = `form-control form-control-sm input-nota-app nota-i2 ${obtenerClaseColor(i.value, false)}`);

      // Total de actividades configuradas (denominador exacto)
      const cantAct1 = configActividades.insumo1.length;
      const cantAct2 = configActividades.insumo2.length;

      // Suma considerando casillas vacías como 0
      const suma1 = inputs1.reduce((acc, inp) => acc + (parseFloat(inp.value) || 0), 0);
      const suma2 = inputs2.reduce((acc, inp) => acc + (parseFloat(inp.value) || 0), 0);

      const prom1 = cantAct1 > 0 ? (suma1 / cantAct1) : 0;
      const prom2 = cantAct2 > 0 ? (suma2 / cantAct2) : 0;
      const total = (prom1 + prom2) / 2;

      const cProm1 = tr.querySelector('.prom-i1');
      const cProm2 = tr.querySelector('.prom-i2');
      const cTotal = tr.querySelector('.nota-parcial');

      cProm1.innerText = prom1.toFixed(2);
      cProm2.innerText = prom2.toFixed(2);
      cTotal.innerText = total.toFixed(2);

      cProm1.className = `prom-i1 fw-bold ${obtenerClaseColor(prom1, true)}`;
      cProm2.className = `prom-i2 fw-bold ${obtenerClaseColor(prom2, true)}`;
      cTotal.className = `nota-parcial fw-bold ${obtenerClaseColor(total, true)}`;
    }

                  <td class="${obtenerClaseColor(promCompAnual, true)}">${promCompAnual.toFixed(2)} (${letraCompAnual})</td>
                  <td>${obsBadge}</td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>
      `;
      contenedor.innerHTML = html;
    }

    // ==========================================
    // EXPORTAR PDF
    // ==========================================
    function exportarResumenAnualPDF() {
      if (datosResumenAnualActual.length === 0) return alert('No hay datos para exportar.');

      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('landscape', 'mm', 'a4');

      const selectCurso = document.getElementById('selectCurso');
      const nombreCurso = selectCurso.options[selectCurso.selectedIndex].text;
      
      const selectMateria = document.getElementById('selectMateria');
      const nombreMateria = selectMateria.options[selectMateria.selectedIndex].text;

      const docenteEmail = document.getElementById('usuarioConectado').innerText.replace('Docente: ', '');

      doc.setFont('helvetica', 'bold');
      doc.setFontSize(14);
      doc.setTextColor(13, 110, 253);
      doc.text('UNIDAD EDUCATIVA PARTICULAR "VICENTE ROCAFUERTE"', 148, 16, { align: 'center' });

      doc.setFontSize(11);
      doc.setTextColor(50, 50, 50);
      doc.text('CUADRO DE CALIFICACIONES GENERAL ANUAL Y COMPORTAMIENTO', 148, 22, { align: 'center' });

      doc.setFont('helvetica', 'normal');
      doc.setFontSize(9);
      doc.setTextColor(30, 30, 30);
      doc.text(`Curso: ${nombreCurso}`, 14, 29);
      doc.text(`Materia: ${nombreMateria}`, 14, 34);
      doc.text(`Docente: ${docenteEmail}`, 200, 29);
      doc.text(`Fecha emisión: ${new Date().toLocaleDateString('es-EC')}`, 200, 34);

      const tableRows = datosResumenAnualActual.map(r => [
        r.num, r.nombre, r.t1, r.t2, r.t3, r.prom, r.comp1, r.comp2, r.comp3, r.compAnual, r.obs
      ]);

      doc.autoTable({
        startY: 38,
        head: [['No.', 'Nómina del Estudiante', '1er T.', '2do T.', '3er T.', 'Prom.', 'Comp. 1', 'Comp. 2', 'Comp. 3', 'Comp. Anual', 'Estado']],
        body: tableRows,
        theme: 'grid',
        headStyles: { fillColor: [33, 37, 41], textColor: [255, 255, 255], fontSize: 8, halign: 'center' },
        columnStyles: {
          0: { cellWidth: 10, halign: 'center' },
          1: { cellWidth: 70, halign: 'left' },
          2: { cellWidth: 16, halign: 'center' },
          3: { cellWidth: 16, halign: 'center' },
          4: { cellWidth: 16, halign: 'center' },
          5: { cellWidth: 18, halign: 'center', fontStyle: 'bold' },
          6: { cellWidth: 22, halign: 'center' },
          7: { cellWidth: 22, halign: 'center' },
          8: { cellWidth: 22, halign: 'center' },
          9: { cellWidth: 26, halign: 'center', fontStyle: 'bold' },
          10: { cellWidth: 22, halign: 'center' }
        },
        styles: { fontSize: 7.5, valign: 'middle' },
        didParseCell: function(data) {
          if (data.section === 'body') {
            if (data.column.index === 10) {
              if (data.cell.raw === 'APROBADO') data.cell.styles.textColor = [25, 135, 84];
              else if (data.cell.raw === 'SUPLETORIO') data.cell.styles.textColor = [255, 193, 7];
              else data.cell.styles.textColor = [220, 53, 69];
              data.cell.styles.fontStyle = 'bold';
            }
          }
        }
      });

      const finalY = doc.lastAutoTable.finalY + 25;
      if (finalY < 190) {
        doc.line(40, finalY, 100, finalY);
        doc.text('Docente Responsable', 70, finalY + 5, { align: 'center' });

        doc.line(190, finalY, 250, finalY);
        doc.text('Rectorado / Vicerrectorado', 220, finalY + 5, { align: 'center' });
      }

      doc.save(`Resumen_Anual_${nombreCurso.replace(/[^a-zA-Z0-9]/g, '_')}_${nombreMateria}.pdf`);
    }

    // ==========================================
    // GUARDADO GENERAL
    // ==========================================
    async function guardarDatos() {
      const asigId = document.getElementById('selectMateria').value;
      const trimestreVal = document.getElementById('selectTrimestre').value;
      const vistaVal = document.getElementById('selectVista').value;

      if (vistaVal === 'comp1' || vistaVal === 'comp2') {
        const parcialNum = vistaVal === 'comp1' ? 1 : 2;
        const trimestre = parseInt(trimestreVal);
        const btn = document.getElementById('btnGuardarComp');
        btn.disabled = true;
        btn.innerText = 'Guardando...';

        try {
          const filas = document.querySelectorAll('#tablaCuerpoComp tr');
          const payload = [];

          filas.forEach(tr => {
            const estId = tr.getAttribute('data-estudiante-id');
            if (estId) {
              payload.push({
                asignacion_id: parseInt(asigId),
                estudiante_id: parseInt(estId),
                trimestre: trimestre,
                parcial: parcialNum,
                ind1: parseFloat(tr.querySelector('.c-ind1').value) || 0,
                ind2: parseFloat(tr.querySelector('.c-ind2').value) || 0,
                ind3: parseFloat(tr.querySelector('.c-ind3').value) || 0,
                ind4: parseFloat(tr.querySelector('.c-ind4').value) || 0,
                ind5: parseFloat(tr.querySelector('.c-ind5').value) || 0,
                ind6: parseFloat(tr.querySelector('.c-ind6').value) || 0,
                ind7: parseFloat(tr.querySelector('.c-ind7').value) || 0,
                ind8: parseFloat(tr.querySelector('.c-ind8').value) || 0,
                ind9: parseFloat(tr.querySelector('.c-ind9').value) || 0,
                ind10: parseFloat(tr.querySelector('.c-ind10').value) || 0,
                total_cuantitativo: parseFloat(tr.querySelector('.total-cuant').innerText) || 0,
                total_cualitativo: tr.querySelector('.total-cualit').innerText
              });
            }
          });

          const { error } = await supabaseClient.from('comportamiento_parcial').upsert(payload, {
            onConflict: 'asignacion_id,estudiante_id,trimestre,parcial'
          });

          if (error) throw error;
          alert(`¡Informe de comportamiento (Parcial ${parcialNum}) guardado con éxito!`);
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          btn.disabled = false;
          btn.innerText = '💾 Guardar Comp.';
        }

      } else if (trimestreVal !== 'anual' && (vistaVal === 'p1' || vistaVal === 'p2')) {
        const parcialNum = vistaVal === 'p1' ? 1 : 2;
        const trimestre = parseInt(trimestreVal);
        const btn = document.getElementById('btnGuardarParcial');
        btn.disabled = true;
        btn.innerText = 'Guardando...';

        try {
          await supabaseClient.from('config_parcial_cabeceras').upsert({
            asignacion_id: parseInt(asigId),
            trimestre: trimestre,
            parcial: parcialNum,
            actividades_insumo1: configActividades.insumo1,
            actividades_insumo2: configActividades.insumo2
          }, { onConflict: 'asignacion_id,trimestre,parcial' });

          const filas = document.querySelectorAll('#tablaCuerpo tr');
          const payload = [];

          filas.forEach(tr => {
            const estId = tr.getAttribute('data-estudiante-id');
            if (estId) {
              const notas1 = Array.from(tr.querySelectorAll('.nota-i1')).map(i => i.value !== '' ? parseFloat(i.value) : 0);
              const notas2 = Array.from(tr.querySelectorAll('.nota-i2')).map(i => i.value !== '' ? parseFloat(i.value) : 0);
              const prom1 = parseFloat(tr.querySelector('.prom-i1').innerText) || 0;
              const prom2 = parseFloat(tr.querySelector('.prom-i2').innerText) || 0;
              const total = parseFloat(tr.querySelector('.nota-parcial').innerText) || 0;

              payload.push({
                asignacion_id: parseInt(asigId),
                estudiante_id: parseInt(estId),
                trimestre: trimestre,
                parcial: parcialNum,
                insumo1_notas: notas1,
                insumo2_notas: notas2,
                promedio_insumo1: prom1,
                promedio_insumo2: prom2,
                nota_parcial: total
              });
            }
          });

          const { error: errNotas } = await supabaseClient.from('notas_parcial_actividades').upsert(payload, {
            onConflict: 'asignacion_id,estudiante_id,trimestre,parcial'
          });
          if (errNotas) throw errNotas;

          const { data: allPData } = await supabaseClient
            .from('notas_parcial_actividades')
            .select('*')
            .eq('asignacion_id', asigId)
            .eq('trimestre', trimestre);

          const { data: existingTData } = await supabaseClient
            .from('notas_trimestre')
            .select('*')
            .eq('asignacion_id', asigId)
            .eq('trimestre', trimestre);

          const existingTMap = {};
          (existingTData || []).forEach(t => { existingTMap[t.estudiante_id] = t; });

          const p1Map = {}, p2Map = {};
          (allPData || []).forEach(n => {
            if (n.parcial === 1) p1Map[n.estudiante_id] = n.nota_parcial || 0;
            if (n.parcial === 2) p2Map[n.estudiante_id] = n.nota_parcial || 0;
          });

          const trimPayload = estudiantes.map(e => {
            const currentT = existingTMap[e.id] || {};
            return {
              asignacion_id: parseInt(asigId),
              estudiante_id: e.id,
              trimestre: trimestre,
              p1_insumo1: p1Map[e.id] || 0,
              p1_insumo2: p1Map[e.id] || 0,
              p2_insumo1: p2Map[e.id] || 0,
              p2_insumo2: p2Map[e.id] || 0,
              examen: currentT.examen || 0,
              comportamiento: currentT.comportamiento || 'A'
            };
          });

          await supabaseClient.from('notas_trimestre').upsert(trimPayload, {
            onConflict: 'asignacion_id,estudiante_id,trimestre'
          });

          alert('¡Notas del Parcial guardadas y sincronizadas!');
        } catch (err) {
          alert('Error al guardar: ' + err.message);
        } finally {
          btn.disabled = false;
          btn.innerText = '💾 Guardar Parcial';
        }

      } else if (trimestreVal !== 'anual' && vistaVal === 'resumen_trimestre') {
        const trimestre = parseInt(trimestreVal);
        const btn = document.getElementById('btnGuardarResumen');
        btn.disabled = true;
        btn.innerText = 'Guardando...';

        try {
          const filas = document.querySelectorAll('#tablaCuerpoTrimestre tr');
          const payload = [];

          filas.forEach(tr => {
            const estId = tr.getAttribute('data-estudiante-id');
            if (estId) {
              const ex = parseFloat(tr.querySelector('.nota-examen').value) || 0;
              const comp = tr.getAttribute('data-comp-letra') || 'A';
              const p1 = parseFloat(tr.querySelector('.p1-val').innerText) || 0;
              const p2 = parseFloat(tr.querySelector('.p2-val').innerText) || 0;

              payload.push({
                asignacion_id: parseInt(asigId),
                estudiante_id: parseInt(estId),
                trimestre: trimestre,
                p1_insumo1: p1,
                p1_insumo2: p1,
                p2_insumo1: p2,
                p2_insumo2: p2,
                examen: ex,
                comportamiento: comp
              });
            }
          });

          const { error } = await supabaseClient.from('notas_trimestre').upsert(payload, {
            onConflict: 'asignacion_id,estudiante_id,trimestre'
          });

          if (error) throw error;
          alert('¡Examen y Resumen Trimestral guardados con éxito!');
        } catch (err) {
          alert('Error al guardar: ' + err.message);
        } finally {
          btn.disabled = false;
          btn.innerText = '💾 Guardar Examen';
        }
      }
    }

    document.addEventListener('DOMContentLoaded', verificarSesion);
  </script>
