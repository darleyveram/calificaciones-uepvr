<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Calificaciones y Asistencia - UEPVR</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    th, td { font-size: 0.76rem; vertical-align: middle; text-align: center; }
    
    /* Columnas fijas (Sticky) al hacer scroll horizontal */
    .sticky-col-num {
      position: sticky;
      left: 0;
      background-color: #f8fafc !important;
      color: #212529 !important;
      z-index: 10;
      width: 35px;
      min-width: 35px;
    }
    .sticky-col-nombre {
      position: sticky;
      left: 35px;
      background-color: #ffffff !important;
      color: #212529 !important;
      z-index: 10;
      min-width: 220px;
      max-width: 260px;
      text-align: left !important;
      font-weight: 600;
      box-shadow: 2px 0 5px rgba(0,0,0,0.08);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    thead th.sticky-col-num, thead th.sticky-col-nombre {
      z-index: 15;
      background-color: #e2e8f0 !important;
      color: #0f172a !important;
      font-weight: bold;
    }
    
    .th-actividad { width: 95px; min-width: 95px; padding: 4px 2px !important; background-color: #f8fafc; }
    .th-comp-ind { width: 60px; min-width: 60px; font-size: 0.68rem; padding: 4px 1px !important; line-height: 1.1; }
    
    .select-act-custom { font-size: 0.68rem; width: 100%; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px; background-color: #fff; font-weight: 500; }
    .btn-act-header { font-size: 0.60rem; padding: 1px 3px; line-height: 1.1; font-weight: bold; border-radius: 3px; }

    .input-nota-app { width: 55px; margin: 0 auto; text-align: center; font-weight: bold; padding: 2px; }

    /* Semáforo Notas */
    .nota-baja-roja { background-color: #f8d7da !important; color: #842029 !important; font-weight: bold; }
    .nota-media-amarilla { background-color: #fff3cd !important; color: #664d03 !important; font-weight: bold; }
    .nota-aprobada-verde { background-color: #d1e7dd !important; color: #0f5132 !important; font-weight: bold; }
    .nota-perfecta-10 { background-color: #198754 !important; color: #ffffff !important; font-weight: bold; }

    /* Asistencia Cuadrícula Diaria */
    .th-dia-asig { width: 34px; min-width: 34px; padding: 2px 1px !important; font-size: 0.65rem; }
    .btn-dia-auto { font-size: 0.58rem; padding: 0 2px; line-height: 1.1; font-weight: bold; }
    
    .cell-asig-input { 
      width: 28px; 
      height: 26px; 
      text-align: center; 
      font-weight: bold; 
      border-radius: 3px; 
      border: 1px solid #cbd5e1; 
      margin: 0 auto; 
      text-transform: uppercase; 
      cursor: pointer;
      user-select: none;
    }
    .asig-a { background-color: #e8f5e9 !important; color: #2e7d32 !important; border-color: #a5d6a7 !important; }
    .asig-f { background-color: #ffebee !important; color: #c62828 !important; border-color: #ef9a9a !important; }
    .asig-j { background-color: #e3f2fd !important; color: #1565c0 !important; border-color: #90caf9 !important; }

    .bg-insumo1 { background-color: #0d6efd !important; color: #fff; }
    .bg-insumo2 { background-color: #0dcaf0 !important; color: #000; }
    .bg-prom-ins { background-color: #ffeb3b !important; font-weight: bold; color: #000; }
    .bg-nota-final { background-color: #198754 !important; color: #fff; font-weight: bold; }
    .bg-examen { background-color: #fd7e14 !important; color: #fff; font-weight: bold; }
    
    .logo-header { height: 50px; width: auto; object-fit: contain; }
    .logo-login { height: 75px; width: auto; object-fit: contain; }
  </style>
</head>
<body class="bg-light py-3">

  <!-- LOGIN -->
  <div class="container" id="seccionLogin" style="max-width: 440px; margin-top: 50px;">
    <div class="card shadow border-0">
      <div class="card-header bg-primary text-white text-center py-3">
        <div class="d-flex justify-content-center align-items-center gap-3 mb-2">
          <img id="loginLogoIzq" class="logo-login d-none" alt="Logo Colegio">
          <img id="loginLogoDer" class="logo-login d-none" alt="Escudo">
        </div>
        <h5 class="mb-0 fw-bold header-nombre-inst">UEP Vicente Rocafuerte</h5>
        <small class="header-lema-inst text-light">Portal Docente</small>
      </div>
      <div class="card-body p-4">
        <form onsubmit="iniciarSesion(event)">
          <div class="mb-3">
            <label class="form-label fw-bold">Correo institucional</label>
            <input type="email" id="loginEmail" class="form-control" placeholder="docente@uepvr.edu.ec" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-bold">Contraseña</label>
            <input type="password" id="loginPassword" class="form-control" required>
          </div>
          <div id="loginError" class="alert alert-danger py-2 d-none"></div>
          <button type="submit" class="btn btn-primary w-100 fw-bold" id="btnLogin">Ingresar al Sistema</button>
        </form>
      </div>
      <div class="card-footer bg-light text-center py-2 text-muted small">
        <span class="header-dir-inst">Pichincha - Manabí - Ecuador</span>
      </div>
    </div>
  </div>

  <!-- APLICATIVO PRINCIPAL -->
  <div class="container-fluid px-3 d-none" id="seccionApp">
    
    <!-- Cabecera Dinámica Institucional -->
    <div class="card shadow-sm mb-2 border-0">
      <div class="card-body py-2 px-3">
        <div class="d-flex justify-content-between align-items-center">
          
          <div class="d-flex align-items-center gap-3">
            <img id="appLogoIzq" class="logo-header d-none" alt="Logo Izquierdo">
            <div>
              <h5 class="fw-bold text-primary mb-0 header-nombre-inst">Unidad Educativa Particular "VICENTE ROCAFUERTE"</h5>
              <div class="d-flex align-items-center gap-2 mt-1">
                <span class="badge bg-primary header-periodo-badge">2026-2027</span>
                <small class="text-muted fw-bold" id="usuarioConectado"></small>
              </div>
            </div>
          </div>

          <div class="d-flex align-items-center gap-3">
            <img id="appLogoDer" class="logo-header d-none" alt="Logo Derecho">
            <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()"><i class="bi bi-box-arrow-right me-1"></i>Cerrar Sesión</button>
          </div>

        </div>
      </div>
    </div>

    <!-- Barra de Filtros -->
    <div class="card shadow-sm mb-3">
      <div class="card-body py-2">
        <div class="row g-2 align-items-center">
          
          <div class="col-md-2" id="boxModo">
            <label class="form-label mb-1 fw-bold">Modo del Sistema:</label>
            <select id="selectModo" class="form-select form-select-sm fw-bold border-primary text-primary" onchange="alCambiarModo()">
              <option value="calificaciones">📘 Calificaciones Académicas</option>
              <option value="asistencia" id="optModoAsistencia" class="d-none">📅 Control Diario de Asistencia</option>
            </select>
          </div>

          <div class="col-md-2" id="boxCurso">
            <label class="form-label mb-1 fw-bold">Curso / Grado:</label>
            <select id="selectCurso" class="form-select form-select-sm" onchange="alCambiarCurso()">
              <option value="">Seleccione curso...</option>
            </select>
          </div>

          <div class="col-md-2" id="boxMateria">
            <label class="form-label mb-1 fw-bold">Materia / Asignatura:</label>
            <select id="selectMateria" class="form-select form-select-sm" onchange="cambiarFiltro()" disabled>
              <option value="">Seleccione materia...</option>
            </select>
          </div>
          
          <div class="col-md-2" id="boxTrimestre">
            <label class="form-label mb-1 fw-bold">Trimestre / Ciclo:</label>
            <select id="selectTrimestre" class="form-select form-select-sm" onchange="cambiarFiltro()">
              <option value="1">Trimestre 1</option>
              <option value="2">Trimestre 2</option>
              <option value="3">Trimestre 3</option>
              <option value="anual" id="optTrimAnual">📊 Resumen General Anual</option>
            </select>
          </div>

          <div class="col-md-2" id="boxVista">
            <label class="form-label mb-1 fw-bold">Evaluación / Parcial:</label>
            <select id="selectVista" class="form-select form-select-sm" onchange="cambiarFiltro()">
              <option value="p1">Parcial 1 (Insumos 1 y 2)</option>
              <option value="comp1">Comportamiento Parcial 1</option>
              <option value="p2">Parcial 2 (Insumos 1 y 2)</option>
              <option value="comp2">Comportamiento Parcial 2</option>
              <option value="resumen_trimestre">Examen y Resumen Trimestral</option>
            </select>
          </div>

          <div class="col-md-2 d-none" id="boxParcialAsistencia">
            <label class="form-label mb-1 fw-bold">Parcial Asistencia:</label>
            <select id="selectParcialAsistencia" class="form-select form-select-sm" onchange="cambiarFiltro()">
              <option value="1">1er Parcial</option>
              <option value="2">2do Parcial</option>
            </select>
          </div>

          <!-- Botones Calificaciones -->
          <div class="col-md-4 text-end pt-3" id="accionesParcial">
            <button class="btn btn-outline-primary btn-sm me-1 btn-control" onclick="agregarActividad(1)" disabled title="Añadir columna a Insumo 1">+ Ins. 1</button>
            <button class="btn btn-outline-info btn-sm me-1 text-dark btn-control" onclick="agregarActividad(2)" disabled title="Añadir columna a Insumo 2">+ Ins. 2</button>
            <button class="btn btn-outline-success btn-sm me-1 btn-control" onclick="autoLlenarTodoCon10()" disabled title="Poner 10 en todas las actividades">⚡ Todo 10</button>
            <button class="btn btn-outline-secondary btn-sm me-1 btn-control" onclick="limpiarTodasNotasParcial()" disabled title="Limpiar todas las notas">🧹 Limpiar</button>
            <button class="btn btn-success btn-sm px-3 fw-bold btn-control" id="btnGuardarParcial" onclick="guardarDatos()" disabled>💾 Guardar</button>
          </div>

          <div class="col-md-4 text-end pt-3 d-none" id="accionesComportamiento">
            <button class="btn btn-outline-secondary btn-sm me-1 btn-control" onclick="llenarTodoCon10Comportamiento()" disabled>⚡ Auto 10</button>
            <button class="btn btn-success btn-sm px-3 fw-bold btn-control" id="btnGuardarComp" onclick="guardarDatos()" disabled>💾 Guardar</button>
          </div>

          <div class="col-md-4 text-end pt-3 d-none" id="accionesResumen">
            <button class="btn btn-success btn-sm px-3 fw-bold btn-control" id="btnGuardarResumen" onclick="guardarDatos()" disabled>💾 Guardar</button>
          </div>

          <div class="col-md-4 text-end pt-3 d-none" id="accionesAnual">
            <button class="btn btn-danger btn-sm px-3 fw-bold btn-control" id="btnDescargarPDF" onclick="exportarResumenAnualPDF()">📄 Descargar PDF</button>
          </div>

          <!-- Botones Asistencia General -->
          <div class="col-md-4 text-end pt-3 d-none" id="accionesAsistencia">
            <button class="btn btn-outline-success btn-sm me-1 btn-control" onclick="llenarTodoConAsistencia()" disabled title="Llenar todo el parcial con Asistencias">⚡ Todo 'A'</button>
            <button class="btn btn-outline-secondary btn-sm me-1 btn-control" onclick="limpiarTodaAsistencia()" disabled title="Poner en blanco todo el parcial">🧹 Limpiar Todo</button>
            <button class="btn btn-success btn-sm px-3 fw-bold btn-control" id="btnGuardarAsist" onclick="guardarAsistencia()" disabled>💾 Guardar</button>
          </div>

        </div>
      </div>
    </div>

    <!-- Contenedor de Tablas -->
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive" id="contenedorTabla" style="max-height: 75vh; overflow-y: auto;">
          <div class="py-4 text-muted text-center">Seleccione los filtros para visualizar la información.</div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = 'https://sbomuqwntosvdsojlfyr.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNib211cXdudG9zdmRzb2psZnlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5Mjk5NzcsImV4cCI6MjEwMjUwNTk3N30.WLgWyVOWVieC-4XjnkZFAKEqARKszvLpVqiAoGHdUU8';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let infoInstitucion = null;
    let catalogo = [];
    let todasAsignaciones = [];
    let todosCursos = [];
    let estudiantes = [];
    let configActividades = { insumo1: [], insumo2: [] };
    let notasActualesMemoria = {};
    let datosResumenAnualActual = [];
    let periodosAsistencia = [];
    let diasHabilesParcialActual = [];
    let usuarioActualPerfil = null;

    async function cargarInformacionInstitucionalDinamica() {
      const { data } = await supabaseClient.from('institucion').select('*').eq('id', 1).maybeSingle();
      if (data) {
        infoInstitucion = data;
        const nombreMostrar = data.nombre || `${data.nombre_arriba || ''} ${data.nombre_abajo || ''}`.trim() || 'UEP Vicente Rocafuerte';
        
        document.querySelectorAll('.header-nombre-inst').forEach(el => el.innerText = nombreMostrar);
        document.querySelectorAll('.header-lema-inst').forEach(el => el.innerText = data.frase_1 || 'Educación de calidad para la vida');
        document.querySelectorAll('.header-dir-inst').forEach(el => el.innerText = data.direccion_1 || 'Pichincha - Manabí - Ecuador');
        document.querySelectorAll('.header-periodo-badge').forEach(el => el.innerText = data.periodo_lectivo || '2026-2027');

        const logoIzq = data.logo_izquierdo || data.logo_institucion;
        const logoDer = data.logo_derecho || data.escudo_nacional;

        if (logoIzq) {
          const l1 = document.getElementById('loginLogoIzq'); if (l1) { l1.src = logoIzq; l1.classList.remove('d-none'); }
          const a1 = document.getElementById('appLogoIzq'); if (a1) { a1.src = logoIzq; a1.classList.remove('d-none'); }
        }
        if (logoDer) {
          const l2 = document.getElementById('loginLogoDer'); if (l2) { l2.src = logoDer; l2.classList.remove('d-none'); }
          const a2 = document.getElementById('appLogoDer'); if (a2) { a2.src = logoDer; a2.classList.remove('d-none'); }
        }
      }
    }

    function obtenerClaseColor(valor, esPromedio = false) {
      if (isNaN(valor) || valor === null || valor === '') return '';
      const n = parseFloat(valor);
      if (n < 4.00) return 'nota-baja-roja';
      if (n < 7.00) return 'nota-media-amarilla';
      if (esPromedio && n === 10.00) return 'nota-perfecta-10';
      if (esPromedio && n >= 7.00) return 'nota-aprobada-verde';
      return '';
    }

    function convertirCualitativo(nota) {
      const n = parseFloat(nota) || 0;
      if (n >= 9.00) return 'A';
      if (n >= 8.00) return 'B';
      if (n >= 7.00) return 'C';
      if (n >= 6.00) return 'D';
      if (n >= 4.00) return 'E';
      return 'ERROR';
    }

    async function verificarSesion() {
      await cargarInformacionInstitucionalDinamica();
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) {
        const { data: perfil } = await supabaseClient.from('perfiles').select('*').eq('id', session.user.id).maybeSingle();
        usuarioActualPerfil = perfil;

        const nombreDocente = perfil 
          ? `${perfil.titulo ? perfil.titulo + ' ' : ''}${perfil.nombres} ${perfil.apellidos || ''}`.trim() 
          : session.user.email;

        document.getElementById('seccionLogin').classList.add('d-none');
        document.getElementById('seccionApp').classList.remove('d-none');
        document.getElementById('usuarioConectado').innerText = `Docente: ${nombreDocente}`;
        
        const puedeVerAsistencia = (perfil?.rol === 'admin' || perfil?.puede_gestionar_asistencia === true);
        const optAsist = document.getElementById('optModoAsistencia');
        const boxModo = document.getElementById('boxModo');

        if (puedeVerAsistencia) {
          optAsist.classList.remove('d-none');
          boxModo.classList.remove('d-none');
        } else {
          optAsist.classList.add('d-none');
          boxModo.classList.add('d-none');
          document.getElementById('selectModo').value = 'calificaciones';
        }

        await cargarCatalogo();
        await cargarPeriodosAsistenciaDB();
        await cargarCursosYMaterias(session.user.id, perfil?.rol, perfil?.puede_gestionar_asistencia);
      } else {
        document.getElementById('seccionLogin').classList.remove('d-none');
        document.getElementById('seccionApp').classList.add('d-none');
      }
    }

    async function iniciarSesion(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        const errDiv = document.getElementById('loginError');
        errDiv.innerText = error.message;
        errDiv.classList.remove('d-none');
      } else {
        verificarSesion();
      }
    }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function cargarCatalogo() {
      const { data } = await supabaseClient.from('catalogo_actividades').select('nombre').order('nombre');
      catalogo = data && data.length > 0 ? data.map(d => d.nombre) : ['Deber', 'Lección en clases', 'Actuación en clases', 'Trabajo Grupal', 'Colaboración en el Aula'];
    }

    async function cargarPeriodosAsistenciaDB() {
      const { data } = await supabaseClient.from('asistencia_periodos').select('*').order('trimestre').order('parcial');
      periodosAsistencia = data || [];
    }

    async function cargarCursosYMaterias(userId, userRol, puedeAsistencia) {
      if (userRol === 'admin' || puedeAsistencia) {
        const { data: cData } = await supabaseClient.from('cursos').select('id, nombre').order('id');
        todosCursos = cData || [];
      }

      let query = supabaseClient.from('curso_materia_docente').select(`
        id, curso_id, materia_id, docente_id, docente_id_2, docente_id_3, es_optativa,
        cursos(id, nombre),
        materias(id, nombre)
      `);

      if (userRol !== 'admin') {
        query = query.or(`docente_id.eq.${userId},docente_id_2.eq.${userId},docente_id_3.eq.${userId}`);
      }

      const { data } = await query;
      todasAsignaciones = data || [];

      alCambiarModo();
    }

    function alCambiarModo() {
      const modo = document.getElementById('selectModo').value;
      const boxMateria = document.getElementById('boxMateria');
      const boxVista = document.getElementById('boxVista');
      const boxParcialAsist = document.getElementById('boxParcialAsistencia');
      const optAnual = document.getElementById('optTrimAnual');
      const selectCurso = document.getElementById('selectCurso');

      const puedeVerAsistencia = (usuarioActualPerfil?.rol === 'admin' || usuarioActualPerfil?.puede_gestionar_asistencia === true);
      if (modo === 'asistencia' && !puedeVerAsistencia) {
        document.getElementById('selectModo').value = 'calificaciones';
        alCambiarModo();
        return;
      }

      if (modo === 'asistencia') {
        boxMateria.classList.add('d-none');
        boxVista.classList.add('d-none');
        boxParcialAsist.classList.remove('d-none');
        optAnual.classList.add('d-none');
        if (document.getElementById('selectTrimestre').value === 'anual') {
          document.getElementById('selectTrimestre').value = '1';
        }

        const cursosDisponibles = puedeVerAsistencia
          ? todosCursos 
          : Array.from(new Map(todasAsignaciones.map(a => [a.cursos.id, a.cursos])).values());

        selectCurso.innerHTML = '<option value="">Seleccione curso...</option>' + 
          cursosDisponibles.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');

      } else {
        boxMateria.classList.remove('d-none');
        boxVista.classList.remove('d-none');
        boxParcialAsist.classList.add('d-none');
        optAnual.classList.remove('d-none');

        const cursosMap = new Map();
        todasAsignaciones.forEach(a => {
          if (a.cursos) cursosMap.set(a.cursos.id, a.cursos.nombre);
        });

        selectCurso.innerHTML = '<option value="">Seleccione curso...</option>';
        cursosMap.forEach((nombre, id) => {
          selectCurso.innerHTML += `<option value="${id}">${nombre}</option>`;
        });
      }

      alCambiarCurso();
    }

    function alCambiarCurso() {
      const modo = document.getElementById('selectModo').value;
      const cursoId = document.getElementById('selectCurso').value;
      const selectMateria = document.getElementById('selectMateria');

      if (modo === 'calificaciones') {
        if (!cursoId) {
          selectMateria.innerHTML = '<option value="">Seleccione materia...</option>';
          selectMateria.disabled = true;
          cambiarFiltro();
          return;
        }

        const materiasDelCurso = todasAsignaciones.filter(a => a.curso_id == cursoId);
        selectMateria.innerHTML = '<option value="">Seleccione materia...</option>' + 
          materiasDelCurso.map(a => `<option value="${a.id}">${a.materias.nombre} ${a.es_optativa ? '(Optativa)' : ''}</option>`).join('');
        
        selectMateria.disabled = false;
        if (materiasDelCurso.length === 1) selectMateria.value = materiasDelCurso[0].id;
      }

      cambiarFiltro();
    }

    function cambiarFiltro() {
      const modo = document.getElementById('selectModo').value;
      const cursoId = document.getElementById('selectCurso').value;
      const asigId = document.getElementById('selectMateria').value;
      const trimestreVal = document.getElementById('selectTrimestre').value;
      const vistaVal = document.getElementById('selectVista').value;
      const controles = document.querySelectorAll('.btn-control');
      
      const accParcial = document.getElementById('accionesParcial');
      const accComp = document.getElementById('accionesComportamiento');
      const accResumen = document.getElementById('accionesResumen');
      const accAnual = document.getElementById('accionesAnual');
      const accAsist = document.getElementById('accionesAsistencia');

      accParcial.classList.add('d-none');
      accComp.classList.add('d-none');
      accResumen.classList.add('d-none');
      accAnual.classList.add('d-none');
      accAsist.classList.add('d-none');

      if (modo === 'asistencia') {
        accAsist.classList.remove('d-none');
        if (!cursoId) {
          controles.forEach(b => b.disabled = true);
          document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso para gestionar la Asistencia.</div>';
          return;
        }
        controles.forEach(b => b.disabled = false);
        cargarVistaAsistencia();
        return;
      }

      // Modo Calificaciones
      if (trimestreVal === 'anual') {
        document.getElementById('boxVista').classList.add('d-none');
        accAnual.classList.remove('d-none');
      } else {
        document.getElementById('boxVista').classList.remove('d-none');
        if (vistaVal === 'comp1' || vistaVal === 'comp2') accComp.classList.remove('d-none');
        else if (vistaVal === 'resumen_trimestre') accResumen.classList.remove('d-none');
        else accParcial.classList.remove('d-none');
      }

      if (!asigId) {
        controles.forEach(b => b.disabled = true);
        document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso y una Materia para visualizar las calificaciones.</div>';
        return;
      }
      controles.forEach(b => b.disabled = false);

      if (trimestreVal === 'anual') cargarVistaResumenAnual();
      else if (vistaVal === 'comp1' || vistaVal === 'comp2') cargarVistaComportamiento(vistaVal === 'comp1' ? 1 : 2);
      else if (vistaVal === 'resumen_trimestre') cargarVistaResumenTrimestre();
      else cargarVistaParcial(vistaVal === 'p1' ? 1 : 2);
    }

    function capturarNotasDeLaTabla() {
      const filas = document.querySelectorAll('#tablaCuerpo tr');
      filas.forEach(tr => {
        const estId = tr.getAttribute('data-estudiante-id');
        if (estId) {
          const notas1 = Array.from(tr.querySelectorAll('.nota-i1')).map(i => i.value !== '' ? i.value : '');
          const notas2 = Array.from(tr.querySelectorAll('.nota-i2')).map(i => i.value !== '' ? i.value : '');
          notasActualesMemoria[estId] = { i1: notas1, i2: notas2 };
        }
      });
    }

    function agregarActividad(insumo) {
      capturarNotasDeLaTabla();
      if (insumo === 1) {
        configActividades.insumo1.push(catalogo[0] || 'Actuación en clases');
        Object.keys(notasActualesMemoria).forEach(k => {
          if (!notasActualesMemoria[k].i1) notasActualesMemoria[k].i1 = [];
          notasActualesMemoria[k].i1.push('');
        });
      } else {
        configActividades.insumo2.push(catalogo[0] || 'Trabajo Grupal');
        Object.keys(notasActualesMemoria).forEach(k => {
          if (!notasActualesMemoria[k].i2) notasActualesMemoria[k].i2 = [];
          notasActualesMemoria[k].i2.push('');
        });
      }
      renderizarTablaParcial();
    }

    function eliminarActividad(insumo, index) {
      capturarNotasDeLaTabla();
      if (insumo === 1) {
        configActividades.insumo1.splice(index, 1);
        Object.keys(notasActualesMemoria).forEach(k => {
          if (notasActualesMemoria[k].i1) notasActualesMemoria[k].i1.splice(index, 1);
        });
      } else {
        configActividades.insumo2.splice(index, 1);
        Object.keys(notasActualesMemoria).forEach(k => {
          if (notasActualesMemoria[k].i2) notasActualesMemoria[k].i2.splice(index, 1);
        });
      }
      renderizarTablaParcial();
    }

    function validarYCalcularParcial(input) {
      if (parseFloat(input.value) > 10) input.value = 10;
      if (parseFloat(input.value) < 0) input.value = 0;
      
      const tipo = input.classList.contains('nota-i1') ? 'nota-i1' : 'nota-i2';
      const colClase = Array.from(input.classList).find(c => c.startsWith('col-act-')) || '';
      
      input.className = `form-control form-control-sm input-nota-app ${tipo} ${colClase} ${obtenerClaseColor(input.value, false)}`;
      calcularFilaParcial(input.closest('tr'));
    }

    function calcularFilaParcial(tr) {
      const inputs1 = Array.from(tr.querySelectorAll('.nota-i1'));
      const inputs2 = Array.from(tr.querySelectorAll('.nota-i2'));

      inputs1.forEach(i => {
        const colClase = Array.from(i.classList).find(c => c.startsWith('col-act-')) || '';
        i.className = `form-control form-control-sm input-nota-app nota-i1 ${colClase} ${obtenerClaseColor(i.value, false)}`;
      });
      inputs2.forEach(i => {
        const colClase = Array.from(i.classList).find(c => c.startsWith('col-act-')) || '';
        i.className = `form-control form-control-sm input-nota-app nota-i2 ${colClase} ${obtenerClaseColor(i.value, false)}`;
      });

      const cantAct1 = configActividades.insumo1.length;
      const cantAct2 = configActividades.insumo2.length;

      const suma1 = inputs1.reduce((acc, inp) => acc + (parseFloat(inp.value) || 0), 0);
      const suma2 = inputs2.reduce((acc, inp) => acc + (parseFloat(inp.value) || 0), 0);

      const prom1 = cantAct1 > 0 ? (suma1 / cantAct1) : 0;
      const prom2 = cantAct2 > 0 ? (suma2 / cantAct2) : 0;
      const total = (prom1 + prom2) / 2;

      const cProm1 = tr.querySelector('.prom-i1');
      const cProm2 = tr.querySelector('.prom-i2');
      const cTotal = tr.querySelector('.nota-parcial');

      cProm1.innerText = prom1.toFixed(2);
      cProm2.innerText = prom2.toFixed(2);
      cTotal.innerText = total.toFixed(2);

      cProm1.className = `prom-i1 fw-bold ${obtenerClaseColor(prom1, true)}`;
      cProm2.className = `prom-i2 fw-bold ${obtenerClaseColor(prom2, true)}`;
      cTotal.className = `nota-parcial fw-bold ${obtenerClaseColor(total, true)}`;
    }

    function generarDiasHabilesRango(fInicioStr, fFinStr) {
      const dias = [];
      const nombresDias = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      const nombresMeses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];

      let cur = new Date(fInicioStr + 'T00:00:00');
      const fin = new Date(fFinStr + 'T00:00:00');

      while (cur <= fin) {
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          const yyyy = cur.getFullYear();
          const mm = String(cur.getMonth() + 1).padStart(2, '0');
          const dd = String(cur.getDate()).padStart(2, '0');
          dias.push({
            iso: `${yyyy}-${mm}-${dd}`,
            diaNum: dd,
            nombreDia: nombresDias[day],
            nombreMes: nombresMeses[cur.getMonth()]
          });
        }
        cur.setDate(cur.getDate() + 1);
      }
      return dias;
    }

    function alternarEstadoAsistencia(input) {
      const actual = input.value.toUpperCase();
      let siguiente = '';

      if (actual === '') siguiente = 'A';
      else if (actual === 'A') siguiente = 'F';
      else if (actual === 'F') siguiente = 'J';
      else if (actual === 'J') siguiente = '';
      else siguiente = 'A';

      input.value = siguiente;
      input.className = 'cell-asig-input';

      if (siguiente === 'A') input.classList.add('asig-a');
      else if (siguiente === 'F') input.classList.add('asig-f');
      else if (siguiente === 'J') input.classList.add('asig-j');

      calcularFilaAsistencia(input.closest('tr'));
    }

    function calcularFilaAsistencia(tr) {
      const inputs = Array.from(tr.querySelectorAll('.cell-asig-input'));
      let a = 0, f = 0, j = 0;

      inputs.forEach(inp => {
        const v = inp.value.toUpperCase();
        if (v === 'A') a++;
        else if (v === 'F') f++;
        else if (v === 'J') j++;
      });

      const trimestre = parseInt(document.getElementById('selectTrimestre').value);
      const parcial = parseInt(document.getElementById('selectParcialAsistencia').value);
      const per = periodosAsistencia.find(p => p.trimestre === trimestre && p.parcial === parcial);
      const metaDias = per ? per.total_dias_laborados : diasHabilesParcialActual.length;

      const faltantes = Math.max(metaDias - a, 0);

      tr.querySelector('.sum-a').innerText = a;
      tr.querySelector('.sum-f').innerText = f;
      tr.querySelector('.sum-j').innerText = j;
      tr.querySelector('.total-asist').innerText = a;
      tr.querySelector('.dias-faltantes').innerText = faltantes;
    }

    function llenarDiaColumna(fechaIso, tipo) {
      document.querySelectorAll(`#tablaCuerpoAsistencia .cell-asig-input[data-iso="${fechaIso}"]`).forEach(inp => {
        inp.value = tipo;
        inp.className = 'cell-asig-input';
        if (tipo === 'A') inp.classList.add('asig-a');
        else if (tipo === 'F') inp.classList.add('asig-f');
      });
      document.querySelectorAll('#tablaCuerpoAsistencia tr').forEach(fila => calcularFilaAsistencia(fila));
    }

    function llenarTodoConAsistencia() {
      document.querySelectorAll('#tablaCuerpoAsistencia .cell-asig-input').forEach(inp => {
        inp.value = 'A';
        inp.className = 'cell-asig-input asig-a';

    function limpiarTodaAsistencia() {
      if (!confirm('¿Desea poner en blanco todas las casillas de este parcial?')) return;
      document.querySelectorAll('#tablaCuerpoAsistencia .cell-asig-input').forEach(inp => {
        inp.value = '';

    async function guardarAsistencia() {
      const cursoId = parseInt(document.getElementById('selectCurso').value);
      const trimestre = parseInt(document.getElementById('selectTrimestre').value);
      const parcial = parseInt(document.getElementById('selectParcialAsistencia').value);
      const btn = document.getElementById('btnGuardarAsist');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Guardando...';

      try {
        const filas = document.querySelectorAll('#tablaCuerpoAsistencia tr');
        const payload = [];

        filas.forEach(tr => {
          const estId = parseInt(tr.getAttribute('data-est-id'));
          if (estId) {
            const regDiario = {};
            tr.querySelectorAll('.cell-asig-input').forEach(inp => {
              const iso = inp.getAttribute('data-iso');
              if (inp.value) regDiario[iso] = inp.value.toUpperCase();
            });

            payload.push({
              curso_id: cursoId,
              estudiante_id: estId,
              trimestre: trimestre,
              parcial: parcial,
              registro_diario: regDiario,
              total_asistencias: parseInt(tr.querySelector('.sum-a').innerText) || 0,
              total_faltas: parseInt(tr.querySelector('.sum-f').innerText) || 0,
              total_justificadas: parseInt(tr.querySelector('.sum-j').innerText) || 0,
              total_dias: parseInt(tr.querySelector('.total-asist').innerText) || 0,
              dias_faltantes: parseInt(tr.querySelector('.dias-faltantes').innerText) || 0
            });
          }
        });

        const { error } = await supabaseClient.from('asistencia_estudiantes').upsert(payload, {
          onConflict: 'curso_id,estudiante_id,trimestre,parcial'
        });

        if (error) throw error;
        alert('¡Control de Asistencia guardado con éxito!');
      } catch (err) {
        alert('Error al guardar asistencia: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '💾 Guardar';
      }
    }

    // ==========================================
    // EXPORTACIÓN OFICIAL DE PDF RESUMEN ANUAL
    // ==========================================
    // Función auxiliar para convertir URL de imagen a Base64 sin problemas de CORS
    async function obtenerBase64DesdeUrl(url) {
      if (!url) return null;
      try {
        const res = await fetch(url, { mode: 'cors' });
        const blob = await res.blob();
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onloadend = () => resolve(reader.result);
          reader.onerror = () => resolve(null);
          reader.readAsDataURL(blob);
        });
      } catch (e) {
        console.warn('No se pudo cargar la imagen para el PDF:', url);
        return null;
      }
    }

    // ==========================================
    // EXPORTACIÓN OFICIAL DE PDF RESUMEN ANUAL MULTI-PÁGINA
    // ==========================================
    async function exportarResumenAnualPDF() {
      if (!datosResumenAnualActual || datosResumenAnualActual.length === 0) {
        alert('No hay calificaciones cargadas para exportar.');
        return;
      }

      const asigId = document.getElementById('selectMateria').value;
      const asig = todasAsignaciones.find(a => a.id == asigId);
      if (!asig) return alert('Seleccione una materia.');

      const btn = document.getElementById('btnDescargarPDF');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Generando PDF...';

      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4' });

        // 1. Obtener datos institucionales completos
        const nomArriba = (infoInstitucion?.nombre_arriba || 'Unidad Educativa Particular').toUpperCase();
        const nomAbajo = (infoInstitucion?.nombre_abajo || '"Vicente Rocafuerte"').toUpperCase();
        const periodo = infoInstitucion?.periodo_lectivo || '2026-2027';
        const amie = infoInstitucion?.amie || '13H03021';
        const distrito = infoInstitucion?.distrito || '13D08';
        const circuito = infoInstitucion?.circuito || '13D08C0_b';
        const dir1 = infoInstitucion?.direccion_1 || 'Pichincha - Manabí - Ecuador';
        const frase1 = infoInstitucion?.frase_1 ? `"${infoInstitucion.frase_1}"` : '';

        // 2. Nombre largo del curso
        const cursoInfo = cursosList.find(c => c.id === asig.curso_id);
        const nombreCursoLargo = (cursoInfo?.nombre_largo_mayuscula || cursoInfo?.nombre || asig.cursos?.nombre || '').toUpperCase();
        const nombreMateria = (asig.materias?.nombre || '').toUpperCase();

        // 3. Nombres de Autoridades
        const nombreDocenteActual = usuarioActualPerfil 
          ? `${usuarioActualPerfil.titulo ? usuarioActualPerfil.titulo + ' ' : ''}${usuarioActualPerfil.nombres} ${usuarioActualPerfil.apellidos || ''}`.trim().toUpperCase()
          : 'DOCENTE RESPONSABLE';
        
        const nombreSecretaria = 'C.P.A. MERCEDES A. SALAMEA M.';
        const nombreRector = 'ING. DÍDIMO A. SALTOS S.';

        // 4. Cargar Logos en Base64
        const imgLogoIzq = await obtenerBase64DesdeUrl(infoInstitucion?.logo_izquierdo || infoInstitucion?.logo_institucion);
        const imgLogoDer = await obtenerBase64DesdeUrl(infoInstitucion?.logo_derecho || infoInstitucion?.escudo_nacional);

        // Estructura de la Tabla
        const headers = [
          [
            { content: 'N°', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: 'NÓMINA DE ESTUDIANTES', rowSpan: 2, styles: { valign: 'middle', halign: 'left' } },
            { content: 'CALIFICACIONES ACADÉMICAS', colSpan: 3, styles: { halign: 'center' } },
            { content: 'PROM. ANUAL', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: 'EVALUACIÓN DEL COMPORTAMIENTO', colSpan: 3, styles: { halign: 'center' } },
            { content: 'COMP. ANUAL', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } },
            { content: 'ESTADO', rowSpan: 2, styles: { valign: 'middle', halign: 'center' } }
          ],
          [
            '1er Trim.', '2do Trim.', '3er Trim.',
            '1er T.', '2do T.', '3er T.'
          ]
        ];

        const bodyData = datosResumenAnualActual.map(d => [
          d.num,
          d.nombres,
          d.t1,
          d.t2,
          d.t3,
          d.promAnual,
          d.ct1,
          d.ct2,
          d.ct3,
          d.compAnual,
          d.estado
        ]);

        doc.autoTable({
          head: headers,
          body: bodyData,
          margin: { top: 48, bottom: 32, left: 12, right: 12 },
          theme: 'grid',
          styles: { 
            fontSize: 7.5, 
            cellPadding: 1.5, 
            lineColor: [200, 200, 200], 
            lineWidth: 0.1,
            valign: 'middle'
          },
          headStyles: { 
            fillColor: [30, 41, 59], 
            textColor: [255, 255, 255], 
            fontStyle: 'bold' 
          },
          columnStyles: {
            0: { cellWidth: 10, halign: 'center' },
            1: { cellWidth: 68, halign: 'left' },
            2: { cellWidth: 17, halign: 'center' },
            3: { cellWidth: 17, halign: 'center' },
            4: { cellWidth: 17, halign: 'center' },
            5: { cellWidth: 22, halign: 'center', fontStyle: 'bold', fillColor: [241, 245, 249] },
            6: { cellWidth: 24, halign: 'center' },
            7: { cellWidth: 24, halign: 'center' },
            8: { cellWidth: 24, halign: 'center' },
            9: { cellWidth: 24, halign: 'center', fontStyle: 'bold' },
            10: { cellWidth: 26, halign: 'center', fontStyle: 'bold' }
          },
          didDrawPage: function (data) {
            const pageNumber = doc.internal.getNumberOfPages();

            // ----------------------------------------------------
            // A. LOGOS IZQUIERDO Y DERECHO
            // ----------------------------------------------------
            if (imgLogoIzq) {
              try { doc.addImage(imgLogoIzq, 'PNG', 12, 8, 20, 20); } catch(e){}
            }
            if (imgLogoDer) {
              try { doc.addImage(imgLogoDer, 'PNG', 265, 8, 20, 20); } catch(e){}
            }

            // ----------------------------------------------------
            // B. MEMBRETE INSTITUCIONAL (Líneas 1 a 4)
            // ----------------------------------------------------
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(11);
            doc.setTextColor(30, 41, 59);
            doc.text(nomArriba, 148.5, 11, { align: 'center' });

            doc.setFontSize(13);
            doc.text(nomAbajo, 148.5, 16, { align: 'center' });

            doc.setFontSize(9.5);
            doc.text('CUADRO CONSOLIDADO GENERAL DE CALIFICACIONES ANUALES', 148.5, 21, { align: 'center' });

            doc.setFont('helvetica', 'normal');
            doc.setFontSize(7.5);
            doc.setTextColor(71, 85, 105);
            doc.text(`AMIE: ${amie} | DISTRITO: ${distrito} | CIRCUITO: ${circuito} | ${dir1} | AÑO LECTIVO: ${periodo}`, 148.5, 25.5, { align: 'center' });
            if (frase1) {
              doc.setFont('helvetica', 'italic');
              doc.text(frase1, 148.5, 29, { align: 'center' });
            }

            // ----------------------------------------------------
            // C. DATOS DEL CURSO Y ASIGNATURA
            // ----------------------------------------------------
            doc.setFont('helvetica', 'bold');
            doc.setFontSize(8);
            doc.setTextColor(15, 23, 42);

            // Barra delimitadora
            doc.setDrawColor(203, 213, 225);
            doc.setLineWidth(0.3);
            doc.line(12, 33, 285, 33);

            doc.text(`CURSO: ${nombreCursoLargo}`, 12, 38);
            doc.text(`ASIGNATURA: ${nombreMateria}`, 12, 43);
            doc.text(`DOCENTE: ${nombreDocenteActual}`, 180, 43);

            doc.line(12, 45, 285, 45);

            // ----------------------------------------------------
            // D. PIE DE PÁGINA Y FIRMAS EN TODAS LAS HOJAS
            // ----------------------------------------------------
            const footerY = 188;
            doc.setFont('helvetica', 'normal');
            doc.setFontSize(7.5);
            doc.setTextColor(30, 41, 59);

            // Líneas de firma
            doc.setLineWidth(0.2);
            doc.line(25, footerY, 85, footerY);
            doc.line(118, footerY, 178, footerY);
            doc.line(212, footerY, 272, footerY);

            // Docente
            doc.setFont('helvetica', 'bold');
            doc.text('DOCENTE RESPONSABLE', 55, footerY + 4, { align: 'center' });
            doc.setFont('helvetica', 'normal');
            doc.text(nombreDocenteActual, 55, footerY + 8, { align: 'center' });

            // Secretaria
            doc.setFont('helvetica', 'bold');
            doc.text('SECRETARIO/A GENERAL', 148.5, footerY + 4, { align: 'center' });
            doc.setFont('helvetica', 'normal');
            doc.text(nombreSecretaria, 148.5, footerY + 8, { align: 'center' });

            // Rector
            doc.setFont('helvetica', 'bold');
            doc.text('RECTOR / DIRECTOR', 242, footerY + 4, { align: 'center' });
            doc.setFont('helvetica', 'normal');
            doc.text(nombreRector, 242, footerY + 8, { align: 'center' });

            // Numeración de página
            doc.setFontSize(7);
            doc.setTextColor(148, 163, 184);
            doc.text(`Página ${pageNumber}`, 285, 202, { align: 'right' });
          }
        });

        doc.save(`Sábana_Anual_${nombreCursoLargo.replace(/\s+/g, '_')}_${nombreMateria.replace(/\s+/g, '_')}.pdf`);
      } catch (err) {
        alert('Error al exportar PDF: ' + err.message);
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '📄 Descargar PDF';
      }
    }

    // ==========================================
    // GUARDAR NOTAS GENERAL
    // ==========================================
    async function guardarDatos() {
      const asigId = document.getElementById('selectMateria').value;
      const trimestreVal = document.getElementById('selectTrimestre').value;
      const vistaVal = document.getElementById('selectVista').value;

      if (vistaVal === 'comp1' || vistaVal === 'comp2') {
        const parcialNum = vistaVal === 'comp1' ? 1 : 2;
        const trimestre = parseInt(trimestreVal);
        const btn = document.getElementById('btnGuardarComp');
        btn.disabled = true;

        try {
          const filas = document.querySelectorAll('#tablaCuerpoComp tr');
          const payload = [];

          filas.forEach(tr => {
            const estId = tr.getAttribute('data-estudiante-id');
            if (estId) {
              payload.push({
                asignacion_id: parseInt(asigId),
                estudiante_id: parseInt(estId),
                trimestre: trimestre,
                parcial: parcialNum,
                ind1: parseFloat(tr.querySelector('.c-ind1').value) || 0,
                ind2: parseFloat(tr.querySelector('.c-ind2').value) || 0,
                ind3: parseFloat(tr.querySelector('.c-ind3').value) || 0,
                ind4: parseFloat(tr.querySelector('.c-ind4').value) || 0,
                ind5: parseFloat(tr.querySelector('.c-ind5').value) || 0,
                ind6: parseFloat(tr.querySelector('.c-ind6').value) || 0,
                ind7: parseFloat(tr.querySelector('.c-ind7').value) || 0,
                ind8: parseFloat(tr.querySelector('.c-ind8').value) || 0,
                ind9: parseFloat(tr.querySelector('.c-ind9').value) || 0,
                ind10: parseFloat(tr.querySelector('.c-ind10').value) || 0,
                total_cuantitativo: parseFloat(tr.querySelector('.total-cuant').innerText) || 0,
                total_cualitativo: tr.querySelector('.total-cualit').innerText
              });
            }
          });

          const { error } = await supabaseClient.from('comportamiento_parcial').upsert(payload, {
            onConflict: 'asignacion_id,estudiante_id,trimestre,parcial'
          });

          if (error) throw error;
          alert('¡Comportamiento guardado con éxito!');
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          btn.disabled = false;
        }

      } else if (trimestreVal !== 'anual' && (vistaVal === 'p1' || vistaVal === 'p2')) {
        const parcialNum = vistaVal === 'p1' ? 1 : 2;
        const trimestre = parseInt(trimestreVal);
        const btn = document.getElementById('btnGuardarParcial');
        btn.disabled = true;

        try {
          await supabaseClient.from('config_parcial_cabeceras').upsert({
            asignacion_id: parseInt(asigId),
            trimestre: trimestre,
            parcial: parcialNum,
            actividades_insumo1: configActividades.insumo1,
            actividades_insumo2: configActividades.insumo2
          }, { onConflict: 'asignacion_id,trimestre,parcial' });

          const filas = document.querySelectorAll('#tablaCuerpo tr');
          const payload = [];

          filas.forEach(tr => {
            const estId = tr.getAttribute('data-estudiante-id');
            if (estId) {
              const notas1 = Array.from(tr.querySelectorAll('.nota-i1')).map(i => i.value !== '' ? parseFloat(i.value) : 0);
              const notas2 = Array.from(tr.querySelectorAll('.nota-i2')).map(i => i.value !== '' ? parseFloat(i.value) : 0);
              const prom1 = parseFloat(tr.querySelector('.prom-i1').innerText) || 0;
              const prom2 = parseFloat(tr.querySelector('.prom-i2').innerText) || 0;
              const total = parseFloat(tr.querySelector('.nota-parcial').innerText) || 0;

              payload.push({
                asignacion_id: parseInt(asigId),
                estudiante_id: parseInt(estId),
                trimestre: trimestre,
                parcial: parcialNum,
                insumo1_notas: notas1,
                insumo2_notas: notas2,
                promedio_insumo1: prom1,
                promedio_insumo2: prom2,
                nota_parcial: total
              });
            }
          });

          const { error: errNotas } = await supabaseClient.from('notas_parcial_actividades').upsert(payload, {
            onConflict: 'asignacion_id,estudiante_id,trimestre,parcial'
          });
          if (errNotas) throw errNotas;

          alert('¡Notas del parcial guardadas con éxito!');
        } catch (err) {
          alert('Error al guardar: ' + err.message);
        } finally {
          btn.disabled = false;
        }

      } else if (trimestreVal !== 'anual' && vistaVal === 'resumen_trimestre') {
        const trimestre = parseInt(trimestreVal);
        const btn = document.getElementById('btnGuardarResumen');
        btn.disabled = true;

        try {
          const filas = document.querySelectorAll('#tablaCuerpoTrimestre tr');
          const payload = [];

          filas.forEach(tr => {
            const estId = tr.getAttribute('data-estudiante-id');
            if (estId) {
              const ex = parseFloat(tr.querySelector('.nota-examen').value) || 0;
              const comp = tr.getAttribute('data-comp-letra') || 'A';
              const p1 = parseFloat(tr.querySelector('.p1-val').innerText) || 0;
              const p2 = parseFloat(tr.querySelector('.p2-val').innerText) || 0;

              payload.push({
                asignacion_id: parseInt(asigId),
                estudiante_id: parseInt(estId),
                trimestre: trimestre,
                p1_insumo1: p1,
                p1_insumo2: p1,
                p2_insumo1: p2,
                p2_insumo2: p2,
                examen: ex,
                comportamiento: comp
              });
            }
          });

          const { error } = await supabaseClient.from('notas_trimestre').upsert(payload, {
            onConflict: 'asignacion_id,estudiante_id,trimestre'
          });

          if (error) throw error;
          alert('¡Examen trimestral guardado con éxito!');
        } catch (err) {
          alert('Error al guardar: ' + err.message);
        } finally {
          btn.disabled = false;
        }
      }
    }

    document.addEventListener('DOMContentLoaded', verificarSesion);
  </script>
