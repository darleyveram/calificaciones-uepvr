    function generarDiasHabilesRango(fInicioStr, fFinStr) {
      const dias = [];
      const nombresDias = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
      const nombresMeses = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
      let cur = new Date(fInicioStr + 'T00:00:00');
      const fin = new Date(fFinStr + 'T00:00:00');

      while (cur <= fin) {
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          const yyyy = cur.getFullYear();
          const mm = String(cur.getMonth() + 1).padStart(2, '0');
          const dd = String(cur.getDate()).padStart(2, '0');
          dias.push({ iso: `${yyyy}-${mm}-${dd}`, diaNum: dd, nombreDia: nombresDias[day], nombreMes: nombresMeses[cur.getMonth()] });
        }
        cur.setDate(cur.getDate() + 1);
      }
      return dias;
    }

    function formatearNombreVisual(nombreCompleto) {
      if (!nombreCompleto) return '';
      const esMovil = window.innerWidth <= 768;
      if (!esMovil) return nombreCompleto;

      const partes = nombreCompleto.trim().split(/\s+/);
      if (partes.length >= 3) return `${partes[0]} ${partes[2]}`;
      if (partes.length === 2) return `${partes[0]} ${partes[1]}`;
      return partes[0];
    }

    function obtenerEscalaCualitativa(nota) {
      if (nota === null || nota === '' || isNaN(nota)) return '-';
      const n = parseFloat(nota);
      if (n >= 10.00) return 'A+';
      if (n >= 9.00) return 'A-';
      if (n >= 8.00) return 'B+';
      if (n >= 7.00) return 'B-';
      if (n >= 6.00) return 'C+';
      if (n >= 5.00) return 'C-';
      if (n >= 4.00) return 'D+';
      if (n >= 3.00) return 'D-';
      if (n >= 2.00) return 'E+';
      if (n >= 1.00) return 'E-';
      return 'F';
    }

    function obtenerEscalaComportamiento(nota) {
      if (nota === null || nota === '' || isNaN(nota)) return { letra: 'A', desc: 'Lidera el cumplimiento de los compromisos establecidos para la sana convivencia social.' };
      const n = parseFloat(nota);
      if (n >= 9.00) return { letra: 'A', desc: 'Lidera el cumplimiento de los compromisos establecidos para la sana convivencia social.' };
      if (n >= 7.00) return { letra: 'B', desc: 'Cumple con los compromisos establecidos para la sana convivencia social.' };
      if (n >= 5.00) return { letra: 'C', desc: 'Falla ocasionalmente en el cumplimiento de los compromisos establecidos.' };
      if (n >= 4.00) return { letra: 'D', desc: 'Presenta dificultades en el cumplimiento de los compromisos establecidos.' };
      return { letra: 'E', desc: 'No cumple con los compromisos establecidos para la sana convivencia social.' };
    }

    async function obtenerBase64DesdeUrl(url) {
      if (!url) return null;
      if (url.startsWith('data:image')) return url;
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = 'Anonymous';
        img.onload = function () {
          try {
            const canvas = document.createElement('canvas');
            canvas.width = img.naturalWidth || img.width;
            canvas.height = img.naturalHeight || img.height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          } catch (err) { resolve(null); }
        };
        img.onerror = () => resolve(null);
        let urlFinal = url;
        if (url.includes('drive.google.com')) {
          const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
          if (match && match[1]) urlFinal = `https://lh3.googleusercontent.com/d/${match[1]}`;
        }
        img.src = urlFinal;
      });
    }

    function obtenerClaseColor(valor, esPromedio = false) {
      if (isNaN(valor) || valor === null || valor === '') return '';
      const n = parseFloat(valor);
      if (n < 4.00) return 'nota-baja-roja';
      if (n < 7.00) return 'nota-media-amarilla';
      if (esPromedio && n === 10.00) return 'nota-perfecta-10';
      if (esPromedio && n >= 7.00) return 'nota-aprobada-verde';
      return '';

        document.getElementById('seccionApp').classList.remove('d-none');
        document.getElementById('usuarioConectado').innerText = `Docente: ${nombreDocente}`;
        
        const { data: cursosT } = await supabaseClient.from('cursos').select('*').eq('tutor_id', session.user.id);
        cursosTutor = cursosT || [];

        const esAdmin = perfil?.rol === 'admin';
        const esTutor = cursosTutor.length > 0;
        const puedeVerAsistencia = (esAdmin || perfil?.puede_gestionar_asistencia === true);

        if (esTutor) document.getElementById('badgeTutorInfo').classList.remove('d-none');
        if (puedeVerAsistencia) document.getElementById('optModoAsistencia').classList.remove('d-none');
        if (esAdmin || esTutor) document.getElementById('optModoTutoria').classList.remove('d-none');

        await cargarCatalogo();
        await cargarPeriodosAsistenciaDB();
        await cargarCursosYMaterias(session.user.id, perfil?.rol, perfil?.puede_gestionar_asistencia);
      } else {
        document.getElementById('seccionLogin').classList.remove('d-none');
        document.getElementById('seccionApp').classList.add('d-none');
      }
    }

      const password = document.getElementById('loginPassword').value;
      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
      if (error) {
        const errDiv = document.getElementById('loginError');
        errDiv.innerText = error.message;
        errDiv.classList.remove('d-none');
      } else {
        verificarSesion();
      }

    async function cerrarSesion() {
      await supabaseClient.auth.signOut();
      location.reload();
    }

    async function cargarCatalogo() {
      const { data } = await supabaseClient.from('catalogo_actividades').select('nombre').order('nombre');
      catalogo = data && data.length > 0 ? data.map(d => d.nombre) : ['Deber', 'Lección en clases', 'Actuación en clases', 'Trabajo Grupal', 'Colaboración en el Aula'];
    }

    async function cargarPeriodosAsistenciaDB() {
      const { data } = await supabaseClient.from('asistencia_periodos').select('*').order('trimestre').order('parcial');
      periodosAsistencia = data || [];
    }

    async function cargarCursosYMaterias(userId, userRol, puedeAsistencia) {
      const { data: cData } = await supabaseClient.from('cursos').select('id, nombre, nombre_largo_mayuscula').order('id');
      todosCursos = cData || [];

      let query = supabaseClient.from('curso_materia_docente').select(`
        id, curso_id, materia_id, docente_id, docente_id_2, docente_id_3, es_optativa,
        cursos(id, nombre, nombre_largo_mayuscula),
        materias(id, nombre)
      `);

      if (userRol !== 'admin') {
        query = query.or(`docente_id.eq.${userId},docente_id_2.eq.${userId},docente_id_3.eq.${userId}`);
      }

      const { data } = await query;
      todasAsignaciones = data || [];

      alCambiarModo();
    }

    function alCambiarModo() {
      const modo = document.getElementById('selectModo').value;
      const boxMateria = document.getElementById('boxMateria');
      const boxVista = document.getElementById('boxVista');
      const boxParcialAsist = document.getElementById('boxParcialAsistencia');
      const boxParcialTut = document.getElementById('boxParcialTutoria');
      const optAnual = document.getElementById('optTrimAnual');
      const selectCurso = document.getElementById('selectCurso');

      const esAdmin = usuarioActualPerfil?.rol === 'admin';
      const puedeVerAsistencia = (esAdmin || usuarioActualPerfil?.puede_gestionar_asistencia === true);
      const cursoSeleccionadoPrevio = selectCurso.value;

      if (modo === 'tutoria') {
        boxMateria.classList.add('d-none');
        boxVista.classList.add('d-none');
        boxParcialAsist.classList.add('d-none');
        boxParcialTut.classList.remove('d-none');
        optAnual.classList.add('d-none');
        if (document.getElementById('selectTrimestre').value === 'anual') document.getElementById('selectTrimestre').value = '1';

        const cursosDisponibles = esAdmin ? todosCursos : cursosTutor;
        selectCurso.innerHTML = '<option value="">Seleccione curso...</option>' + 
          cursosDisponibles.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');

        if (cursoSeleccionadoPrevio && cursosDisponibles.some(c => String(c.id) === String(cursoSeleccionadoPrevio))) {
          selectCurso.value = cursoSeleccionadoPrevio;
        } else if (cursosDisponibles.length > 0) {
          selectCurso.value = cursosDisponibles[0].id;
        }

      } else if (modo === 'asistencia') {
        boxMateria.classList.add('d-none');
        boxVista.classList.add('d-none');
        boxParcialAsist.classList.remove('d-none');
        boxParcialTut.classList.add('d-none');
        optAnual.classList.add('d-none');
        if (document.getElementById('selectTrimestre').value === 'anual') document.getElementById('selectTrimestre').value = '1';

        const cursosDisponibles = puedeVerAsistencia ? todosCursos : Array.from(new Map(todasAsignaciones.map(a => [a.cursos.id, a.cursos])).values());

        selectCurso.innerHTML = '<option value="">Seleccione curso...</option>' + 
          cursosDisponibles.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');

        if (cursoSeleccionadoPrevio && cursosDisponibles.some(c => String(c.id) === String(cursoSeleccionadoPrevio))) {
          selectCurso.value = cursoSeleccionadoPrevio;
        } else if (cursosDisponibles.length > 0) {
          selectCurso.value = cursosDisponibles[0].id;
        }

      } else {
        boxMateria.classList.remove('d-none');
        boxVista.classList.remove('d-none');
        boxParcialAsist.classList.add('d-none');
        boxParcialTut.classList.add('d-none');
        optAnual.classList.remove('d-none');

        const cursosMap = new Map();
        todasAsignaciones.forEach(a => { if (a.cursos) cursosMap.set(String(a.cursos.id), a.cursos.nombre); });

        selectCurso.innerHTML = '<option value="">Seleccione curso...</option>';
        cursosMap.forEach((nombre, id) => {
          selectCurso.innerHTML += `<option value="${id}">${nombre}</option>`;
        });

        if (cursoSeleccionadoPrevio && cursosMap.has(String(cursoSeleccionadoPrevio))) {
          selectCurso.value = cursoSeleccionadoPrevio;
        } else if (cursosMap.size > 0) {
          selectCurso.value = Array.from(cursosMap.keys())[0];
        }
      }

      alCambiarCurso();
    }

    function alCambiarCurso() {
      const modo = document.getElementById('selectModo').value;
      const cursoId = document.getElementById('selectCurso').value;
      const selectMateria = document.getElementById('selectMateria');

      if (modo === 'calificaciones') {
        if (!cursoId) {
          selectMateria.innerHTML = '<option value="">Seleccione materia...</option>';
          selectMateria.disabled = true;
          cambiarFiltro();
          return;
        }

        const materiasDelCurso = todasAsignaciones.filter(a => String(a.curso_id) === String(cursoId));
        selectMateria.innerHTML = '<option value="">Seleccione materia...</option>' + 
          materiasDelCurso.map(a => `<option value="${a.id}">${a.materias.nombre} ${a.es_optativa ? '(Optativa)' : ''}</option>`).join('');
        
        selectMateria.disabled = false;
        if (materiasDelCurso.length > 0) {
          selectMateria.value = String(materiasDelCurso[0].id);
        } else {
          selectMateria.value = "";
        }
      }

      cambiarFiltro();
    }

    function cambiarFiltro() {
      const modo = document.getElementById('selectModo').value;
      const cursoId = document.getElementById('selectCurso').value;
      const asigId = document.getElementById('selectMateria').value.trim();
      const trimestreVal = document.getElementById('selectTrimestre').value;
      const vistaVal = document.getElementById('selectVista').value;
      const controles = document.querySelectorAll('.btn-control');
      
      const accParcial = document.getElementById('accionesParcial');
      const accComp = document.getElementById('accionesComportamiento');
      const accResumen = document.getElementById('accionesResumen');
      const accAnual = document.getElementById('accionesAnual');
      const accAsist = document.getElementById('accionesAsistencia');
      const accTutoria = document.getElementById('accionesTutoria');

      accParcial.classList.add('d-none');
      accComp.classList.add('d-none');
      accResumen.classList.add('d-none');
      accAnual.classList.add('d-none');
      accAsist.classList.add('d-none');
      accTutoria.classList.add('d-none');

      if (modo === 'tutoria') {
        accTutoria.classList.remove('d-none');
        if (!cursoId) {
          document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso de Tutoría para consultar el consolidado y emitir libretas.</div>';
          return;
        }
        cargarVistaConsolidadoTutoria();
        return;
      }

      if (modo === 'asistencia') {
        accAsist.classList.remove('d-none');
        if (!cursoId) {
          controles.forEach(b => b.disabled = true);
          document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso para gestionar la Asistencia.</div>';
          return;
        }
        controles.forEach(b => b.disabled = false);
        cargarVistaAsistencia();
        return;
      }

      if (trimestreVal === 'anual') {
        document.getElementById('boxVista').classList.add('d-none');
        accAnual.classList.remove('d-none');
      } else {
        document.getElementById('boxVista').classList.remove('d-none');
        if (vistaVal === 'comp1' || vistaVal === 'comp2') accComp.classList.remove('d-none');
        else if (vistaVal === 'resumen_trimestre') accResumen.classList.remove('d-none');
        else accParcial.classList.remove('d-none');
      }

      if (!asigId) {
        controles.forEach(b => b.disabled = true);
        document.getElementById('contenedorTabla').innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso y una Materia para visualizar las calificaciones.</div>';
        return;
      }
      
      controles.forEach(b => b.disabled = false);

      if (trimestreVal === 'anual') cargarVistaResumenAnual();
      else if (vistaVal === 'comp1' || vistaVal === 'comp2') cargarVistaComportamiento(vistaVal === 'comp1' ? 1 : 2);
      else if (vistaVal === 'resumen_trimestre') cargarVistaResumenTrimestre();
      else cargarVistaParcial(vistaVal === 'p1' ? 1 : 2);
    }

    // =========================================================================
    // VISTA: CONSOLIDADO TUTORÍA Y GENERACIÓN DE REPORTES EN PDF (SIN CRUCES)
    // =========================================================================
    async function cargarVistaConsolidadoTutoria() {
      const reqId = ++currentViewRequestId;
      const cursoId = document.getElementById('selectCurso').value;
      const trimestre = parseInt(document.getElementById('selectTrimestre').value);
      const reporteTipo = document.getElementById('selectParcialTutoria').value;
      const contenedor = document.getElementById('contenedorTabla');

      contenedor.innerHTML = '<div class="py-4 text-center"><div class="spinner-border text-primary me-2"></div>Cargando consolidado de tutoría...</div>';

      try {
        const { data: estData } = await supabaseClient.from('estudiantes').select('*').eq('curso_id', parseInt(cursoId)).order('nombres');
        if (reqId !== currentViewRequestId) return;
        estudiantes = estData || [];

        const { data: asigCurso } = await supabaseClient.from('curso_materia_docente').select(`id, curso_id, materia_id, es_optativa, materias(id, nombre)`).eq('curso_id', parseInt(cursoId));
        if (reqId !== currentViewRequestId) return;
        
        let listaAsignaciones = asigCurso || [];
        listaAsignaciones.sort((a, b) => {
          if (a.es_optativa === b.es_optativa) return (a.materias?.nombre || '').localeCompare(b.materias?.nombre || '');
          return a.es_optativa ? 1 : -1;
        });

        const asigIds = listaAsignaciones.map(a => a.id);

        let notasP1 = {}, notasP2 = {};
        if (asigIds.length > 0) {
          const { data: nData } = await supabaseClient.from('notas_parcial_actividades').select('asignacion_id, estudiante_id, parcial, nota_parcial').in('asignacion_id', asigIds).eq('trimestre', trimestre);
          if (reqId !== currentViewRequestId) return;
          (nData || []).forEach(n => {
            if (n.parcial === 1) {
              if (!notasP1[n.estudiante_id]) notasP1[n.estudiante_id] = {};
              notasP1[n.estudiante_id][n.asignacion_id] = n.nota_parcial;
            } else if (n.parcial === 2) {
              if (!notasP2[n.estudiante_id]) notasP2[n.estudiante_id] = {};
              notasP2[n.estudiante_id][n.asignacion_id] = n.nota_parcial;
            }
          });
        }

        let examenesMap = {};
        if (reporteTipo === 'trimestre' && asigIds.length > 0) {
          const { data: tData } = await supabaseClient.from('notas_trimestre').select('asignacion_id, estudiante_id, examen').in('asignacion_id', asigIds).eq('trimestre', trimestre);
          if (reqId !== currentViewRequestId) return;
          (tData || []).forEach(t => {
            if (!examenesMap[t.estudiante_id]) examenesMap[t.estudiante_id] = {};
            examenesMap[t.estudiante_id][t.asignacion_id] = parseFloat(t.examen) || 0;
          });
        }

        let compMapP1 = {}, compMapP2 = {};
        if (asigIds.length > 0) {
          const { data: cData } = await supabaseClient.from('comportamiento_parcial').select('estudiante_id, parcial, total_cuantitativo').in('asignacion_id', asigIds).eq('trimestre', trimestre);
          if (reqId !== currentViewRequestId) return;
          (cData || []).forEach(c => {
            if (c.parcial === 1) {
              if (!compMapP1[c.estudiante_id]) compMapP1[c.estudiante_id] = [];
              compMapP1[c.estudiante_id].push(parseFloat(c.total_cuantitativo) || 10);
            } else if (c.parcial === 2) {
              if (!compMapP2[c.estudiante_id]) compMapP2[c.estudiante_id] = [];
              compMapP2[c.estudiante_id].push(parseFloat(c.total_cuantitativo) || 10);
            }
          });
        }

        const { data: asistData } = await supabaseClient.from('asistencia_estudiantes').select('*').eq('curso_id', parseInt(cursoId)).eq('trimestre', trimestre);
        if (reqId !== currentViewRequestId) return;
        
        const asistMapP1 = {}, asistMapP2 = {};
        (asistData || []).forEach(a => {
          if (a.parcial === 1) asistMapP1[a.estudiante_id] = a;
          if (a.parcial === 2) asistMapP2[a.estudiante_id] = a;
        });

        const perP1 = periodosAsistencia.find(p => p.trimestre === trimestre && p.parcial === 1) || { total_dias_laborados: 34 };
        const perP2 = periodosAsistencia.find(p => p.trimestre === trimestre && p.parcial === 2) || { total_dias_laborados: 35 };

        datosConsolidadoTutoria = estudiantes.map((est, idx) => {
          let sumaNotasObligatorias = 0;
          let cantObligatorias = 0;
          let materiasDetalle = [];

          listaAsignaciones.forEach(a => {
            const nP1 = notasP1[est.id] && notasP1[est.id][a.id] !== undefined ? parseFloat(notasP1[est.id][a.id]) : 0;
            const nP2 = notasP2[est.id] && notasP2[est.id][a.id] !== undefined ? parseFloat(notasP2[est.id][a.id]) : 0;
            const nEx = examenesMap[est.id] && examenesMap[est.id][a.id] !== undefined ? parseFloat(examenesMap[est.id][a.id]) : 0;

            let notaFinalMateria = 0;
            if (reporteTipo === '1') notaFinalMateria = nP1;
            else if (reporteTipo === '2') notaFinalMateria = nP2;
            else {
              notaFinalMateria = (nP1 * 0.35) + (nP2 * 0.35) + (nEx * 0.30);
            }

            const cualit = obtenerEscalaCualitativa(notaFinalMateria);

            if (!a.es_optativa) {
              sumaNotasObligatorias += notaFinalMateria;
              cantObligatorias++;
            }

            materiasDetalle.push({
              materiaNombre: a.materias?.nombre || 'Materia',
              p1: nP1.toFixed(2),
              p2: nP2.toFixed(2),
              examen: nEx.toFixed(2),
              notaNum: notaFinalMateria.toFixed(2),
              notaCualit: cualit,
              esOptativa: a.es_optativa
            });
          });

          const promGeneral = cantObligatorias > 0 ? (sumaNotasObligatorias / cantObligatorias) : 0;
          const promCualit = obtenerEscalaCualitativa(promGeneral);

          const arrP1 = compMapP1[est.id] || [10];
          const promP1Comp = arrP1.reduce((a, b) => a + b, 0) / arrP1.length;
          const arrP2 = compMapP2[est.id] || [10];
          const promP2Comp = arrP2.reduce((a, b) => a + b, 0) / arrP2.length;

          let compFinalNum = 10;
          if (reporteTipo === '1') compFinalNum = promP1Comp;
          else if (reporteTipo === '2') compFinalNum = promP2Comp;
          else compFinalNum = (promP1Comp + promP2Comp) / 2;

          const compObj = obtenerEscalaComportamiento(compFinalNum);

          const r1 = asistMapP1[est.id] || {};
          const r2 = asistMapP2[est.id] || {};

          let a1 = r1.total_asistencias || 0, j1 = r1.total_justificadas || 0, t1 = perP1.total_dias_laborados || 34;
          let f1 = Math.max(t1 - a1 - j1, 0);

          let a2 = r2.total_asistencias || 0, j2 = r2.total_justificadas || 0, t2 = perP2.total_dias_laborados || 35;
          let f2 = Math.max(t2 - a2 - j2, 0);

          let finalAsist = { asistidos: 0, faltasInjust: 0, faltasJust: 0, totalDias: 0 };
          if (reporteTipo === '1') {
            finalAsist = { asistidos: a1, faltasInjust: f1, faltasJust: j1, totalDias: t1 };
          } else if (reporteTipo === '2') {
            finalAsist = { asistidos: a2, faltasInjust: f2, faltasJust: j2, totalDias: t2 };
          } else {
            finalAsist = { asistidos: a1 + a2, faltasInjust: f1 + f2, faltasJust: j1 + j2, totalDias: t1 + t2 };
          }

          const repNom = est.representante_nombres || `${est.rep_apellidos || ''} ${est.rep_nombres || ''}`.trim() || 'REPRESENTANTE LEGAL';
          const repCed = est.rep_cedula ? `C.I.: ${est.rep_cedula}` : '';

          return {
            num: idx + 1,
            estudianteId: est.id,
            nombres: est.nombres,
            cedula: est.cedula || 'S/N',
            representanteNombre: repNom,
            representanteCedula: repCed,
            materias: materiasDetalle,
            promedioGeneral: promGeneral.toFixed(2),
            promedioCualitativo: promCualit,
            comportamientoNum: compFinalNum.toFixed(2),
            comportamientoLetra: compObj.letra,
            comportamientoDesc: compObj.desc,
            asistencia: finalAsist
          };
        });

        let thMaterias = listaAsignaciones.map(a => `<th style="font-size:0.68rem; min-width: 85px;">${a.materias?.nombre}<br><span class="badge ${a.es_optativa ? 'bg-warning text-dark' : 'bg-secondary'}">${a.es_optativa ? 'Opt' : 'Obl'}</span></th>`).join('');
        const tituloPeriodo = reporteTipo === 'trimestre' ? `${trimestre}° TRIMESTRE (CONSOLIDADO)` : `${trimestre}° TRIMESTRE - PARCIAL ${reporteTipo}`;

        let html = `
          <table class="table table-bordered table-sm mb-0 align-middle">
            <thead class="table-dark">
              <tr>
                <th rowspan="2" class="sticky-col-num">N°</th>
                <th rowspan="2" class="sticky-col-nombre text-center">NÓMINA DE ESTUDIANTES</th>
                <th colspan="${listaAsignaciones.length}">CALIFICACIONES POR ASIGNATURA (${tituloPeriodo})</th>
                <th rowspan="2" class="bg-primary text-white" style="width: 90px;">PROM. GENERAL</th>
                <th rowspan="2" class="bg-success text-white" style="width: 75px;">COMP.</th>
                <th rowspan="2" class="bg-secondary text-white" style="width: 70px;">ASIST.</th>
                <th rowspan="2" style="width: 90px;">LIBRETA</th>
              </tr>
              <tr class="bg-secondary text-white">
                ${thMaterias}
              </tr>
            </thead>
            <tbody>
              ${datosConsolidadoTutoria.map((d, idx) => {
                let celdasNotas = d.materias.map(m => `
                  <td class="${obtenerClaseColor(m.notaNum, false)}" style="white-space: nowrap;">
                    <span class="fw-bold">${m.notaCualit}</span> <small class="text-muted">(${m.notaNum})</small>
                  </td>
                `).join('');

                return `
                  <tr>
                    <td class="sticky-col-num fw-bold text-muted">${d.num}</td>
                    <td class="sticky-col-nombre" title="${d.nombres}">${formatearNombreVisual(d.nombres)}</td>
                    ${celdasNotas}
                    <td class="fw-bold fs-6 ${obtenerClaseColor(d.promedioGeneral, true)}" style="white-space: nowrap;">
                      ${d.promedioGeneral} <small>(${d.promedioCualitativo})</small>
                    </td>
                    <td class="fw-bold" style="white-space: nowrap;">
                      ${d.comportamientoLetra} <small>(${d.comportamientoNum})</small>
                    </td>
                    <td><span class="badge bg-light text-dark border">${d.asistencia.asistidos}/${d.asistencia.totalDias}</span></td>
                    <td>
                      <button class="btn btn-xs btn-outline-danger py-1 px-2 fw-bold" onclick="generarBoletaIndividualPDF(${idx})">
                        <i class="bi bi-file-pdf"></i> Boleta
                      </button>
                    </td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;

        if (reqId === currentViewRequestId) {
          contenedor.innerHTML = html;
        }
      } catch (err) {
        if (reqId === currentViewRequestId) {
          contenedor.innerHTML = `<div class="py-4 text-danger text-center fw-bold">Error al cargar tutoría: ${err.message}</div>`;
        }
      }
    }

    function construirPaginaLibreta(doc, est, cursoNombreLargo, trimestre, reporteTipo, nombreRector, imgLogoIzq, imgLogoDer) {
      const nomArriba = (infoInstitucion?.nombre_arriba || 'Unidad Educativa Particular').toUpperCase();
      const nomAbajo = (infoInstitucion?.nombre_abajo || '"Vicente Rocafuerte"').toUpperCase();
      const periodo = infoInstitucion?.periodo_lectivo || '2026-2027';
      const amie = infoInstitucion?.amie || '13H03021';
      const distrito = infoInstitucion?.distrito || '13D08';
      const circuito = infoInstitucion?.circuito || '13D08C0_b';
      const dir1 = infoInstitucion?.direccion_1 || 'Pichincha - Manabí - Ecuador';
      const frase1 = infoInstitucion?.frase_1 ? `"${infoInstitucion.frase_1}"` : '';

      const esTrimestral = (reporteTipo === 'trimestre');
      const tituloDocumento = esTrimestral

    async function descargarTodasBoletasEnZip() {
      if (!datosConsolidadoTutoria || datosConsolidadoTutoria.length === 0) return alert('No hay datos para exportar.');

      const btn = document.getElementById('btnDescargarZipIndividuales');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Generando ZIP...';

      try {
        const { jsPDF } = window.jspdf;
        const zip = new JSZip();

        const cursoId = document.getElementById('selectCurso').value;
        const trimestre = parseInt(document.getElementById('selectTrimestre').value);
        const reporteTipo = document.getElementById('selectParcialTutoria').value;

        const cursoInfo = todosCursos.find(c => c.id == cursoId);
        const nombreCursoLargo = (cursoInfo?.nombre_largo_mayuscula || cursoInfo?.nombre || '').toUpperCase();
        const nombreCursoFormat = (cursoInfo?.nombre || nombreCursoLargo).replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '');
        const nombreRector = 'ING. DÍDIMO A. SALTOS S.';

        const imgLogoIzq = await obtenerBase64DesdeUrl(infoInstitucion?.logo_izquierdo || infoInstitucion?.logo_institucion);
        const imgLogoDer = await obtenerBase64DesdeUrl(infoInstitucion?.logo_derecho || infoInstitucion?.escudo_nacional);

        for (let i = 0; i < datosConsolidadoTutoria.length; i++) {
          const est = datosConsolidadoTutoria[i];
          const doc = new jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' });
          construirPaginaLibreta(doc, est, nombreCursoLargo, trimestre, reporteTipo, nombreRector, imgLogoIzq, imgLogoDer);

          const nombreEstFormat = est.nombres.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '');
          const sufijo = (reporteTipo === 'trimestre') ? `TRIMESTRE_${trimestre}` : `TRIMESTRE_${trimestre}_PARCIAL_${reporteTipo}`;
          const nombreArchivo = `${nombreCursoFormat}_${nombreEstFormat}_${sufijo}.pdf`;

          const pdfBlob = doc.output('blob');
          zip.file(nombreArchivo, pdfBlob);
        }

        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const sufijoZip = (reporteTipo === 'trimestre') ? `TRIMESTRE_${trimestre}` : `TRIMESTRE_${trimestre}_PARCIAL_${reporteTipo}`;
        saveAs(zipBlob, `BOLETAS_${nombreCursoFormat}_${sufijoZip}.zip`);
      } catch (err) {
        alert('Error al generar ZIP: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="bi bi-file-earmark-zip-fill me-1"></i>Individuales (ZIP)';
      }
    }

    function alternarEstadoAsistencia(input) {
      const actual = input.value.toUpperCase();
      let siguiente = actual === '' ? 'A' : (actual === 'A' ? 'F' : (actual === 'F' ? 'J' : ''));
      input.value = siguiente;
      input.className = 'cell-asig-input';
      if (siguiente === 'A') input.classList.add('asig-a');
      else if (siguiente === 'F') input.classList.add('asig-f');
      else if (siguiente === 'J') input.classList.add('asig-j');
      calcularFilaAsistencia(input.closest('tr'));
    }

    function calcularFilaAsistencia(tr) {
      const inputs = Array.from(tr.querySelectorAll('.cell-asig-input'));
      let a = 0, f = 0, j = 0;
      inputs.forEach(inp => {
        const v = inp.value.toUpperCase();
        if (v === 'A') a++; else if (v === 'F') f++; else if (v === 'J') j++;
      });

      const trimestre = parseInt(document.getElementById('selectTrimestre').value);
      const parcial = parseInt(document.getElementById('selectParcialAsistencia').value);
      const per = periodosAsistencia.find(p => p.trimestre === trimestre && p.parcial === parcial);
      const metaDias = per ? per.total_dias_laborados : diasHabilesParcialActual.length;
      const faltantes = Math.max(metaDias - a, 0);

      tr.querySelector('.sum-a').innerText = a;
      tr.querySelector('.sum-f').innerText = f;
      tr.querySelector('.sum-j').innerText = j;
      tr.querySelector('.total-asist').innerText = a;
      tr.querySelector('.dias-faltantes').innerText = faltantes;
    }

    function llenarDiaColumna(fechaIso, tipo) {
      document.querySelectorAll(`#tablaCuerpoAsistencia .cell-asig-input[data-iso="${fechaIso}"]`).forEach(inp => {
        inp.value = tipo;
        inp.className = 'cell-asig-input';
        if (tipo === 'A') inp.classList.add('asig-a');
        else if (tipo === 'F') inp.classList.add('asig-f');
      });
      document.querySelectorAll('#tablaCuerpoAsistencia tr').forEach(fila => calcularFilaAsistencia(fila));
    }

    function llenarTodoConAsistencia() {
      document.querySelectorAll('#tablaCuerpoAsistencia .cell-asig-input').forEach(inp => {
        inp.value = 'A';
        inp.className = 'cell-asig-input asig-a';
      });
      document.querySelectorAll('#tablaCuerpoAsistencia tr').forEach(fila => calcularFilaAsistencia(fila));
    }

    function limpiarTodaAsistencia() {
      if (!confirm('¿Desea poner en blanco todas las casillas de este parcial?')) return;
      document.querySelectorAll('#tablaCuerpoAsistencia .cell-asig-input').forEach(inp => {
        inp.value = '';
        inp.className = 'cell-asig-input';
      });
      document.querySelectorAll('#tablaCuerpoAsistencia tr').forEach(fila => calcularFilaAsistencia(fila));
    }

    async function guardarAsistencia() {
      const cursoId = parseInt(document.getElementById('selectCurso').value);
      const trimestre = parseInt(document.getElementById('selectTrimestre').value);
      const parcial = parseInt(document.getElementById('selectParcialAsistencia').value);
      const btn = document.getElementById('btnGuardarAsist');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span> Guardando...';

      try {
        const filas = document.querySelectorAll('#tablaCuerpoAsistencia tr');
        const payload = [];

        filas.forEach(tr => {
          const estId = parseInt(tr.getAttribute('data-est-id'));
          if (estId) {
            const regDiario = {};
            tr.querySelectorAll('.cell-asig-input').forEach(inp => {
              const iso = inp.getAttribute('data-iso');
              if (inp.value) regDiario[iso] = inp.value.toUpperCase();
            });

            payload.push({
              curso_id: cursoId,
              estudiante_id: estId,
              trimestre: trimestre,
              parcial: parcial,
              registro_diario: regDiario,
              total_asistencias: parseInt(tr.querySelector('.sum-a').innerText) || 0,
              total_faltas: parseInt(tr.querySelector('.sum-f').innerText) || 0,
              total_justificadas: parseInt(tr.querySelector('.sum-j').innerText) || 0,
              total_dias: parseInt(tr.querySelector('.total-asist').innerText) || 0,
              dias_faltantes: parseInt(tr.querySelector('.dias-faltantes').innerText) || 0
            });
          }
        });

        const { error } = await supabaseClient.from('asistencia_estudiantes').upsert(payload, { onConflict: 'curso_id,estudiante_id,trimestre,parcial' });
        if (error) throw error;
        alert('¡Control de Asistencia guardado con éxito!');
      } catch (err) {
        alert('Error al guardar asistencia: ' + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = '💾 Guardar';
      }
    }

                const cp2 = compP2[est.id] !== undefined ? compP2[est.id] : 10;
                const compPromNum = (cp1 + cp2) / 2;
                const compCualit = convertirCualitativo(compPromNum);

                return `
                  <tr data-estudiante-id="${est.id}" data-comp-num="${compPromNum.toFixed(2)}" data-comp-letra="${compCualit}">
                    <td class="sticky-col-num fw-bold text-muted">${idx + 1}</td>
                    <td class="sticky-col-nombre" title="${est.nombres}">${formatearNombreVisual(est.nombres)}</td>
                    <td class="p1-val">${p1.toFixed(2)}</td>
                    <td class="p2-val">${p2.toFixed(2)}</td>
                    <td><input type="number" step="0.5" min="0" max="10" class="form-control form-control-sm input-nota-app nota-examen" value="${ex}" oninput="validarYCalcularTrimestre(this)"></td>
                    <td class="total-trimestre">0.00</td>
                    <td class="comp-trimestral-badge fw-bold">${compPromNum.toFixed(2)} (${compCualit})</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;

        if (reqId === currentViewRequestId) {
          contenedor.innerHTML = html;
          document.querySelectorAll('#tablaCuerpoTrimestre tr').forEach(fila => calcularFilaTrimestre(fila));
        }
      } catch (err) {
        if (reqId === currentViewRequestId) contenedor.innerHTML = `<div class="py-4 text-danger text-center fw-bold">Error: ${err.message}</div>`;
      }
    }

    async function cargarVistaResumenAnual() {
      const reqId = ++currentViewRequestId;
      const asigId = document.getElementById('selectMateria').value.trim();
      const contenedor = document.getElementById('contenedorTabla');
      contenedor.innerHTML = '<div class="py-4 text-center"><div class="spinner-border text-primary me-2"></div>Cargando sábana anual...</div>';

      const asig = todasAsignaciones.find(a => String(a.id) === asigId);
      if (!asig) {
        if (reqId === currentViewRequestId) contenedor.innerHTML = '<div class="py-4 text-muted text-center">Seleccione un Curso y una Materia.</div>';
        return;
      }

      try {
        const { data: estData } = await supabaseClient.from('estudiantes').select('*').eq('curso_id', parseInt(asig.curso_id)).order('nombres');
        if (reqId !== currentViewRequestId) return;
        estudiantes = estData || [];

        const { data: pData } = await supabaseClient.from('notas_parcial_actividades').select('*').eq('asignacion_id', parseInt(asigId));
        const { data: tData } = await supabaseClient.from('notas_trimestre').select('*').eq('asignacion_id', parseInt(asigId));
        const { data: cData } = await supabaseClient.from('comportamiento_parcial').select('*').eq('asignacion_id', parseInt(asigId));
        if (reqId !== currentViewRequestId) return;

        const notasMatriz = {}, compMatriz = {};
        estudiantes.forEach(e => {
          notasMatriz[e.id] = { 1: { p1: 0, p2: 0, ex: 0 }, 2: { p1: 0, p2: 0, ex: 0 }, 3: { p1: 0, p2: 0, ex: 0 } };
          compMatriz[e.id] = { 1: { p1: 10, p2: 10 }, 2: { p1: 10, p2: 10 }, 3: { p1: 10, p2: 10 } };
        });

        (pData || []).forEach(n => {
          if (notasMatriz[n.estudiante_id] && notasMatriz[n.estudiante_id][n.trimestre]) {
            if (n.parcial === 1) notasMatriz[n.estudiante_id][n.trimestre].p1 = n.nota_parcial || 0;
            if (n.parcial === 2) notasMatriz[n.estudiante_id][n.trimestre].p2 = n.nota_parcial || 0;
          }
        });

        (tData || []).forEach(t => {
          if (notasMatriz[t.estudiante_id] && notasMatriz[t.estudiante_id][t.trimestre]) {
            notasMatriz[t.estudiante_id][t.trimestre].ex = t.examen || 0;
          }
        });

        (cData || []).forEach(c => {
          if (compMatriz[c.estudiante_id] && compMatriz[c.estudiante_id][c.trimestre]) {
            if (c.parcial === 1) compMatriz[c.estudiante_id][c.trimestre].p1 = parseFloat(c.total_cuantitativo) || 0;
            if (c.parcial === 2) compMatriz[c.estudiante_id][c.trimestre].p2 = parseFloat(c.total_cuantitativo) || 0;
          }
        });

        datosResumenAnualActual = [];

        let html = `
          <table class="table table-bordered table-sm mb-0 align-middle">
            <thead>
              <tr>
                <th rowspan="2" class="sticky-col-num">No.</th>
                <th rowspan="2" class="sticky-col-nombre text-center">Apellidos y Nombres</th>
                <th colspan="3" class="bg-dark text-white">CALIFICACIONES ACADÉMICAS</th>
                <th rowspan="2" class="bg-dark text-white" style="width: 95px;">Promedio Anual</th>
                <th colspan="3" class="bg-dark text-white">COMPORTAMIENTO</th>
                <th rowspan="2" class="bg-dark text-white" style="width: 100px;">Comp. Anual</th>
                <th rowspan="2" class="bg-dark text-white" style="width: 110px;">Estado</th>
              </tr>
              <tr class="bg-secondary text-white">
                <th style="width: 75px;">1er Trim.</th>
                <th style="width: 75px;">2do Trim.</th>
                <th style="width: 75px;">3er Trim.</th>
                <th style="width: 70px;">1er T.</th>
                <th style="width: 70px;">2do T.</th>
                <th style="width: 70px;">3er T.</th>
              </tr>
            </thead>
            <tbody>
              ${estudiantes.map((est, idx) => {
                const reg = notasMatriz[est.id] || {};
                const cReg = compMatriz[est.id] || {};
                
                const t1 = (reg[1].p1 * 0.35) + (reg[1].p2 * 0.35) + (reg[1].ex * 0.30);
                const t2 = (reg[2].p1 * 0.35) + (reg[2].p2 * 0.35) + (reg[2].ex * 0.30);
                const t3 = (reg[3].p1 * 0.35) + (reg[3].p2 * 0.35) + (reg[3].ex * 0.30);
                const promAnual = (t1 + t2 + t3) / 3;

                const ct1 = (cReg[1].p1 + cReg[1].p2) / 2;
                const ct2 = (cReg[2].p1 + cReg[2].p2) / 2;
                const ct3 = (cReg[3].p1 + cReg[3].p2) / 2;
                const promCompAnual = (ct1 + ct2 + ct3) / 3;
                const letraCompAnual = convertirCualitativo(promCompAnual);

                const obsBadge = promAnual >= 7 ? '<span class="badge bg-success">APROBADO</span>' : (promAnual >= 4 ? '<span class="badge bg-warning text-dark">SUPLETORIO</span>' : '<span class="badge bg-danger">REPROBADO</span>');
                const estadoTexto = promAnual >= 7 ? 'APROBADO' : (promAnual >= 4 ? 'SUPLETORIO' : 'REPROBADO');

                datosResumenAnualActual.push({
                  num: idx + 1,
                  nombres: est.nombres,
                  t1: t1.toFixed(2),
                  t2: t2.toFixed(2),
                  t3: t3.toFixed(2),
                  promAnual: promAnual.toFixed(2),
                  ct1: `${ct1.toFixed(2)} (${convertirCualitativo(ct1)})`,
                  ct2: `${ct2.toFixed(2)} (${convertirCualitativo(ct2)})`,
                  ct3: `${ct3.toFixed(2)} (${convertirCualitativo(ct3)})`,
                  compAnual: `${promCompAnual.toFixed(2)} (${letraCompAnual})`,
                  estado: estadoTexto
                });

                return `
                  <tr>
                    <td class="sticky-col-num fw-bold text-muted">${idx + 1}</td>
                    <td class="sticky-col-nombre" title="${est.nombres}">${formatearNombreVisual(est.nombres)}</td>
                    <td class="${obtenerClaseColor(t1, false)}">${t1.toFixed(2)}</td>
                    <td class="${obtenerClaseColor(t2, false)}">${t2.toFixed(2)}</td>
                    <td class="${obtenerClaseColor(t3, false)}">${t3.toFixed(2)}</td>
                    <td class="${obtenerClaseColor(promAnual, true)}">${promAnual.toFixed(2)}</td>
                    <td>${ct1.toFixed(2)} (${convertirCualitativo(ct1)})</td>
                    <td>${ct2.toFixed(2)} (${convertirCualitativo(ct2)})</td>
                    <td>${ct3.toFixed(2)} (${convertirCualitativo(ct3)})</td>
                    <td class="fw-bold">${promCompAnual.toFixed(2)} (${letraCompAnual})</td>
                    <td>${obsBadge}</td>
                  </tr>
                `;
              }).join('')}
            </tbody>
          </table>
        `;
        if (reqId === currentViewRequestId) contenedor.innerHTML = html;
      } catch (err) {
        if (reqId === currentViewRequestId) contenedor.innerHTML = `<div class="py-4 text-danger text-center fw-bold">Error: ${err.message}</div>`;
      }
    }

    // =========================================================================
    // ACCIONES DE GUARDADO (BD)
    // =========================================================================
    async function guardarDatos() {
      const asigId = document.getElementById('selectMateria').value.trim();
      const trimestreVal = document.getElementById('selectTrimestre').value;
      const vistaVal = document.getElementById('selectVista').value;

      if (vistaVal === 'comp1' || vistaVal === 'comp2') {
        const parcialNum = vistaVal === 'comp1' ? 1 : 2;
        const trimestre = parseInt(trimestreVal);
        const btn = document.getElementById('btnGuardarComp');
        btn.disabled = true;

        try {
          const filas = document.querySelectorAll('#tablaCuerpoComp tr');
          const payload = [];

          filas.forEach(tr => {
            const estId = tr.getAttribute('data-estudiante-id');
            if (estId) {
              payload.push({
                asignacion_id: parseInt(asigId),
                estudiante_id: parseInt(estId),
                trimestre: trimestre,
                parcial: parcialNum,
                ind1: parseFloat(tr.querySelector('.c-ind1').value) || 0,
                ind2: parseFloat(tr.querySelector('.c-ind2').value) || 0,
                ind3: parseFloat(tr.querySelector('.c-ind3').value) || 0,
                ind4: parseFloat(tr.querySelector('.c-ind4').value) || 0,
                ind5: parseFloat(tr.querySelector('.c-ind5').value) || 0,
                ind6: parseFloat(tr.querySelector('.c-ind6').value) || 0,
                ind7: parseFloat(tr.querySelector('.c-ind7').value) || 0,
                ind8: parseFloat(tr.querySelector('.c-ind8').value) || 0,
                ind9: parseFloat(tr.querySelector('.c-ind9').value) || 0,
                ind10: parseFloat(tr.querySelector('.c-ind10').value) || 0,
                total_cuantitativo: parseFloat(tr.querySelector('.total-cuant').innerText) || 0,
                total_cualitativo: tr.querySelector('.total-cualit').innerText
              });
            }
          });

          const { error } = await supabaseClient.from('comportamiento_parcial').upsert(payload, { onConflict: 'asignacion_id,estudiante_id,trimestre,parcial' });
          if (error) throw error;
          alert('¡Comportamiento guardado con éxito!');
        } catch (err) {
          alert('Error: ' + err.message);
        } finally {
          btn.disabled = false;
        }

      } else if (trimestreVal !== 'anual' && (vistaVal === 'p1' || vistaVal === 'p2')) {
        const parcialNum = vistaVal === 'p1' ? 1 : 2;
        const trimestre = parseInt(trimestreVal);
        const btn = document.getElementById('btnGuardarParcial');
        btn.disabled = true;

        try {
          await supabaseClient.from('config_parcial_cabeceras').upsert({
            asignacion_id: parseInt(asigId),
            trimestre: trimestre,
            parcial: parcialNum,
            actividades_insumo1: configActividades.insumo1,
            actividades_insumo2: configActividades.insumo2
          }, { onConflict: 'asignacion_id,trimestre,parcial' });

          const filas = document.querySelectorAll('#tablaCuerpo tr');
          const payload = [];

          filas.forEach(tr => {
            const estId = tr.getAttribute('data-estudiante-id');
            if (estId) {
              const notas1 = Array.from(tr.querySelectorAll('.nota-i1')).map(i => i.value !== '' ? parseFloat(i.value) : 0);
              const notas2 = Array.from(tr.querySelectorAll('.nota-i2')).map(i => i.value !== '' ? parseFloat(i.value) : 0);
              const prom1 = parseFloat(tr.querySelector('.prom-i1').innerText) || 0;
              const prom2 = parseFloat(tr.querySelector('.prom-i2').innerText) || 0;
              const total = parseFloat(tr.querySelector('.nota-parcial').innerText) || 0;

              payload.push({
                asignacion_id: parseInt(asigId),
                estudiante_id: parseInt(estId),
                trimestre: trimestre,
                parcial: parcialNum,
                insumo1_notas: notas1,
                insumo2_notas: notas2,
                promedio_insumo1: prom1,
                promedio_insumo2: prom2,
                nota_parcial: total
              });
            }
          });

          const { error: errNotas } = await supabaseClient.from('notas_parcial_actividades').upsert(payload, { onConflict: 'asignacion_id,estudiante_id,trimestre,parcial' });
          if (errNotas) throw errNotas;

          alert('¡Notas del parcial guardadas con éxito!');
        } catch (err) {
          alert('Error al guardar: ' + err.message);
        } finally {
          btn.disabled = false;
        }

      } else if (trimestreVal !== 'anual' && vistaVal === 'resumen_trimestre') {
        const trimestre = parseInt(trimestreVal);
        const btn = document.getElementById('btnGuardarResumen');
        btn.disabled = true;

        try {
          const filas = document.querySelectorAll('#tablaCuerpoTrimestre tr');
          const payload = [];

          filas.forEach(tr => {
            const estId = tr.getAttribute('data-estudiante-id');
            if (estId) {
              const ex = parseFloat(tr.querySelector('.nota-examen').value) || 0;
              const comp = tr.getAttribute('data-comp-letra') || 'A';
              const p1 = parseFloat(tr.querySelector('.p1-val').innerText) || 0;
              const p2 = parseFloat(tr.querySelector('.p2-val').innerText) || 0;

              payload.push({
                asignacion_id: parseInt(asigId),
                estudiante_id: parseInt(estId),
                trimestre: trimestre,
                p1_insumo1: p1,
                p1_insumo2: p1,
                p2_insumo1: p2,
                p2_insumo2: p2,
                examen: ex,
                comportamiento: comp
              });
            }
          });

          const { error } = await supabaseClient.from('notas_trimestre').upsert(payload, { onConflict: 'asignacion_id,estudiante_id,trimestre' });
          if (error) throw error;
          alert('¡Examen trimestral guardado con éxito!');
        } catch (err) {
          alert('Error al guardar: ' + err.message);
        } finally {
          btn.disabled = false;
        }
      }
    }

    document.addEventListener('DOMContentLoaded', verificarSesion);
    window.addEventListener('resize', () => {
      document.querySelectorAll('#tablaCuerpo tr, #tablaCuerpoAsistencia tr').forEach(tr => {
        const celda = tr.querySelector('.sticky-col-nombre');
        if (celda && celda.getAttribute('title')) {
          celda.innerText = formatearNombreVisual(celda.getAttribute('title'));
        }
      });
    });
  </script>
</body>
</html>
